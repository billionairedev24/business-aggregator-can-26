# Auth integration tests: shared PostGIS Testcontainer (@ServiceConnection), Flyway applies db/migrations (no seed),
# in-memory sessions, SMS codes captured by RecordingSms.
spring:
  autoconfigure.exclude:
    - org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  flyway.enabled: true
  modulith.events:                      # S-28: no Kafka; UserRegisteredEventsTest turns it on against Testcontainers
    externalization.enabled: false
    republish-outstanding-events-on-restart: false
management.health.redis.enabled: false
server.servlet.session.cookie.secure: false
logging.level:
  org.testcontainers: warn
  tc: warn
northline:
  auth:
    # S-9: in memory for the suite (every MockMvc call comes from 127.0.0.1, so the IP scope is effectively off);
    # the rate-limit tests use Valkey (Testcontainers) and their own limits.
    rate-limits:
      store: memory
      limits:
        otp-send.ip.max: 100000
        otp-verify.ip.max: 100000
        sign-in-lookup.ip.max: 100000
        totp-verify.ip.max: 100000
        backup-code-verify.ip.max: 100000
        passkey-assertion.ip.max: 100000
        step-up.ip.max: 100000
        security-change.ip.max: 100000
    signing:
      local-dir: ${java.io.tmpdir}/northline-auth-test-signing-keys
    totp-key: bm9ydGhsaW5lLWxvY2FsLWRldi10b3RwLWtleS0zMmI=
    login-page: http://localhost:3100/sign-in
    allowed-origins: [ "http://localhost:3100" ]
    webauthn:
      rp-id: localhost
      origins: [ "http://localhost:3100" ]
  oauth:
    clients:
      studio-bff:
        secret-hash: "{noop}dev-studio-bff"
        redirect-uris: [ "http://localhost:3100/login/oauth2/code/studio" ]
        post-logout-redirect-uris: [ "http://localhost:3100/sign-in" ]
      consumer-bff:
        secret-hash: "{noop}dev-consumer-bff"
        redirect-uris: [ "http://localhost:8081/login/oauth2/code/northline" ]
        post-logout-redirect-uris: [ "http://localhost:8081/" ]
      console-bff:
        secret-hash: "{noop}dev-console-bff"
        redirect-uris: [ "http://localhost:8083/login/oauth2/code/console" ]
        post-logout-redirect-uris: [ "http://localhost:8083/" ]
