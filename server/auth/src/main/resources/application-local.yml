# `./gradlew :auth:bootRun --args='--spring.profiles.active=local'` — Postgres only (no Redis: in-memory sessions).
# Applies db/migrations + db/seed-dev itself (a no-op when the api already migrated the same database).
# Codes "sent" by SMS are written to the log: look for "Verification code".
spring:
  autoconfigure.exclude:
    - org.springframework.boot.session.data.redis.autoconfigure.SessionDataRedisAutoConfiguration
  # S-28: no Kafka locally — user.registered isn't sent (like the api's local; turn it on with the compose `events`).
  modulith.events:
    externalization.enabled: false
    republish-outstanding-events-on-restart: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed-dev
    # S-62: migrations above the seed range (V110+ consumer, V120+ search) may already be applied when the dev seed
    # (V100–V109) comes along — a database migrated without `local` first, or a seed file added later.
    out-of-order: true
management.health.redis.enabled: false
server.servlet.session.cookie.secure: false
logging.level:
  ca.northline: debug
northline:
  auth:
    # S-9: without Valkey the limits live in memory (logged at start-up); `local,valkey` keeps them in your Valkey.
    rate-limits.store: ${RATE_LIMIT_STORE:memory}
    replay.store: ${REPLAY_STORE:memory}       # S-29: one-time ids and DPoP nonces, likewise
    # Dev-only key: the TOTP secret seeded for the personas in db/seed-dev/V101__auth.sql is encrypted with it.
    totp-key: bm9ydGhsaW5lLWxvY2FsLWRldi10b3RwLWtleS0zMmI=
    login-page: http://localhost:3100/sign-in
    consumer-login-page: http://localhost:3000/sign-in
    # S-45: the consumer app's dev server (:3000) calls the JSON API too (sign-out; S-62's sign-in pages).
    allowed-origins: [ "http://localhost:3100", "http://127.0.0.1:3100", "http://localhost:8082", "http://localhost:3000", "http://127.0.0.1:3000" ]
    webauthn:
      rp-id: localhost
      origins: [ "http://localhost:3100", "http://localhost:8082", "http://localhost:3000" ]
  oauth:
    clients:
      studio-bff:
        redirect-uris:
          - http://localhost:3100/login/oauth2/code/studio
          - http://127.0.0.1:3100/login/oauth2/code/studio
          - http://localhost:8082/login/oauth2/code/studio
        post-logout-redirect-uris: [ "http://localhost:3100/sign-in" ]
      consumer-bff:
        secret-hash: ${CONSUMER_BFF_SECRET_HASH:{noop}dev-consumer-bff}
        # S-45: the consumer app's dev server (:3000) proxies /login and /oauth2 to the consumer-bff (:8081).
        redirect-uris:
          - http://localhost:3000/login/oauth2/code/northline
          - http://127.0.0.1:3000/login/oauth2/code/northline
          - http://localhost:8081/login/oauth2/code/northline
        post-logout-redirect-uris: [ "http://localhost:3000/" ]
      console-bff:
        secret-hash: ${CONSOLE_BFF_SECRET_HASH:{noop}dev-console-bff}
        redirect-uris: [ "http://localhost:8083/login/oauth2/code/console" ]
        post-logout-redirect-uris: [ "http://localhost:8083/" ]
