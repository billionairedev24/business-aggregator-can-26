# Production (also activates `cloud`, see application-cloud.yml). ClientSeeder is off under prod: OAuth clients must
# already exist in auth.oauth2_registered_client (see docs/runbooks/prod.md, "Blockers").
# Token signing keys live in the cloud KMS (S-7, docs/runbooks/key-rotation.md); KMS_PROVIDER=local is refused.
northline.required-env:
  signing-key: KMS_KEY_ID             # + KMS_PROVIDER (application-cloud.yml)
