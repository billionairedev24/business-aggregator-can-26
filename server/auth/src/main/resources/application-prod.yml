# Production (also activates `cloud`, see application-cloud.yml). OAuth clients are reconciled from northline.oauth.clients
# at start-up (S-122): https redirect URIs and {bcrypt} secret hashes only.
# Token signing keys live in the cloud KMS (S-7, docs/runbooks/key-rotation.md); KMS_PROVIDER=local is refused.
northline.required-env:
  signing-key: KMS_KEY_ID             # + KMS_PROVIDER (application-cloud.yml)
  sms-provider: SMS_PROVIDER, SMS_FROM   # S-8: twilio or aws; `local` is refused here (SmsConfig)
  federation: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, APPLE_CLIENT_ID, APPLE_TEAM_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY  # S-18
