spring:
  application.name: northline-auth
  threads.virtual.enabled: true
  datasource: { url: "jdbc:postgresql://localhost:5432/northline?currentSchema=auth", username: northline, password: northline }
  data.redis.host: localhost
  security.oauth2:
    authorizationserver.issuer: http://localhost:9000
    client.registration:
      google: { client-id: "${GOOGLE_CLIENT_ID:dev}", client-secret: "${GOOGLE_CLIENT_SECRET:dev}", scope: openid,email,profile }
      apple:  { client-id: "${APPLE_CLIENT_ID:dev}", client-secret: "${APPLE_CLIENT_SECRET:dev}", authorization-grant-type: authorization_code, redirect-uri: "{baseUrl}/login/oauth2/code/apple", scope: openid,email,name }
    client.provider.apple: { issuer-uri: https://appleid.apple.com }
server.port: 9000
