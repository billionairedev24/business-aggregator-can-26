# Shape shared by the deployed environments. Activated by the `dev`, `staging` and `prod` profiles (profile group in
# application.yml); never activate it directly. Values come from the environment (docs/runbooks/dev.md, staging.md,
# prod.md). Compared with `local`: Redis/Valkey sessions, Secure cookies, no Flyway (the api migrates), no dev seed,
# no fixed dev TOTP key, SMS through northline.sms.provider (S-8: dev may keep `local`, staging/prod require twilio or aws).
northline.required-env:                 # checked before start-up (ca.northline.platform.RequiredEnvironmentCheck)
  database: DB_URL, DB_USER, DB_PASSWORD
  cache: REDIS_HOST
  public-urls: AUTH_ISSUER, STUDIO_ORIGIN, CONSUMER_ORIGIN, CONSOLE_ORIGIN, WEBAUTHN_RP_ID
  secrets: TOTP_KEY, STUDIO_BFF_SECRET_HASH  # CONSUMER_/CONSOLE_BFF_SECRET_HASH: optional until those BFFs exist (S-122)
  signing-provider: KMS_PROVIDER      # dev may use `local` + SIGNING_KEYS_DIR on a shared volume; staging/prod a KMS
management.endpoint.health.probes.enabled: true
logging.level:
  ca.northline: info
