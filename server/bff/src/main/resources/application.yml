# studio-bff — the browser holds only an HttpOnly session cookie (NL_STUDIO); tokens stay in the server-side session
# (Valkey/Redis). Every URL and secret is an environment variable with a local default (docs/runbooks/README.md).
# Profiles: `local` (application-local.yml: in-memory session, no Redis), `test`, and `dev` | `staging` | `prod`,
# which also activate `cloud` (application-cloud.yml: required variables checked at start-up).
# S-45: the same jar is the consumer-bff with the `consumer` profile added (application-consumer.yml: client
# consumer-bff, cookie NL_CONSUMER, port 8081, anonymous browsing). The studio client below is registered only without it.
spring:
  application.name: northline-studio-bff
  threads.virtual.enabled: true
  profiles.group:
    dev: cloud
    staging: cloud
    prod: cloud
  data.redis:                             # Valkey 8 or Redis 7+ (sessions)
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl.enabled: ${REDIS_SSL:false}
  session:
    data.redis.namespace: nl:studio-bff   # Boot 4 name (spring.session.redis.* is ignored)
    timeout: 12h                          # "sessions expire after 12 h idle"
  security.oauth2.client:
    provider:
      northline:                          # explicit endpoints: no discovery at start-up, no userinfo call
        # Browser-facing (public) auth URL, then the in-cluster one for back-channel calls; both default to AUTH_ISSUER.
        authorization-uri: ${AUTH_PUBLIC_URL:${AUTH_ISSUER:http://localhost:9000}}/oauth2/authorize
        token-uri: ${AUTH_INTERNAL_URL:${AUTH_ISSUER:http://localhost:9000}}/oauth2/token
        jwk-set-uri: ${AUTH_INTERNAL_URL:${AUTH_ISSUER:http://localhost:9000}}/oauth2/jwks
        user-name-attribute: sub
server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: native
  servlet.session:
    timeout: 12h
    # Host-only (no Domain): only studio.<zone> ever sees it. The cloud profiles use the __Host- prefix (S-20).
    cookie: { name: NL_STUDIO, http-only: true, secure: true, same-site: lax }
management.endpoints.web.exposure.include: health,info
northline.bff:
  registration-id: studio
  api-uri: ${API_URL:http://localhost:8080}
  revocation-uri: ${AUTH_INTERNAL_URL:${AUTH_ISSUER:http://localhost:9000}}/oauth2/revoke
  # S-19: a session whose sign-in was revoked at northline-auth ends within this interval (introspection of its
  # refresh token); a refused refresh ends it too. docs/runbooks/README.md § Sessions.
  introspection-uri: ${AUTH_INTERNAL_URL:${AUTH_ISSUER:http://localhost:9000}}/oauth2/introspect
  session-check-interval: ${SESSION_CHECK_INTERVAL:60s}
  sign-in-page: /sign-in
---
# The Studio's OAuth client — not registered under the `consumer` profile (application-consumer.yml has its own).
spring.config.activate.on-profile: "!consumer"
spring.security.oauth2.client.registration:
  studio:
    provider: northline
    client-id: studio-bff
    client-secret: ${STUDIO_BFF_SECRET:dev-studio-bff}   # plain; northline-auth stores its hash (STUDIO_BFF_SECRET_HASH)
    client-authentication-method: client_secret_basic
    authorization-grant-type: authorization_code
    redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
    scope: openid,profile,merchant
---
# Local runs read server/.env (or .env next to the jar) — KEY=value lines, see server/.env.example. Never under `test`.
spring.config.activate.on-profile: "!test"
spring.config.import: optional:file:.env[.properties],optional:file:../.env[.properties]
