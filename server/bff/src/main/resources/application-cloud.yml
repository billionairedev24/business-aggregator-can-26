# Shape shared by the deployed environments. Activated by the `dev`, `staging` and `prod` profiles (profile group in
# application.yml); never activate it directly. Compared with `local`: Valkey/Redis sessions, Secure cookies.
northline.required-env:                 # checked before start-up (ca.northline.platform.RequiredEnvironmentCheck)
  cache: REDIS_HOST
  public-urls: AUTH_ISSUER, API_URL
management.endpoint.health.probes.enabled: true
# S-20: __Host- cookies are Secure, path /, without a Domain — a sibling subdomain (pages., the consumer apex) can
# neither plant nor overwrite them. Locally (http) they keep their plain names.
northline.bff.csrf-cookie-name: __Host-XSRF-TOKEN
logging.level:
  ca.northline: info
---
spring.config.activate.on-profile: "!consumer & !console"
northline.required-env.secrets: STUDIO_BFF_SECRET
server.servlet.session.cookie.name: __Host-NL_STUDIO
---
# S-45 consumer-bff on the consumer host (the apex, pages.): its own client secret and cookie.
spring.config.activate.on-profile: consumer
northline.required-env.secrets: CONSUMER_BFF_SECRET
server.servlet.session.cookie.name: __Host-NL_CONSUMER
---
# S-90 console-bff on console.<zone>: its own client secret and cookie.
spring.config.activate.on-profile: console
northline.required-env.secrets: CONSOLE_BFF_SECRET
server.servlet.session.cookie.name: __Host-NL_CONSOLE
