# northline-worker — Kafka consumers (search indexer, notifications, partner webhooks). Every connection is
# an environment variable with a local default (docs/runbooks/README.md); locally it needs the `events` and `search`
# compose profiles plus Postgres. Profiles `dev` | `staging` | `prod` also activate `cloud` (application-cloud.yml).
spring:
  application.name: northline-worker
  threads.virtual.enabled: true
  profiles.group:
    dev: cloud
    staging: cloud
    prod: cloud
  datasource:                           # events.processed_events (consumer dedupe)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/northline}
    username: ${DB_USER:northline}
    password: ${DB_PASSWORD:northline}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:10}   # handler transaction + separate delivery claims per record (S-27)
  data.redis:                           # Valkey 8 or Redis 7+
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl.enabled: ${REDIS_SSL:false}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:                           # S-26: records are parsed by ca.northline.worker.events.EnvelopeParser
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      auto-offset-reset: earliest       # a new consumer group starts at the oldest retained event
      max-poll-records: 50
    producer:                           # retry and .dlq records (the original key, value and headers)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties.enable.idempotence: true
    listener:
      ack-mode: record                  # commit after each record: a restart redelivers at most the one in hand
      observation-enabled: true         # traceparent → the listener's trace (when tracing is on)
  lifecycle.timeout-per-shutdown-phase: 30s
server:
  port: ${SERVER_PORT:8084}             # health + metrics only (S-14, S-26): the worker serves no API
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,prometheus   # prometheus: consumer lag, DLQ and outcome counters (S-26)
  endpoint.health.probes.enabled: true  # /actuator/health/liveness and /readiness for Kubernetes
logging.pattern.correlation: "[%X{consumer:-}|%X{eventType:-}|%X{eventId:-}|%X{traceId:-}] "   # S-26: every consumer log line names its event
northline:
  events:                               # S-26 consumer framework (docs/runbooks/events.md)
    shutdown-timeout: ${EVENTS_SHUTDOWN_TIMEOUT:20s}      # finish the record in hand on SIGTERM
    processed-retention: ${EVENTS_PROCESSED_RETENTION:60d} # dedupe claims kept (> DLQ retention 30 d)
  topics:                               # S-25 topic provisioning (TopicsCommand; deploy/kafka/topics.yaml)
    catalogue: ${KAFKA_TOPICS_CATALOGUE:}                 # blank = the packaged classpath:kafka/topics.yaml
    replication-factor: ${KAFKA_REPLICATION_FACTOR:}      # blank = the broker's default.replication.factor
    min-insync-replicas: ${KAFKA_MIN_INSYNC_REPLICAS:}    # blank = not set on the topics (broker default)
  # Notifications (S-27, docs/runbooks/notifications.md): the payout.failed email through the shared email library
  # (same settings as the api, docs/runbooks/email.md) and SMS through the shared SMS library (same settings as
  # northline-auth). `local` = Mailpit / the log; staging and prod refuse `local` for both.
  # Region configuration the worker needs (S-134; the api's northline.region, docs/runbooks/regions.md): nightly jobs
  # run in the platform zone; quiet hours use each business's own zone from the region rows.
  region:
    default-province: ${REGION_DEFAULT_PROVINCE:${SEARCH_DEFAULT_MARKET:AB}}
    platform-zone: ${REGION_PLATFORM_ZONE:America/Edmonton}
  email:
    provider: ${EMAIL_PROVIDER:local}
    from: ${EMAIL_FROM:Northline <no-reply@northline.ca>}
    reply-to: ${EMAIL_REPLY_TO:}
    mailing-address: ${EMAIL_MAILING_ADDRESS:Northline Marketplace Inc. · 1200 – 8th Avenue SW, Calgary, Alberta T2P 1B5, Canada}
    contact: ${EMAIL_CONTACT:support@northline.ca}
    time-zone: ${EMAIL_TIME_ZONE:${REGION_PLATFORM_ZONE:America/Edmonton}}   # dates in emails (S-134)
    region: ${EMAIL_REGION:}
    endpoint: ${EMAIL_ENDPOINT:}
    api-key: ${EMAIL_API_KEY:}
    configuration-set: ${EMAIL_CONFIGURATION_SET:}
    smtp: { host: "${SMTP_HOST:localhost}", port: "${SMTP_PORT:1025}", username: "${SMTP_USERNAME:}", password: "${SMTP_PASSWORD:}", starttls: "${SMTP_STARTTLS:false}" }
    retry: { attempts: "${EMAIL_RETRY_ATTEMPTS:2}", backoff: "${EMAIL_RETRY_BACKOFF:1s}" }   # short: Kafka retries on top
  sms:
    provider: ${SMS_PROVIDER:local}
    from: ${SMS_FROM:}
    voice-from: ${SMS_VOICE_FROM:}
    account-id: ${SMS_ACCOUNT_ID:}
    auth-token: ${SMS_AUTH_TOKEN:}
    region: ${SMS_REGION:}
    endpoint: ${SMS_ENDPOINT:}
  notifications:
    studio-url: ${STUDIO_ORIGIN:http://localhost:3100}        # links in the payout.failed email
    api-url: ${API_PUBLIC_URL:http://localhost:8080}          # unsubscribe links point at the api
    unsubscribe-key: ${EMAIL_UNSUBSCRIBE_KEY:}                # same key as the api (it verifies the tokens)
    consumer-url: ${CONSUMER_ORIGIN:http://localhost:3000}    # S-102: deep links in customers' and couriers' pushes
  # Push (S-102, docs/runbooks/push.md): `local` logs; `native` = APNs (iOS) + FCM (Android) to the device registry.
  # Production refuses `local`. Secrets: PUSH_APNS_KEY, PUSH_FCM_SERVICE_ACCOUNT.
  push:
    provider: ${PUSH_PROVIDER:local}
    stale-after: ${PUSH_STALE_AFTER:90d}                      # installations not refreshed for this long are pruned
    apns:
      url: ${PUSH_APNS_URL:https://api.push.apple.com}        # https://api.sandbox.push.apple.com for development builds
      key-id: ${PUSH_APNS_KEY_ID:}
      team-id: ${PUSH_APNS_TEAM_ID:}
      key: ${PUSH_APNS_KEY:}                                  # the .p8 key (PEM text)
      consumer-topic: ${PUSH_APNS_CONSUMER_TOPIC:ca.northline.app}
      courier-topic: ${PUSH_APNS_COURIER_TOPIC:ca.northline.courier}
    fcm:
      url: ${PUSH_FCM_URL:https://fcm.googleapis.com}
      service-account: ${PUSH_FCM_SERVICE_ACCOUNT:}            # the Firebase service account's JSON key
  # Search read model (S-43, docs/runbooks/search.md): events refresh documents at once; the reconcile sweep picks up
  # edits no event announces (prices, names, hours, reviews) within `every`.
  search:
    reconcile:
      enabled: ${SEARCH_RECONCILE_ENABLED:true}
      every: ${SEARCH_RECONCILE_EVERY:1m}
  # Partner webhooks (S-33, docs/runbooks/webhooks.md): queued by the `webhooks` consumer group, delivered per endpoint.
  webhooks:
    secret-key: ${WEBHOOK_SECRET_KEY:}                        # the api's key for the endpoints' signing secrets
    allow-local: ${WEBHOOKS_ALLOW_LOCAL:false}                 # http://localhost endpoints (local development only)
    max-in-flight: ${WEBHOOKS_MAX_IN_FLIGHT:64}                # endpoints delivered to at once per replica
    connect-timeout: ${WEBHOOKS_CONNECT_TIMEOUT:5s}
    response-timeout: ${WEBHOOKS_RESPONSE_TIMEOUT:10s}
    total-timeout: ${WEBHOOKS_TOTAL_TIMEOUT:15s}
    disable-after: ${WEBHOOKS_DISABLE_AFTER:3d}                # no success for this long (and ≥ 10 failures) → off
    log-retention: ${WEBHOOKS_LOG_RETENTION:30d}               # delivery log kept this long
---
# Local runs read server/.env (or .env next to the jar) — KEY=value lines, see server/.env.example.
spring.config.activate.on-profile: "!test"
spring.config.import: optional:file:${NORTHLINE_DOTENV_DIR:.}/.env[.properties],optional:file:${NORTHLINE_DOTENV_DIR:..}/.env[.properties]
