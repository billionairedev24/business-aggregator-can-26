# Integration tests (IntegrationTest base class). The datasource comes from the shared Testcontainers PostGIS via
# @ServiceConnection; Flyway applies classpath:db/migration (no dev seed). Kafka/ES/Redis are not started.
spring:
  # One database for every test context: the `local` ones apply the dev seed (V100–V109, V121), which sits below
  # later ranges' migrations (V110+), so the others must not fail validation over seed files they don't resolve.
  flyway.ignore-migration-patterns: "*:future,*:missing"
  modulith:
    events:
      externalization.enabled: false
      republish-outstanding-events-on-restart: false
  kafka.listener.auto-startup: false
  security.oauth2.resourceserver.jwt.issuer-uri: http://auth.invalid   # never contacted: tests use jwt() / X-Dev-User
management:
  health:
    redis.enabled: false
    elasticsearch.enabled: false
  logging.export.enabled: false
  otlp.metrics.export.enabled: false
  tracing.export.enabled: false
logging.level:
  org.testcontainers: warn
  tc: warn
northline:                               # a STRIPE_SECRET_KEY exported in the shell must never reach Stripe from tests
  # Consumer Shop (S-49…S-52): each test class browses its own market, so rows other tests leave in the shared
  # database (sellers in Calgary) never show up in its lists.
  orders.delivery.markets: [Shopville, Productville, Cartville, Trackville, Deliveryville, Dispatchville, Pingville, Liquorville, Photoville]   # extra test markets; the live ones are region data
  payments.stripe-secret-key: ""
  # Tests change businesses with SQL, not events: the landing pages read them fresh (ShortCache/HomeCache unit tests).
  public-pages.cache-ttl: 0s
  catalogue.import-images.allow-local: true   # S-72: image URLs served by WireMock on loopback
  payments.stripe-webhook-secret: whsec_test_platform_fake    # obviously fake: S-12 tests sign with these
  payments.stripe-connect-webhook-secret: whsec_test_connect_fake
  stripe.secret-key: ""
  search.provider: local                 # S-44: SearchApiTest switches to Elasticsearch (Testcontainers)
  region.provinces: AB,BC=America/Vancouver,ON,QC   # S-134: served by configuration as well as the live rows
  domains:                               # S-31: tests call CustomDomainJobs; "Check now" answers at once
    check-cooldown: PT0S
    target-host: pages.test.northline.ca
    blocked-suffixes: northline.ca, northline-cdn.net
# S-127: springdoc builds the MCP tools from the OpenAPI model at start-up; only the MCP tests need them (they turn
# it on), so the other contexts start without generating the document.
springdoc.ai.mcp.enabled: false
springdoc.pre-loading-enabled: false
# S-128: the developer docs server holds the docs and OpenAPI trees in memory; only the MCP tests (one context) turn it on.
northline.devdocs.enabled: false
# S-125: fixed so the committed docs/api/openapi specs never depend on the machine's AUTH_ISSUER / API_PUBLIC_URL.
northline.docs:
  issuer: http://localhost:9000
  servers: http://localhost:8080
