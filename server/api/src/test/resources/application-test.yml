# Integration tests (IntegrationTest base class). The datasource comes from the shared Testcontainers PostGIS via
# @ServiceConnection; Flyway applies classpath:db/migration (no dev seed). Kafka/ES/Redis are not started.
spring:
  # S-62: the shared database also holds the dev seed (V100–V109) once a `local` test ran; since V110 exists those rows
  # are no longer "future" to the other contexts, so Flyway must not treat them as missing migrations.
  flyway.ignore-migration-patterns: "*:future,*:missing"
  modulith:
    events:
      externalization.enabled: false
      republish-outstanding-events-on-restart: false
  kafka.listener.auto-startup: false
  security.oauth2.resourceserver.jwt.issuer-uri: http://auth.invalid   # never contacted: tests use jwt() / X-Dev-User
management:
  health:
    redis.enabled: false
    elasticsearch.enabled: false
  logging.export.enabled: false
  otlp.metrics.export.enabled: false
  tracing.export.enabled: false
logging.level:
  org.testcontainers: warn
  tc: warn
northline:                               # a STRIPE_SECRET_KEY exported in the shell must never reach Stripe from tests
  # Consumer Shop (S-49…S-52): each test class browses its own market, so rows other tests leave in the shared
  # database (sellers in Calgary) never show up in its lists.
  orders.delivery.markets: [Calgary, Edmonton, Airdrie, Shopville, Productville, Cartville, Trackville]
  payments.stripe-secret-key: ""
  payments.stripe-webhook-secret: whsec_test_platform_fake    # obviously fake: S-12 tests sign with these
  payments.stripe-connect-webhook-secret: whsec_test_connect_fake
  stripe.secret-key: ""
  domains:                               # S-31: tests call CustomDomainJobs; "Check now" answers at once
    check-cooldown: PT0S
    target-host: pages.test.northline.ca
    blocked-suffixes: northline.ca, northline-cdn.net
