# Pre-production (also activates `cloud`, see application-cloud.yml). Same shape as prod, Stripe in test mode.
northline.required-env:
  payments: STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY
  storage: STORAGE_PROVIDER, STORAGE_BUCKET   # s3 | gcs | azure; `local` is refused at start-up (S-10)
  email: EMAIL_PROVIDER, EMAIL_FROM, EMAIL_UNSUBSCRIBE_KEY, API_PUBLIC_URL   # smtp | ses | sendgrid | azure (S-13)
