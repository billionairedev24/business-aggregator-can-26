# Production (also activates `cloud`, see application-cloud.yml). Stripe live keys are mandatory: without them the
# payments module would fall back to its fake gateway.
northline.required-env:
  payments: STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_CONNECT_WEBHOOK_SECRET
  storage: STORAGE_PROVIDER, STORAGE_BUCKET   # s3 | gcs | azure; `local` is refused at start-up (S-10)
  email: EMAIL_PROVIDER, EMAIL_FROM, EMAIL_UNSUBSCRIBE_KEY, API_PUBLIC_URL   # smtp | ses | sendgrid | azure (S-13)
  sms-provider: SMS_PROVIDER, SMS_FROM   # S-27 invitation texts: twilio or aws; `local` is refused here
  tax: TAX_PROVIDER   # S-21: stripe (Stripe Tax); `local` is refused at start-up
  identity: IDENTITY_PROVIDER             # S-22: stripe; `local` is refused at start-up
  registries: REGISTRY_CORPORATIONS_CANADA_PROVIDER, REGISTRY_ALBERTA_PROVIDER, REGISTRY_CALGARY_PROVIDER   # S-23; `fixtures` refused
  calendar: CALENDAR_PROVIDER, API_PUBLIC_URL   # S-32: oauth; `local` is refused at start-up
  domains: DOMAINS_DNS_PROVIDER, DOMAINS_EDGE_PROVIDER, DOMAINS_TARGET_HOST   # S-31: doh|jndi + kubernetes; `local` refused
  commerce: COMMERCE_PROVIDER, API_PUBLIC_URL   # S-35: oauth; `local` is refused at start-up
  pos: POS_PROVIDER   # S-36: oauth; `local` is refused at start-up
  kms-envelope: KMS_PROVIDER, KMS_ENCRYPTION_KEY_ID   # S-32 refresh tokens sealed by the cloud key service; `local` refused
  ai: AI_PROVIDER   # S-129: openrouter (`fake` refused at start-up); no OPENROUTER_API_KEY yet = AI answers 503 (docs/runbooks/ai.md)
springdoc:                              # the OpenAPI document and Swagger UI are not published in production
  api-docs.enabled: false
  swagger-ui.enabled: false
