# Defaults for every environment. Every connection and credential is an environment variable with a local default
# (docs/runbooks/README.md lists them all). Profiles:
#   local   application-local.yml — Postgres only: no Kafka/ES/Redis/auth server, dev seed + dev auth (X-Dev-User)
#   test    src/test/resources/application-test.yml — Testcontainers Postgres
#   dev | staging | prod   each also activates `cloud` (application-cloud.yml): required variables are checked at
#           start-up (northline.required-env), externalization on, no seed, no dev auth.
spring:
  application.name: northline-api
  threads.virtual.enabled: true
  profiles.group:
    dev: cloud
    staging: cloud
    prod: cloud
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/northline}
    username: ${DB_USER:northline}
    password: ${DB_PASSWORD:northline}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # db/migrations is packaged onto the classpath by :api:processResources (see api/build.gradle.kts).
    # Override with SPRING_FLYWAY_LOCATIONS=filesystem:/path/to/db/migrations if you must.
    locations: classpath:db/migration
  mvc.problemdetails.enabled: true
  servlet.multipart:                  # catalogue images/spreadsheets (≤ 15 MB), onboarding documents & logos (10 MB)
    max-file-size: 20MB
    max-request-size: 25MB
  jackson:
    default-property-inclusion: always
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${AUTH_ISSUER:http://localhost:9000}
    audiences: northline-api
    jws-algorithms: ES256               # northline-auth signs with ES256 (ARCHITECTURE.md § Identity)
  data.redis:                         # Valkey 8 or Redis 7+ (same protocol)
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl.enabled: ${REDIS_SSL:false}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}   # SASL_SSL for MSK (SCRAM), GCP Managed Kafka, Event Hubs
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}          # PLAIN | SCRAM-SHA-512 | …
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      acks: all
      properties.enable.idempotence: true
    template.observation-enabled: true      # S-26: traceparent header on every externalized event
  modulith:
    events:
      jdbc:
        schema: events                      # tables created by V017 (+ indexes in V018)
        schema-initialization.enabled: false
      externalization.enabled: true
      republish-outstanding-events-on-restart: true
      completion-mode: archive
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,prometheus,modulith
springdoc:
  api-docs.path: /v3/api-docs
  paths-to-match: /api/**
northline:
  studio.base-url: ${STUDIO_ORIGIN:http://localhost:3100}      # invitation links, Stripe return URLs
  # The region model (S-134, docs/runbooks/regions.md): provinces and markets are rows in region.regions (V130/V131,
  # edited by the console later); this is the configuration on top. Code never names a province, city or zone.
  region:
    # Provinces served whatever their row says, CODE or CODE=Zone/Id (a zone here replaces the row's). S-44's
    # SEARCH_MARKETS / SEARCH_DEFAULT_MARKET are still read when the REGION_ ones are unset.
    provinces: ${REGION_PROVINCES:${SEARCH_MARKETS:AB=America/Edmonton,BC=America/Vancouver,ON=America/Toronto,QC=America/Toronto}}
    default-province: ${REGION_DEFAULT_PROVINCE:${SEARCH_DEFAULT_MARKET:AB}}
    platform-zone: ${REGION_PLATFORM_ZONE:America/Edmonton}   # nightly jobs, support hours: work with no market
    cache-ttl: ${REGION_CACHE_TTL:60s}
  # Pooled delivery runs (S-49; DeliveryProperties) in every live market of the region model. Times are the market's
  # local time; `cutoff` = shops pack by, customers order by cutoff − order-lead. A cut-off after the start belongs to
  # the day before.
  orders.delivery:
    order-lead: 25m
    runs:
      - { name: evening, starts: "18:00", ends: "21:00", cutoff: "17:45", fee-cents: 299, capacity: 40 }
      - { name: morning, starts: "08:00", ends: "11:00", cutoff: "07:30", fee-cents: 199, capacity: 40 }
    direct: { eta: 45m, fee-cents: 999 }
  developer.webhook-key: ${WEBHOOK_SECRET_KEY:}                # base64 32 bytes; blank = fixed dev key under local/test
  payments:                                                    # blank key = fake Stripe gateway (DECISIONS.md, Finance)
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    stripe-api-base: ${STRIPE_API_BASE:}                       # http://localhost:12111 for stripe-mock
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}           # whsec_… of POST /api/v1/webhooks/stripe (S-12)
    stripe-connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}  # whsec_… of …/webhooks/stripe/connect
    stripe-webhook-tolerance: ${STRIPE_WEBHOOK_TOLERANCE:PT5M} # oldest signed delivery accepted (replay protection)
    webhook-rate-limit: ${STRIPE_WEBHOOK_RATE_LIMIT:600}       # deliveries per minute and client address
  stripe:                                                      # Stripe Connect (merchants) outside local/test
    secret-key: ${STRIPE_SECRET_KEY:}
    api-base: ${STRIPE_API_BASE:}
  # Search API (S-44, docs/runbooks/search.md): elasticsearch (listings_en / listings_fr, filled by the worker) | local
  # (no index: every search is empty; the `local` profile's default, refused under staging/prod).
  search:
    provider: ${SEARCH_PROVIDER:elasticsearch}
    # The markets search serves, their time zones and the default market are the region model's (northline.region).
    cache-ttl: ${SEARCH_CACHE_TTL:30s}              # identical searches answered from Redis/Valkey for this long
    rate-limit: ${SEARCH_RATE_LIMIT:120}            # requests per minute and client address (anonymous included)
  # Sales tax (S-21; docs/runbooks/stripe.md § 6): local (fixed Canadian rates, nothing reported; refused under
  # staging/prod) | stripe (Stripe Tax on the platform account, uses STRIPE_SECRET_KEY / STRIPE_API_BASE).
  tax:
    provider: ${TAX_PROVIDER:local}
    service-tax-code: ${TAX_CODE_SERVICE:txcd_20030000}          # Stripe product tax codes per kind of sale
    goods-tax-code: ${TAX_CODE_GOODS:txcd_99999999}
    food-tax-code: ${TAX_CODE_FOOD:txcd_40060003}
    reconcile-cron: ${TAX_RECONCILE_CRON:0 17 3 * * *}           # nightly reconciliation, platform zone
  # Owners' identity verification (S-22, docs/runbooks/stripe.md § Identity): local (fake with an outcome page at
  # /api/v1/dev/identity-sessions/{id}; refused under staging/prod) | stripe (Stripe Identity with STRIPE_SECRET_KEY).
  identity:
    provider: ${IDENTITY_PROVIDER:local}
  # Business registry lookups (S-23, docs/runbooks/registries.md). provider per source: fixtures (local/test default;
  # refused under staging/prod) · manual (every lookup to an agent) · the source's API.
  registries:
    corporations-canada:                  # ISED Federal Corporation API (GC API Store)
      provider: ${REGISTRY_CORPORATIONS_CANADA_PROVIDER:fixtures}   # fixtures | api | manual
      url: ${REGISTRY_CORPORATIONS_CANADA_URL:}                     # base URL shown by the API Store subscription
      key: ${REGISTRY_CORPORATIONS_CANADA_KEY:}                     # subscription key (secret)
      key-header: ${REGISTRY_CORPORATIONS_CANADA_KEY_HEADER:user-key}
    alberta:                              # Alberta Corporate Registry: no public API
      provider: ${REGISTRY_ALBERTA_PROVIDER:fixtures}               # fixtures | opencorporates | manual
      url: ${REGISTRY_ALBERTA_URL:}                                 # default https://api.opencorporates.com
      key: ${REGISTRY_ALBERTA_KEY:}                                 # OpenCorporates API token (secret)
    calgary:                              # City of Calgary business licences (Open Calgary, Socrata)
      provider: ${REGISTRY_CALGARY_PROVIDER:fixtures}               # fixtures | socrata | manual
      url: ${REGISTRY_CALGARY_URL:https://data.calgary.ca}
      dataset: ${REGISTRY_CALGARY_DATASET:vdjc-pybd}
      key: ${REGISTRY_CALGARY_APP_TOKEN:}                           # Socrata app token (optional, secret)
    recheck-after: ${REGISTRY_RECHECK_AFTER:P30D}
    recheck-cron: ${REGISTRY_RECHECK_CRON:0 41 3 * * *}             # daily, platform zone
  # Google and Microsoft calendar two-way sync (S-32, docs/runbooks/calendar-sync.md): local (fake Google and Outlook;
  # refused under staging/prod) | oauth (Google Calendar API / Microsoft Graph, each once its client id + secret are set).
  calendar:
    provider: ${CALENDAR_PROVIDER:local}
    studio-url: ${STUDIO_ORIGIN:http://localhost:3100}      # OAuth redirect URIs: <studio>/api/v1/calendar/oauth/<google|outlook>/callback
    notification-url: ${API_PUBLIC_URL:http://localhost:8080}   # change notifications (HTTPS only; http = periodic reads only)
    sync-interval: ${CALENDAR_SYNC_INTERVAL:PT5M}
    webhook-rate-limit: ${CALENDAR_WEBHOOK_RATE_LIMIT:600}      # notifications per minute and client address
    google:
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CALENDAR_CLIENT_ID:}
      client-secret: ${MICROSOFT_CALENDAR_CLIENT_SECRET:}
      tenant: ${MICROSOFT_CALENDAR_TENANT:common}
  # Storefront custom domains (S-31, docs/runbooks/custom-domains.md). DNS: local (in-memory zone; refused under
  # staging/prod) | doh (DNS over HTTPS, RFC 8484) | jndi (the JDK's DNS client). Edge: local (in memory) | kubernetes
  # (Gateway listeners + cert-manager Certificates + HTTPRoutes in the app's namespace; the chart sets DOMAINS_EDGE_*).
  domains:
    target-host: ${DOMAINS_TARGET_HOST:pages.northline.ca}      # merchants CNAME here: pages.<zone>
    edge-addresses: ${DOMAINS_EDGE_ADDRESSES:}                   # fixed edge IPs for apex A records (reserved LB address)
    blocked-suffixes: ${DOMAINS_BLOCKED_SUFFIXES:northline.ca}   # zones nobody may claim (+ the target's zone)
    issue-per-hour: ${DOMAINS_ISSUE_PER_HOUR:20}                 # Let's Encrypt: 300 orders / 3 h per account
    request-cooldown: ${DOMAINS_REQUEST_COOLDOWN:PT1H}
    check-cooldown: ${DOMAINS_CHECK_COOLDOWN:PT15S}
    check-interval: ${DOMAINS_CHECK_INTERVAL:PT1M}
    edge-interval: ${DOMAINS_EDGE_INTERVAL:PT1M}
    timing:
      verify-window: ${DOMAINS_VERIFY_WINDOW:P7D}
      grace: ${DOMAINS_GRACE_PERIOD:PT72H}
    dns:
      provider: ${DOMAINS_DNS_PROVIDER:local}
      doh-url: ${DOMAINS_DOH_URL:https://private.canadianshield.cira.ca/dns-query}
      servers: ${DOMAINS_DNS_SERVERS:}
    edge:
      provider: ${DOMAINS_EDGE_PROVIDER:local}
      namespace: ${DOMAINS_EDGE_NAMESPACE:northline}
      gateway-class: ${DOMAINS_EDGE_GATEWAY_CLASS:envoy}
      gateway-prefix: ${DOMAINS_EDGE_GATEWAY_PREFIX:northline-custom}
      listeners-per-gateway: ${DOMAINS_EDGE_LISTENERS_PER_GATEWAY:64}
      max-domains: ${DOMAINS_MAX:1000}
      issuer: ${DOMAINS_EDGE_ISSUER:northline-acme-custom}
      service: ${DOMAINS_EDGE_SERVICE:northline-consumer}
      service-port: ${DOMAINS_EDGE_SERVICE_PORT:3000}
      response-headers: ${DOMAINS_EDGE_RESPONSE_HEADERS:}           # JSON object; blank = HSTS (no includeSubDomains), nosniff, Referrer-Policy
  # Shopify, Square and Lightspeed catalogue sync (S-35, docs/runbooks/commerce-sync.md): local (fakes with fixture
  # catalogues; refused under staging/prod) | oauth (the real APIs, each once its app credentials are set).
  commerce:
    provider: ${COMMERCE_PROVIDER:local}
    api-url: ${API_PUBLIC_URL:http://localhost:8080}      # OAuth redirect URIs + webhooks: <api>/api/v1/commerce/oauth/<p>/callback, <api>/api/v1/webhooks/commerce/<p>
    studio-url: ${STUDIO_ORIGIN:http://localhost:3100}   # where the callback sends the browser back
    poll-interval: ${COMMERCE_POLL_INTERVAL:PT1H}           # full read without webhooks
    reconcile-interval: ${COMMERCE_RECONCILE_INTERVAL:P1D}  # full read with webhooks
    webhook-rate-limit: ${COMMERCE_WEBHOOK_RATE_LIMIT:600}  # deliveries per minute and client address
    shopify:
      client-id: ${SHOPIFY_CLIENT_ID:}
      client-secret: ${SHOPIFY_CLIENT_SECRET:}
      api-version: ${SHOPIFY_API_VERSION:2026-07}
    square:
      client-id: ${SQUARE_CLIENT_ID:}
      client-secret: ${SQUARE_CLIENT_SECRET:}
      webhook-signature-key: ${SQUARE_WEBHOOK_SIGNATURE_KEY:}
      base-url: ${SQUARE_BASE_URL:https://connect.squareup.com}   # https://connect.squareupsandbox.com = sandbox
    lightspeed:
      client-id: ${LIGHTSPEED_CLIENT_ID:}
      client-secret: ${LIGHTSPEED_CLIENT_SECRET:}
  # POS menu import for kitchens (S-36, docs/runbooks/pos-menu-import.md): local (fake Square / Clover / Toast with a
  # fixture menu; refused under staging/prod) | oauth (the real APIs, each once its credentials are set).
  pos:
    provider: ${POS_PROVIDER:local}
    api-url: ${API_PUBLIC_URL:http://localhost:8080}      # OAuth redirect: the shared <api>/api/v1/commerce/oauth/<pos>/callback
    studio-url: ${STUDIO_ORIGIN:http://localhost:3100}
    square:                                               # the same Square app as the catalogue sync (S-35)
      client-id: ${SQUARE_CLIENT_ID:}
      client-secret: ${SQUARE_CLIENT_SECRET:}
      base-url: ${SQUARE_BASE_URL:https://connect.squareup.com}
    clover:
      client-id: ${CLOVER_CLIENT_ID:}
      client-secret: ${CLOVER_CLIENT_SECRET:}
      auth-url: ${CLOVER_AUTH_URL:https://www.clover.com}      # sandbox: https://sandbox.dev.clover.com
      api-url: ${CLOVER_API_URL:https://api.clover.com}        # sandbox: https://apisandbox.dev.clover.com
    toast:                                                # partner credentials (Toast partner program)
      client-id: ${TOAST_CLIENT_ID:}
      client-secret: ${TOAST_CLIENT_SECRET:}
      api-url: ${TOAST_API_URL:https://ws-api.toasttab.com}    # sandbox: https://ws-sandbox-api.eng.toasttab.com
  # Addresses (S-47, docs/runbooks/google-maps.md): local = fixture addresses (refused under staging/prod) | google =
  # Places API (New) autocomplete + details and the Geocoding API (reverse), key server-side only.
  places:
    provider: ${PLACES_PROVIDER:local}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    per-minute: ${PLACES_RATE_LIMIT:60}                   # address lookups per browsing session and minute, per instance
  # Provider switches (ca.northline.platform) — see docs/runbooks/README.md.
  # Object storage (S-10, ca.northline.shared.storage): local (modules' disk fakes; placeholders under dev; refused
  # under staging/prod) | s3 (AWS S3 or RustFS/MinIO: endpoint + path-style) | gcs | azure (endpoint = account URL).
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:northline-local}
    region: ${STORAGE_REGION:ca-central-1}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${STORAGE_PATH_STYLE:false}
    encryption-key: ${STORAGE_ENCRYPTION_KEY:}   # SSE-KMS key / Cloud KMS key (CMEK) / Azure encryption scope
  kms:
    provider: ${KMS_PROVIDER:local}
    key-id: ${KMS_KEY_ID:}
  # Envelope encryption of stored secrets (S-32 calendar refresh tokens, ca.northline.shared.crypto). KMS_PROVIDER
  # local: data keys wrapped with KMS_LOCAL_KEY (fixed dev key under local/test; refused under staging/prod);
  # aws | gcp | azure: wrapped by the key service with KMS_ENCRYPTION_KEY_ID (Terraform's `tokens` key).
  crypto:
    key-id: ${KMS_ENCRYPTION_KEY_ID:}
    local-key: ${KMS_LOCAL_KEY:}
    region: ${KMS_REGION:}
    endpoint: ${KMS_ENDPOINT:}
  # Transactional email (S-13, library server/email; docs/runbooks/email.md): local (SMTP to Mailpit, only logs when
  # Mailpit isn't running; refused under staging/prod) | smtp (any relay, e.g. SES SMTP) | ses | sendgrid | azure.
  email:
    provider: ${EMAIL_PROVIDER:local}
    from: ${EMAIL_FROM:Northline <no-reply@northline.ca>}
    reply-to: ${EMAIL_REPLY_TO:}
    mailing-address: ${EMAIL_MAILING_ADDRESS:Northline Marketplace Inc. · 1200 – 8th Avenue SW, Calgary, Alberta T2P 1B5, Canada}
    contact: ${EMAIL_CONTACT:support@northline.ca}
    region: ${EMAIL_REGION:}                     # ses: ca-central-1
    endpoint: ${EMAIL_ENDPOINT:}                 # azure: https://<resource>.communication.azure.com; tests/VPC endpoints
    api-key: ${EMAIL_API_KEY:}                   # sendgrid: SG.…; azure: access key (blank = Entra ID)
    configuration-set: ${EMAIL_CONFIGURATION_SET:}
    smtp: { host: "${SMTP_HOST:localhost}", port: "${SMTP_PORT:1025}", username: "${SMTP_USERNAME:}", password: "${SMTP_PASSWORD:}", starttls: "${SMTP_STARTTLS:false}" }
    retry: { attempts: "${EMAIL_RETRY_ATTEMPTS:3}", backoff: "${EMAIL_RETRY_BACKOFF:2s}" }
  notifications:                                 # links in notification emails (S-13)
    studio-url: ${STUDIO_ORIGIN:http://localhost:3100}
    api-url: ${API_PUBLIC_URL:http://localhost:8080}   # unsubscribe links: the api's public URL (not the BFF)
    unsubscribe-key: ${EMAIL_UNSUBSCRIBE_KEY:}         # HMAC key; blank = development key (refused under staging/prod)
  # SMS (S-27, library server/sms): team invitations to a mobile number. Same settings as northline-auth (S-8):
  # local (the log; refused under staging/prod) | twilio | aws.
  sms:
    provider: ${SMS_PROVIDER:local}
    from: ${SMS_FROM:}
    voice-from: ${SMS_VOICE_FROM:}
    account-id: ${SMS_ACCOUNT_ID:}
    auth-token: ${SMS_AUTH_TOKEN:}
    region: ${SMS_REGION:}
    endpoint: ${SMS_ENDPOINT:}
---
# Local runs read server/.env (or .env next to the jar) — KEY=value lines, see server/.env.example. Never under `test`.
spring.config.activate.on-profile: "!test"
spring.config.import: optional:file:${NORTHLINE_DOTENV_DIR:.}/.env[.properties],optional:file:${NORTHLINE_DOTENV_DIR:..}/.env[.properties]
