spring:
  application.name: northline-api
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/northline
    username: northline
    password: northline
  flyway:
    locations: filesystem:../../db/migrations
  security.oauth2.resourceserver.jwt:
    issuer-uri: http://localhost:9000
    audiences: northline-api
  data.redis.host: localhost
  elasticsearch.uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties.enable.idempotence: true
  modulith:
    events:
      jdbc.schema-initialization.enabled: false   # table created by V017
      externalization.enabled: true
      republish-outstanding-events-on-restart: true
      completion-mode: archive
server.port: 8080
management.endpoints.web.exposure.include: health,info,prometheus,modulith
