# Defaults for every environment. Every connection and credential is an environment variable with a local default
# (docs/runbooks/README.md lists them all). Profiles:
#   local   application-local.yml — Postgres only: no Kafka/ES/Redis/auth server, dev seed + dev auth (X-Dev-User)
#   test    src/test/resources/application-test.yml — Testcontainers Postgres
#   dev | staging | prod   each also activates `cloud` (application-cloud.yml): required variables are checked at
#           start-up (northline.required-env), externalization on, no seed, no dev auth.
spring:
  application.name: northline-api
  threads.virtual.enabled: true
  profiles.group:
    dev: cloud
    staging: cloud
    prod: cloud
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/northline}
    username: ${DB_USER:northline}
    password: ${DB_PASSWORD:northline}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    # db/migrations is packaged onto the classpath by :api:processResources (see api/build.gradle.kts).
    # Override with SPRING_FLYWAY_LOCATIONS=filesystem:/path/to/db/migrations if you must.
    locations: classpath:db/migration
  mvc.problemdetails.enabled: true
  servlet.multipart:                  # catalogue images/spreadsheets (≤ 15 MB), onboarding documents & logos (10 MB)
    max-file-size: 20MB
    max-request-size: 25MB
  jackson:
    default-property-inclusion: always
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${AUTH_ISSUER:http://localhost:9000}
    audiences: northline-api
    jws-algorithms: ES256               # northline-auth signs with ES256 (ARCHITECTURE.md § Identity)
  data.redis:                         # Valkey 8 or Redis 7+ (same protocol)
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl.enabled: ${REDIS_SSL:false}
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}   # SASL_SSL for MSK (SCRAM), GCP Managed Kafka, Event Hubs
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}          # PLAIN | SCRAM-SHA-512 | …
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      acks: all
      properties.enable.idempotence: true
    template.observation-enabled: true      # S-26: traceparent header on every externalized event
  modulith:
    events:
      jdbc:
        schema: events                      # tables created by V017 (+ indexes in V018)
        schema-initialization.enabled: false
      externalization.enabled: true
      republish-outstanding-events-on-restart: true
      completion-mode: archive
server.port: ${SERVER_PORT:8080}
management.endpoints.web.exposure.include: health,info,prometheus,modulith
springdoc:
  api-docs.path: /v3/api-docs
  paths-to-match: /api/**
northline:
  studio.base-url: ${STUDIO_ORIGIN:http://localhost:3100}      # invitation links, Stripe return URLs
  developer.webhook-key: ${WEBHOOK_SECRET_KEY:}                # base64 32 bytes; blank = fixed dev key under local/test
  payments:                                                    # blank key = fake Stripe gateway (DECISIONS.md, Finance)
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    stripe-api-base: ${STRIPE_API_BASE:}                       # http://localhost:12111 for stripe-mock
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}           # whsec_… of POST /api/v1/webhooks/stripe (S-12)
    stripe-connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}  # whsec_… of …/webhooks/stripe/connect
    stripe-webhook-tolerance: ${STRIPE_WEBHOOK_TOLERANCE:PT5M} # oldest signed delivery accepted (replay protection)
    webhook-rate-limit: ${STRIPE_WEBHOOK_RATE_LIMIT:600}       # deliveries per minute and client address
  stripe:                                                      # Stripe Connect (merchants) outside local/test
    secret-key: ${STRIPE_SECRET_KEY:}
    api-base: ${STRIPE_API_BASE:}
  # Sales tax (S-21; docs/runbooks/stripe.md § 6): local (fixed Canadian rates, nothing reported; refused under
  # staging/prod) | stripe (Stripe Tax on the platform account, uses STRIPE_SECRET_KEY / STRIPE_API_BASE).
  tax:
    provider: ${TAX_PROVIDER:local}
    service-tax-code: ${TAX_CODE_SERVICE:txcd_20030000}          # Stripe product tax codes per kind of sale
    goods-tax-code: ${TAX_CODE_GOODS:txcd_99999999}
    food-tax-code: ${TAX_CODE_FOOD:txcd_40060003}
    reconcile-cron: ${TAX_RECONCILE_CRON:0 17 3 * * *}           # nightly reconciliation, America/Edmonton
  # Owners' identity verification (S-22, docs/runbooks/stripe.md § Identity): local (fake with an outcome page at
  # /api/v1/dev/identity-sessions/{id}; refused under staging/prod) | stripe (Stripe Identity with STRIPE_SECRET_KEY).
  identity:
    provider: ${IDENTITY_PROVIDER:local}
  # Provider switches (ca.northline.platform) — see docs/runbooks/README.md.
  # Object storage (S-10, ca.northline.shared.storage): local (modules' disk fakes; placeholders under dev; refused
  # under staging/prod) | s3 (AWS S3 or RustFS/MinIO: endpoint + path-style) | gcs | azure (endpoint = account URL).
  storage:
    provider: ${STORAGE_PROVIDER:local}
    bucket: ${STORAGE_BUCKET:northline-local}
    region: ${STORAGE_REGION:ca-central-1}
    endpoint: ${STORAGE_ENDPOINT:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    path-style: ${STORAGE_PATH_STYLE:false}
    encryption-key: ${STORAGE_ENCRYPTION_KEY:}   # SSE-KMS key / Cloud KMS key (CMEK) / Azure encryption scope
  kms:
    provider: ${KMS_PROVIDER:local}
    key-id: ${KMS_KEY_ID:}
  # Transactional email (S-13, library server/email; docs/runbooks/email.md): local (SMTP to Mailpit, only logs when
  # Mailpit isn't running; refused under staging/prod) | smtp (any relay, e.g. SES SMTP) | ses | sendgrid | azure.
  email:
    provider: ${EMAIL_PROVIDER:local}
    from: ${EMAIL_FROM:Northline <no-reply@northline.ca>}
    reply-to: ${EMAIL_REPLY_TO:}
    mailing-address: ${EMAIL_MAILING_ADDRESS:Northline Marketplace Inc. · 1200 – 8th Avenue SW, Calgary, Alberta T2P 1B5, Canada}
    contact: ${EMAIL_CONTACT:support@northline.ca}
    region: ${EMAIL_REGION:}                     # ses: ca-central-1
    endpoint: ${EMAIL_ENDPOINT:}                 # azure: https://<resource>.communication.azure.com; tests/VPC endpoints
    api-key: ${EMAIL_API_KEY:}                   # sendgrid: SG.…; azure: access key (blank = Entra ID)
    configuration-set: ${EMAIL_CONFIGURATION_SET:}
    smtp: { host: "${SMTP_HOST:localhost}", port: "${SMTP_PORT:1025}", username: "${SMTP_USERNAME:}", password: "${SMTP_PASSWORD:}", starttls: "${SMTP_STARTTLS:false}" }
    retry: { attempts: "${EMAIL_RETRY_ATTEMPTS:3}", backoff: "${EMAIL_RETRY_BACKOFF:2s}" }
  notifications:                                 # links in notification emails (S-13)
    studio-url: ${STUDIO_ORIGIN:http://localhost:3100}
    api-url: ${API_PUBLIC_URL:http://localhost:8080}   # unsubscribe links: the api's public URL (not the BFF)
    unsubscribe-key: ${EMAIL_UNSUBSCRIBE_KEY:}         # HMAC key; blank = development key (refused under staging/prod)
  # SMS (S-27, library server/sms): team invitations to a mobile number. Same settings as northline-auth (S-8):
  # local (the log; refused under staging/prod) | twilio | aws.
  sms:
    provider: ${SMS_PROVIDER:local}
    from: ${SMS_FROM:}
    voice-from: ${SMS_VOICE_FROM:}
    account-id: ${SMS_ACCOUNT_ID:}
    auth-token: ${SMS_AUTH_TOKEN:}
    region: ${SMS_REGION:}
    endpoint: ${SMS_ENDPOINT:}
---
# Local runs read server/.env (or .env next to the jar) — KEY=value lines, see server/.env.example. Never under `test`.
spring.config.activate.on-profile: "!test"
spring.config.import: optional:file:.env[.properties],optional:file:../.env[.properties]
