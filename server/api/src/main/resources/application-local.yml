# `./gradlew :api:bootRun --args='--spring.profiles.active=local'`
# Runs against Postgres only: no auth server (DevAuthFilter: header X-Dev-User), no Kafka, no Elasticsearch, no Redis.
# Loads the dev personas from db/seed-dev (V100–V109).
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed-dev
    # The dev seed (V100–V109, V121) interleaves with migrations of later ranges (V110+): a database migrated without
    # the seed first (./gradlew :api:flywayMigrate, the test profile) takes the seed files afterwards.
    out-of-order: true
  modulith:
    events:
      externalization.enabled: false      # nothing goes to Kafka; in-process @ApplicationModuleListeners still use the registry
      republish-outstanding-events-on-restart: false
  kafka.listener.auto-startup: false
management:
  health:
    redis.enabled: false
    elasticsearch.enabled: false
  # Off unless OTEL_EXPORT_ENABLED=true (make up OBS=1, make up-all): then traces, metrics and logs go to the local
  # Collector like every other app's (docs/runbooks/observability.md § Local).
  logging.export.enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp.metrics.export.enabled: ${OTEL_EXPORT_ENABLED:false}
  tracing.export.enabled: ${OTEL_EXPORT_ENABLED:false}
logging.level:
  ca.northline: debug
  ca.northline.config.DevAuthFilter: debug
northline:
  # No Elasticsearch under `local`: every search is empty until you run the compose `search` profile, create the indices
  # (`./gradlew :worker:searchIndices --args=apply`) and set SEARCH_PROVIDER=elasticsearch (docs/runbooks/search.md).
  search.provider: ${SEARCH_PROVIDER:local}
