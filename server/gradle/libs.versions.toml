# Versions verified against Maven Central / Gradle Plugin Portal on 2026-09-29 (see docs/DECISIONS.md).
# Anything managed by the Spring Boot BOM (Flyway, Testcontainers 2, Jackson 3, Postgres driver, …) has no version here.
[versions]
java = "25"
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
spring-cloud = "2025.1.3"
springdoc = "3.1.1"
stripe = "33.4.2"
ulid = "5.2.4"
lombok = "1.18.48"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
archunit = "1.5.1"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
checkstyle = "14.3.0"
palantir-java-format = "2.100.0"
totp = "1.7.1"
aws-sdk = "2.55.8"
gcp-kms = "2.101.0"
azure-keyvault-keys = "4.11.2"
azure-identity = "1.18.6"
azure-core-http-jdk = "1.1.7"
gcp-storage = "2.74.0"
azure-storage-blob = "12.35.1"

[libraries]
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
stripe = { module = "com.stripe:stripe-java", version.ref = "stripe" }
ulid = { module = "com.github.f4b6a3:ulid-creator", version.ref = "ulid" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
totp = { module = "dev.samstevens.totp:totp", version.ref = "totp" }
aws-kms = { module = "software.amazon.awssdk:kms", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
gcp-storage = { module = "com.google.cloud:google-cloud-storage", version.ref = "gcp-storage" }
azure-storage-blob = { module = "com.azure:azure-storage-blob", version.ref = "azure-storage-blob" }
gcp-kms = { module = "com.google.cloud:google-cloud-kms", version.ref = "gcp-kms" }
azure-keyvault-keys = { module = "com.azure:azure-security-keyvault-keys", version.ref = "azure-keyvault-keys" }
azure-identity = { module = "com.azure:azure-identity", version.ref = "azure-identity" }
azure-core-http-jdk = { module = "com.azure:azure-core-http-jdk-httpclient", version.ref = "azure-core-http-jdk" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }
errorprone = { id = "net.ltgt.errorprone", version = "5.1.1" }
