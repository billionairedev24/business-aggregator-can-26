# The JVM that runs Gradle itself (the daemon), independent of JAVA_HOME and of the IDE's "Gradle JVM" setting.
# Spotless runs palantir-java-format and removeUnusedImports inside the daemon, and they parse with the daemon's javac:
# on a JDK older than 22 they reject Java 22+ syntax such as unnamed variables (`_`). Gradle picks an installed JDK 25
# (it does not download one: no toolchain repository is configured).
toolchainVersion=25
