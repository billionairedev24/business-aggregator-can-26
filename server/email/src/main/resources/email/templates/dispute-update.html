<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{dispute-update.preheader}, ~{::content})}">
<body>
<div th:fragment="content" th:with="bodyKey=${change == 'decided' ? 'dispute-update.body.decided.' + decision : 'dispute-update.body.' + change}">
  <h1 th:style="${s.h1}" th:text="#{__${'dispute-update.heading.' + change}__}">Heading</h1>
  <p th:style="${s.p}" th:text="#{__${bodyKey}__(${amount}, ${refund})}">Body</p>
  <p th:if="${change == 'opened'}" th:style="${s.notice}" th:text="#{dispute-update.respondBy(${respondBy})}">Respond by</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" th:style="${s.facts}">
    <tr><td th:style="${s.factLabel}" th:text="#{dispute-update.case}">Case</td><td th:style="${s.factValue}" th:text="${caseNumber}">DS-0000</td></tr>
    <tr><td th:style="${s.factLabel}" th:text="#{dispute-update.amount}">Amount</td><td th:style="${s.factValue}" th:text="${amount}">$0.00</td></tr>
    <tr th:if="${change == 'decided'}"><td th:style="${s.factLabel}" th:text="#{dispute-update.refund}">Refund</td><td th:style="${s.factValue}" th:text="${refund}">$0.00</td></tr>
  </table>
  <th:block th:replace="~{button.html :: button(#{dispute-update.cta}, ${link})}"/>
</div>
</body>
</html>
