<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{standing-update.preheader}, ~{::content})}">
<body>
<div th:fragment="content"
     th:with="what=${#messages.msg('standing-update.subject-name.' + about)}">
  <h1 th:style="${s.h1}" th:text="#{__${'standing-update.heading.' + change}__}">Heading</h1>
  <p th:style="${s.p}" th:text="#{__${'standing-update.body.' + change}__(${businessName}, ${what}, ${reference})}">Body</p>
  <p th:style="${s.notice}" th:text="#{standing-update.reason-given(${staffReason})}">Reason</p>
  <p th:if="${compensation != ''}" th:style="${s.p}" th:text="#{standing-update.compensation(${compensation})}">Compensation</p>
  <p th:style="${s.p}" th:text="#{__${'standing-update.next.' + change}__}">Next</p>
  <th:block th:replace="~{button.html :: button(#{standing-update.cta}, ${link})}"/>
</div>
</body>
</html>
