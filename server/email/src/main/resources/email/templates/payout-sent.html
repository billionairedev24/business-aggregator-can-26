<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{payout-sent.preheader}, ~{::content})}">
<body>
<div th:fragment="content">
  <h1 th:style="${s.h1}" th:text="#{payout-sent.heading}">Your payout is on its way</h1>
  <p th:style="${s.p}" th:text="#{__${'payout-sent.body.' + kind}__(${businessName})}">Body</p>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" th:style="${s.facts}">
    <tr th:if="${hasFee}"><td th:style="${s.factLabel}" th:text="#{payout-sent.amount}">Payout</td><td th:style="${s.factValue}" th:text="${amount}">$0.00</td></tr>
    <tr th:if="${hasFee}"><td th:style="${s.factLabel}" th:text="#{payout-sent.fee}">Fee</td><td th:style="${s.factValue}" th:text="${'−' + fee}">$0.00</td></tr>
    <tr><td th:style="${s.factLabel}" th:text="#{payout-sent.net}">To your bank</td><td th:style="${s.factValue}" th:text="${net}">$0.00</td></tr>
    <tr><td th:style="${s.factLabel}" th:text="#{payout-sent.arrives}">Expected</td><td th:style="${s.factValue}" th:text="${arrivesAt}">Friday</td></tr>
  </table>
  <th:block th:replace="~{button.html :: button(#{payout-sent.cta}, ${link})}"/>
</div>
</body>
</html>
