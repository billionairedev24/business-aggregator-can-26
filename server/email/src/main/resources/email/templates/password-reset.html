<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{password-reset.preheader(${minutes})}, ~{::content})}">
<body>
<div th:fragment="content">
  <h1 th:style="${s.h1}" th:text="#{password-reset.heading(${firstName})}">Heading</h1>
  <p th:style="${s.p}" th:text="#{password-reset.body}">Body</p>
  <p th:style="${s.code}" th:text="${code}">123456</p>
  <p th:style="${s.p}" th:text="#{password-reset.orLink}">Or use the button</p>
  <th:block th:replace="~{button.html :: button(#{password-reset.cta}, ${link})}"/>
  <p th:style="${s.small}" th:text="#{password-reset.expires(${minutes})}">Expires</p>
  <p th:style="${s.small}" th:text="#{password-reset.ignore}">Ignore</p>
</div>
</body>
</html>
