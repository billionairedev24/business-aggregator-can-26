# Northline CI on GitLab — S-4 (server), S-5 (web), S-2/S-3 (infra), S-14 (images, chart). Runbook: docs/runbooks/ci.md
#
# MANUAL ONLY: CI credits are depleted, so pipelines are created only by Build › Pipelines › "Run pipeline"
# (source "web") or the API/trigger tokens (source "api"). Pushes, merge requests and schedules create nothing.
# To run automatically later, add one line under workflow: rules (see the runbook § Enabling automatic runs):
#     - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

workflow:
  name: "Northline CI · $PIPELINE_PART"
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - when: never
  auto_cancel:
    on_new_commit: interruptible

# Shown (and editable) in the "Run pipeline" form.
variables:
  PIPELINE_PART:
    value: all
    options: [all, server, web, infra, chart, images, gitops, promote, events, openapi, pages, courier, mobile-consumer]
    description: "Which part to build and test. `events` = the event schema contract check (S-34, also in `all`). `openapi` = Redocly lint of the committed specs (S-125, also in `all`; the code-vs-spec check runs in `server`). `images` builds and pushes the container images (S-14, never part of `all`); `chart` = Helm checks, `gitops` = Argo CD checks (S-15; both also in `all`); `promote` opens a promotion merge request (S-15, never part of `all`). `pages` publishes the public documentation site on GitLab Pages (S-126, never part of `all`). `courier` = the courier app's checks, web smoke and (manual) EAS build (S-87, never part of `all`). `mobile-consumer` = the consumer app's checks, native prebuild check, web smoke and (manual) EAS build (S-97, never part of `all`)."
  EVENT_SCHEMAS_BASE:
    value: main
    description: "events: the branch the event schemas are compared with (breaking changes need a version bump)."
  SERVER_GRADLE_ARGS:
    value: build
    description: "Gradle arguments for server/ (e.g. build, :api:build, build -x test, build --rerun-tasks)."
  INFRA_CLOUD:
    value: all
    options: [all, aws, gcp, azure]
    description: "infra: which cloud's Terraform modules and env roots to validate."
  RUN_TFLINT:
    value: "true"
    options: ["true", "false"]
    description: "infra: also run tflint (downloads the aws/google/azurerm rulesets from GitHub)."
  IMAGE_REGISTRY:
    value: ""
    description: "images: registry including its path (empty = this project's GitLab registry, $CI_REGISTRY_IMAGE). E.g. 123456789012.dkr.ecr.ca-central-1.amazonaws.com/northline, <acr>.azurecr.io/northline."
  IMAGE_TAG:
    value: ""
    description: "images: tag (empty = the short commit sha)."
  IMAGE_APPS:
    value: all
    options: [all, java, web]
    description: "images: which images to build."
  IMAGE_PLATFORMS:
    value: linux/amd64,linux/arm64
    description: "images: platforms."
  PROMOTE_ENV:
    value: dev
    options: [dev, staging, prod]
    description: "promote: the environment whose deploy/argocd/envs/<env>/images.yaml changes."
  PROMOTE_FROM:
    value: ""
    options: ["", dev, staging]
    description: "promote: copy the digests this environment runs (staging → prod); empty = look up IMAGE_REGISTRY/<app>:IMAGE_TAG."
  RUN_STUDIO_SMOKE:
    value: "false"
    options: ["false", "true"]
    description: Also run the studio smoke sweep (Postgres + api + studio + Playwright; slower).

stages:
  - check
  - build
  - smoke

default:
  interruptible: true

# One file per part: ci/gitlab/server.yml (S-4), ci/gitlab/web.yml (S-5), ci/gitlab/infra.yml (S-2/S-3),
# ci/gitlab/deploy.yml (S-14 images and chart), ci/gitlab/gitops.yml (S-15 Argo CD checks and promotion),
# ci/gitlab/events.yml (S-34 event schema contract), ci/gitlab/courier.yml (S-87 courier app),
# ci/gitlab/mobile-consumer.yml (S-97 consumer app).
include:
  - local: ci/gitlab/*.yml
