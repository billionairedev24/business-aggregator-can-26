# S-125 — OpenAPI specs (docs/api/openapi, docs/runbooks/api-docs.md).
#
# MANUAL ONLY: CI credits are depleted, so this workflow runs only when started from
# Actions › openapi › Run workflow (or `gh workflow run openapi.yml`). To run it automatically later,
# add triggers next to workflow_dispatch — see docs/runbooks/ci.md § Enabling automatic runs.
#
#   lint   make openapi-lint: Redocly CLI over every committed spec (redocly.yaml)
#   check  make openapi-check: boots api, auth and the BFFs in their tests and compares their specs with the committed
#          ones (also part of the server build; this job runs only that, quickly)
name: openapi

on:
  workflow_dispatch:
    inputs:
      check:
        description: Also compare the code's specs with the committed ones (JDK 25, Testcontainers)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  lint:
    name: redocly lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: corepack enable
      - name: make openapi-lint
        run: make openapi-lint

  check:
    name: specs match the code
    if: ${{ inputs.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAVEN_MIRROR_URL: ${{ vars.MAVEN_MIRROR_URL }}
      MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
      MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: make openapi-check
        run: make openapi-check GRADLE_FLAGS="--max-workers=2 --console=plain"
