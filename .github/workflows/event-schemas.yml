# S-34 — event JSON Schemas as a contract (server/api/src/main/resources/events).
#
# MANUAL ONLY: CI credits are depleted, so this workflow runs only when started from
# Actions › event-schemas › Run workflow (or `gh workflow run event-schemas.yml`). To run it automatically later,
# add triggers next to workflow_dispatch — see docs/runbooks/ci.md § Enabling automatic runs.
#
# Checks: every schema valid for what the worker's EventSchemas implements; every @Externalized event of the api and
# northline-auth ↔ a schema; sample payloads of each event record validate; no breaking change against the base
# branch (merge base) without a version bump. `./gradlew build` runs checks 1–3 too; this job makes check 4 strict.
name: event-schemas

on:
  workflow_dispatch:
    inputs:
      base:
        description: Branch to compare the schemas with (breaking changes need a version bump)
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: event-schemas-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  check:
    name: event schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MAVEN_MIRROR_URL: ${{ vars.MAVEN_MIRROR_URL }}
      MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
      MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.workers.max=2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch and the merge base

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v5

      - name: ./gradlew :event-contracts:eventSchemas
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags origin "$BASE"
          ./gradlew :event-contracts:eventSchemas \
            -PeventSchemas.base="origin/$BASE" -PeventSchemas.requireBase=true \
            --init-script ../ci/gradle/maven-mirror.init.gradle.kts \
            --max-workers=2 --console=plain
