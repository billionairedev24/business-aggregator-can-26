# S-5 — CI for web/ (pnpm monorepo: tokens, ui + Storybook, studio, consumer, console).
#
# MANUAL ONLY: CI credits are depleted, so this workflow runs only when started from
# Actions › web › Run workflow (or `gh workflow run web.yml -f a11y=true`). To run it automatically later,
# add triggers next to workflow_dispatch — see docs/runbooks/ci.md § Enabling automatic runs.
name: web

on:
  workflow_dispatch:
    inputs:
      storybook:
        description: Build Storybook and run its interaction + a11y tests (headless Chromium)
        type: boolean
        default: true
      docs:
        description: Build the documentation site (both variants) and check every page (S-126)
        type: boolean
        default: true
      a11y:
        description: Accessibility page sweep (S-109) — builds the three apps, Playwright + axe against a mock api
        type: boolean
        default: false
      visual:
        description: Visual regression gate (S-180) — the component gallery's screenshot baselines (make ui-visual) and no hydration error on any consumer route (make ui-hydration)
        type: boolean
        default: true
      a11y_routes:
        description: Accessibility check of every ui-shots route, 1440 + 390, en + fr (make ui-a11y, S-180; about an hour)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

defaults:
  run:
    working-directory: web

jobs:
  checks:
    name: colours, typecheck, unit tests, French coverage, studio + console builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup

      # The same make targets as on a laptop (S-124): make web-check = web-lint + web-test + web-build-studio.
      - name: No hex colour literals in components + typecheck
        run: make -C .. web-lint
      - name: Unit tests (vitest)
        run: make -C .. web-test
      - name: French coverage (make i18n-check; S-116, engineering follow-ups)
        run: make -C .. i18n-check
      - name: Studio build
        run: make -C .. web-build-studio
      - name: Console build (S-90)
        run: make -C .. web-build-console

      - name: Upload studio build
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: web/apps/studio/dist/
          retention-days: 7

  storybook:
    name: storybook build + interaction/a11y tests
    if: ${{ inputs.storybook }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup
        with:
          playwright: "true"

      - name: Build Storybook
        run: make -C .. web-storybook-build
      # Every story in headless Chromium: play functions + a11y addon (violations fail).
      - name: Storybook tests
        run: make -C .. web-storybook-test

      - name: Upload Storybook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: web/packages/ui/storybook-static/
          retention-days: 7
          if-no-files-found: ignore

  docs:
    name: docs site build (public + internal) + page check
    if: ${{ inputs.docs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup
      # make docs = pnpm --filter @northline/docs build + test:build (scripts/check-build.mjs: every runbook and spec
      # page in en and fr; no internal page in the public variant)
      - name: make docs (public)
        run: make -C .. docs DOCS_VARIANT=public
      - name: make docs (internal)
        run: make -C .. docs DOCS_VARIANT=internal

  # The Studio smoke sweep (S-5) is part of the end-to-end suite now: e2e.yml, grep @smoke (S-117).

  # S-180: the visual regression gate. The baselines (apps/gallery/visual/__screenshots__) are Linux renders of
  # Playwright 1.56.1's Chromium (build 1194) with the fonts of its Ubuntu 24.04 image, so the job runs in that image:
  # the same browser, the same fallback fonts, IBM Plex Sans self-hosted, the clock pinned and the zone UTC
  # (visual/gallery.spec.ts). A changed pixel past 0.1 % fails; the diffs are uploaded.
  visual:
    name: visual regression (gallery baselines) + no hydration error on any consumer route
    if: ${{ inputs.visual }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: make
        run: command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
      - uses: ./.github/actions/pnpm-setup
      - name: make ui-visual (component gallery, en + fr-CA, 1440 + 390)
        run: make -C .. ui-visual
      - name: make ui-hydration (every consumer route, 1440 + 390, en + fr)
        if: ${{ !cancelled() }}
        run: make -C .. ui-hydration
      - name: Upload the visual diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            web/apps/gallery/node_modules/.visual-results/
            web/packages/a11y/a11y-results/shots-artifacts/
          retention-days: 7
          if-no-files-found: ignore

  # S-180: the accessibility check of every route `make ui-shots` photographs (findings in ui-shots/<app>/_a11y.txt).
  a11y-routes:
    name: accessibility of every ui-shots route (make ui-a11y)
    if: ${{ inputs.a11y_routes }}
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: make
        run: command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
      - uses: ./.github/actions/pnpm-setup
      - name: make ui-a11y
        run: make -C .. ui-a11y
      - name: Upload the findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-a11y
          path: |
            ui-shots/*/_a11y.txt
            web/packages/a11y/a11y-results/pages/
          retention-days: 7
          if-no-files-found: ignore

  # S-109: WCAG 2.2 AA page sweep (docs/a11y/audit.md). No backend: the built apps answer from recorded fixtures.
  a11y:
    name: accessibility page sweep (Playwright + axe)
    if: ${{ inputs.a11y }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pnpm-setup
        with:
          playwright: "true"
      - name: make a11y
        env:
          CI: "true"
        run: make -C .. a11y
      - name: Upload the page reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-results
          path: web/packages/a11y/a11y-results/
          retention-days: 7
          if-no-files-found: ignore
