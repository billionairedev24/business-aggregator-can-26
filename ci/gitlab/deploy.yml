# S-14 — container images and Helm chart checks on GitLab. Included from .gitlab-ci.yml; pipelines exist only when
# started by hand. Runbook: docs/runbooks/deploy.md
#
# PIPELINE_PART=images builds and pushes (never part of `all`). Registry credentials: REGISTRY_USER / REGISTRY_PASSWORD
# (Settings › CI/CD › Variables, masked) — default: this project's registry with the job token. Per cloud: ACR token or
# service principal; Artifact Registry `_json_key_base64` + a base64 key; ECR `AWS` + `aws ecr get-login-password`.

.images:
  stage: build
  needs: []
  rules:
    - if: $PIPELINE_PART == "images"
  interruptible: true
  before_script:
    - export REGISTRY="${IMAGE_REGISTRY:-$CI_REGISTRY_IMAGE}"
    - export IMAGE_TAG="${IMAGE_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export REGISTRY_HOST="${REGISTRY%%/*}"
    - export REGISTRY_USER="${REGISTRY_USER:-$CI_REGISTRY_USER}"
    - export REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - echo "Images → $REGISTRY/<app>:$IMAGE_TAG"

images:java:
  extends: .images
  image: eclipse-temurin:25-jdk
  timeout: 40m
  rules:
    - if: $PIPELINE_PART == "images" && ($IMAGE_APPS == "all" || $IMAGE_APPS == "java")
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    GIT_SHA: $CI_COMMIT_SHA           # org.opencontainers.image.revision
  cache:
    key:
      prefix: gradle
      files: [server/gradle/libs.versions.toml, server/gradle/wrapper/gradle-wrapper.properties]
    paths: [.gradle-home/wrapper/, .gradle-home/caches/modules-2/]
    policy: pull
  script:
    # Jib pushes without a Docker daemon; it reads the credentials from ~/.docker/config.json.
    - mkdir -p ~/.docker
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST" "$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_PASSWORD" | base64 -w0)" > ~/.docker/config.json
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    - make images-java PUSH=1 REGISTRY="$REGISTRY" IMAGE_TAG="$IMAGE_TAG" IMAGE_PLATFORMS="$IMAGE_PLATFORMS" GRADLE_FLAGS="--max-workers=2 --console=plain"
    - for app in api auth bff worker; do echo "$app $(cat server/$app/build/jib-image.digest)"; done | tee image-digests.txt
  artifacts:
    paths: [image-digests.txt]
    expire_in: 30 days

images:web:
  extends: .images
  image: docker:28
  services:
    - name: docker:28-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  timeout: 40m
  rules:
    - if: $PIPELINE_PART == "images" && ($IMAGE_APPS == "all" || $IMAGE_APPS == "web")
  parallel:
    matrix:
      - APP: [studio, consumer, docs, docs-internal]
  script:
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
    - docker buildx create --use --driver docker-container
    # S-126: --build-context repo-docs=docs — the docs targets render the repository's docs/ (ignored by the others)
    - docker buildx build web --file web/Dockerfile --target "$APP" --build-context repo-docs=docs --platform "$IMAGE_PLATFORMS" --provenance=false
        --build-arg GIT_SHA="$CI_COMMIT_SHA" --build-arg IMAGE_TAG="$IMAGE_TAG"
        --tag "$REGISTRY/$APP:$IMAGE_TAG" --push

chart:validate:
  stage: check
  needs: []
  image:
    name: alpine/helm:3.19.0
    entrypoint: [""]
  timeout: 15m
  interruptible: true
  rules:
    - if: $PIPELINE_PART == "all" || $PIPELINE_PART == "chart"
  script:
    - apk add --no-cache bash curl make
    - curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
    # helm lint + helm template | kubeconform -strict for dev/staging/prod × aws/gcp/azure, kind and Gateway API.
    - make helm-validate
