# S-5 — CI for web/ on GitLab. Included from .gitlab-ci.yml.
# Pipelines only exist when started by hand (see workflow: rules in .gitlab-ci.yml).

.web:
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store
  cache:
    key:
      prefix: pnpm
      files: [web/pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - node --version
    - corepack enable
    - cd web
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  rules:
    - if: $PIPELINE_PART == "all" || $PIPELINE_PART == "web"

web:checks:
  extends: .web
  stage: check
  image: node:22-bookworm
  timeout: 20m
  script:
    # make web-check = web-lint (hex colours + typecheck) + web-test + web-build-studio + web-build-console (S-124, S-90)
    - make -C .. web-check
  artifacts:
    expire_in: 7 days
    paths: [web/apps/studio/dist/, web/apps/console/dist/]

# Playwright's image: Node 22, Chromium and its system libraries, same Playwright version as @northline/ui.
web:storybook:
  extends: .web
  stage: build
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs: []
  timeout: 25m
  script:
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    # Every story in headless Chromium: play functions + a11y addon (violations fail). Builds Storybook first.
    - make -C .. web-storybook-test
  artifacts:
    when: always
    expire_in: 7 days
    paths: [web/packages/ui/storybook-static/]

# S-126: the documentation site, both variants, and the page check (scripts/check-build.mjs).
web:docs:
  extends: .web
  stage: build
  image: node:22-bookworm
  needs: []
  timeout: 20m
  script:
    - make -C .. docs DOCS_VARIANT=public
    - make -C .. docs DOCS_VARIANT=internal

# Optional: Run pipeline with RUN_STUDIO_SMOKE=true. Migrates + seeds an empty PostGIS, starts api + auth (local
# profile) and the studio dev server, then sweeps every Studio screen (scripts/studio-smoke.mjs).
web:studio-smoke:
  extends: .web
  stage: smoke
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs: []
  timeout: 40m
  services:
    - name: postgis/postgis:17-3.5
      alias: postgres
  variables:
    POSTGRES_DB: northline
    POSTGRES_USER: northline
    POSTGRES_PASSWORD: northline
    DB_HOST: postgres
    SMOKE_OUT: $CI_PROJECT_DIR/smoke-out
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
    JAVA_HOME: $CI_PROJECT_DIR/.jdk
    # Optional (Settings › CI/CD › Variables): MAVEN_MIRROR_URL, MAVEN_MIRROR_USERNAME, MAVEN_MIRROR_PASSWORD.
  cache:
    - key:
        prefix: pnpm
        files: [web/pnpm-lock.yaml]
      paths: [.pnpm-store/]
    - key: temurin-25
      paths: [.jdk/]
    - key:
        prefix: gradle
        files:
          - server/gradle/libs.versions.toml
          - server/gradle/wrapper/gradle-wrapper.properties
      paths: [.gradle-home/wrapper/, .gradle-home/caches/modules-2/]
  rules:
    - if: ($PIPELINE_PART == "all" || $PIPELINE_PART == "web") && $RUN_STUDIO_SMOKE == "true"
  script:
    - command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl)
    # Temurin 25 (the Playwright image has no JDK); cached in .jdk/.
    - |
      if [ ! -x "$JAVA_HOME/bin/java" ]; then
        mkdir -p "$JAVA_HOME"
        curl -fsSL https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse \
          | tar -xz --strip-components=1 -C "$JAVA_HOME"
      fi
    - export PATH="$JAVA_HOME/bin:$PATH" && java -version
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    - cd "$CI_PROJECT_DIR" && make e2e
  artifacts:
    when: always
    expire_in: 7 days
    paths: [smoke-out/]
    exclude: [smoke-out/runner/**/*]

# Optional: Run pipeline with RUN_A11Y=true (S-109). Builds the Studio, console and consumer, then Playwright + axe
# against them with a mock api replaying the apps' test fixtures (docs/a11y/audit.md).
web:a11y:
  extends: .web
  stage: smoke
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs: []
  timeout: 30m
  variables:
    CI: "true"
  rules:
    - if: ($PIPELINE_PART == "all" || $PIPELINE_PART == "web") && $RUN_A11Y == "true"
  script:
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    - make -C .. a11y
  artifacts:
    when: always
    expire_in: 7 days
    paths: [web/packages/a11y/a11y-results/]
