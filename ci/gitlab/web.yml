# S-5 — CI for web/ on GitLab. Included from .gitlab-ci.yml.
# Pipelines only exist when started by hand (see workflow: rules in .gitlab-ci.yml).

.web:
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store
  cache:
    key:
      prefix: pnpm
      files: [web/pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - node --version
    - corepack enable
    - cd web
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  rules:
    - if: $PIPELINE_PART == "all" || $PIPELINE_PART == "web"

web:checks:
  extends: .web
  stage: check
  image: node:22-bookworm
  timeout: 20m
  script:
    # make web-check = web-lint (hex colours + typecheck) + web-test + i18n-check + web-build-studio + web-build-console
    # (S-124, S-90; the French coverage gate since the engineering follow-ups)
    - make -C .. web-check
  artifacts:
    expire_in: 7 days
    paths: [web/apps/studio/dist/, web/apps/console/dist/]

# Playwright's image: Node 22, Chromium and its system libraries, same Playwright version as @northline/ui.
web:storybook:
  extends: .web
  stage: build
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs: []
  timeout: 25m
  script:
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    # Every story in headless Chromium: play functions + a11y addon (violations fail). Builds Storybook first.
    - make -C .. web-storybook-test
  artifacts:
    when: always
    expire_in: 7 days
    paths: [web/packages/ui/storybook-static/]

# S-126: the documentation site, both variants, and the page check (scripts/check-build.mjs).
web:docs:
  extends: .web
  stage: build
  image: node:22-bookworm
  needs: []
  timeout: 20m
  script:
    - make -C .. docs DOCS_VARIANT=public
    - make -C .. docs DOCS_VARIANT=internal

# The Studio smoke sweep (S-5) is part of the end-to-end suite now: PIPELINE_PART=e2e (ci/gitlab/e2e.yml, S-117).

# Optional: Run pipeline with RUN_A11Y=true (S-109). Builds the Studio, console and consumer, then Playwright + axe
# against them with a mock api replaying the apps' test fixtures (docs/a11y/audit.md).
web:a11y:
  extends: .web
  stage: smoke
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs: []
  timeout: 30m
  variables:
    CI: "true"
  rules:
    - if: ($PIPELINE_PART == "all" || $PIPELINE_PART == "web") && $RUN_A11Y == "true"
  script:
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    - make -C .. a11y
  artifacts:
    when: always
    expire_in: 7 days
    paths: [web/packages/a11y/a11y-results/]
