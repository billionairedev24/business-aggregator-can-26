# S-104 — security scans (docs/security/README.md). Included from .gitlab-ci.yml; pipelines exist only when started by
# hand: PIPELINE_PART=security (never part of `all`).

security:scan:
  stage: check
  needs: []
  image: eclipse-temurin:25-jdk
  timeout: 60m
  rules:
    - if: $PIPELINE_PART == "security"
  variables:
    GIT_DEPTH: 0                    # gitleaks scans the whole history
    GRADLE_FLAGS: "--max-workers=2 --console=plain"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl python3 python3-venv make > /dev/null
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    - make security-tools
    - make security-scan
  artifacts:
    when: always
    paths: [build/security/]
    expire_in: 30 days
