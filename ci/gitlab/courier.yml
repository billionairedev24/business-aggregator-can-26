# S-87 — the courier app (mobile/, Expo) on GitLab. Included from .gitlab-ci.yml. docs/runbooks/courier-app.md.
# Pipelines only exist when started by hand (workflow: rules in .gitlab-ci.yml), and these jobs only with
# PIPELINE_PART=courier (never part of `all`); the EAS build is a further manual job inside that pipeline.

.courier:
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    PNPM_STORE_DIR: $CI_PROJECT_DIR/.pnpm-store
    CI: "1"
  cache:
    key:
      prefix: pnpm-mobile
      files: [mobile/pnpm-lock.yaml]
    paths: [.pnpm-store/]
  before_script:
    - command -v make >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends make >/dev/null)
    - corepack enable
    - cd mobile
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile
  rules:
    - if: $PIPELINE_PART == "courier"

# make courier-check = ESLint + tsc + Jest/RNTL + `expo export` of the iOS and Android bundles
courier:checks:
  extends: .courier
  stage: check
  image: node:22-bookworm
  timeout: 25m
  script:
    - make -C .. courier-check

# The web build on the fixture backend in headless Chromium (Playwright's image: same version as playwright-core).
courier:web-smoke:
  extends: .courier
  stage: smoke
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  needs: []
  timeout: 20m
  variables:
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  script:
    - make -C .. courier-web-smoke
  artifacts:
    when: always
    expire_in: 7 days
    paths: [mobile/apps/courier/smoke-out/]

# EAS Build of COURIER_EAS_PROFILE (preview by default) after the checks; needs the EXPO_TOKEN CI/CD variable.
courier:eas-build:
  extends: .courier
  stage: build
  image: node:22-bookworm
  needs: [courier:checks]
  timeout: 30m
  rules:
    - if: $PIPELINE_PART == "courier" && $EXPO_TOKEN
      when: manual
      allow_failure: true
  script:
    - make -C .. courier-eas-build EAS_PROFILE=${COURIER_EAS_PROFILE:-preview} EAS_PLATFORM=${COURIER_EAS_PLATFORM:-all} EAS_FLAGS=--no-wait
