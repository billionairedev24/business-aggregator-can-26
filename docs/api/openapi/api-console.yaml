openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "Platform staff: role `STAFF` and a second factor (`acr=mfa`) on every\
    \ call (403 `mfa_required` otherwise)."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Console
  version: v1
servers:
- url: http://localhost:8080
security:
- bffSession: []
  csrf: []
- oauth2:
  - openid
paths:
  /api/v1/console/payments/tax-reconciliations:
    post:
      operationId: taxReconciliationRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Report"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - tax-reconciliation-controller
  /api/v1/console/registry-reviews:
    get:
      operationId: registryReviewOpen
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListResponseReviewView"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
      tags:
      - registry-review-controller
  /api/v1/console/registry-reviews/{id}/decision:
    post:
      operationId: registryReviewDecide
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewView"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - registry-review-controller
components:
  schemas:
    DecisionRequest:
      type: object
      properties:
        decision:
          type: string
          minLength: 1
          pattern: approve|reject
        expiresOn:
          type: string
          format: date
        note:
          type: string
          maxLength: 500
          minLength: 0
        reference:
          type: string
          maxLength: 120
          minLength: 0
      required:
      - decision
    ListResponseReviewView:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewView"
    Problem:
      type: object
      description: RFC 9457 problem details. 403 and 409 carry a machine-readable
        `code`.
      properties:
        code:
          type: string
          description: "Stable reason, e.g. `mfa_required`, `not_a_member`, `insufficient_role`,\
            \ `partner_not_allowed`, `not_bound`, `stale`, `duplicate`, `rate_limited`."
          example: mfa_required
        detail:
          type: string
          example: Your sign-in doesn't allow this.
        instance:
          type: string
          format: uri-reference
        status:
          type: integer
          format: int32
          example: 403
        title:
          type: string
          example: Forbidden
        type:
          type: string
          format: uri
          example: https://northline.ca/problems/forbidden
      required:
      - status
      - title
      - type
    ReconcileRequest:
      type: object
      properties:
        period:
          type: string
    Report:
      type: object
      properties:
        checked:
          type: integer
          format: int32
        mismatched:
          type: integer
          format: int32
        period:
          type: string
        reported:
          type: integer
          format: int32
        rows:
          type: integer
          format: int32
        stillPending:
          type: integer
          format: int32
    ReviewView:
      type: object
      properties:
        businessName:
          type: string
        checkKey:
          type: string
        checkedAt:
          type: string
          format: date-time
        expectedName:
          type: string
        id:
          type: string
        merchantId:
          type: string
        outcome:
          type: string
        queryNumber:
          type: string
        reasons:
          type: array
          items:
            type: string
        recordExpiresOn:
          type: string
          format: date
        recordName:
          type: string
        recordNumber:
          type: string
        recordStatus:
          type: string
        reference:
          type: string
        registry:
          type: string
        reviewNote:
          type: string
        reviewState:
          type: string
        source:
          type: string
        subject:
          type: string
    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: "JSON property path of the request, e.g. `displayName` or `lines[2].amount`."
          example: displayName
        message:
          type: string
          description: "The exact message of docs/spec/validation-rules.md, in the\
            \ caller's locale."
          example: At least 2 characters.
        rule:
          type: string
          description: "The failed rule: `required`, `format`, `length`, `range`,\
            \ or a named rule (snake_case), e.g. `gst_number`."
          example: length
      required:
      - field
      - message
      - rule
    ValidationErrors:
      type: object
      description: "422: one error per field, the most basic failing rule first."
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required:
      - errors
  securitySchemes:
    bffSession:
      description: "Browsers only (the Studio, the consumer web): the BFF's HttpOnly\
        \ session cookie (`__Host-` prefixed in the cloud). The BFF relays each call\
        \ to the api with the user's access token; the browser never sees a token.\
        \ Unsafe methods also need the `csrf` header."
      in: cookie
      name: NL_STUDIO
      type: apiKey
    csrf:
      description: "Copy of the `XSRF-TOKEN` cookie (`__Host-XSRF-TOKEN` in the cloud)\
        \ on POST, PUT, PATCH and DELETE."
      in: header
      name: X-XSRF-TOKEN
      type: apiKey
    oauth2:
      description: "OAuth 2.1 authorization code with PKCE (S256 only) at northline-auth;\
        \ ES256 JWT access tokens valid 10 minutes with claims `sub`, `scope`, `roles`,\
        \ `merchants`, `acr`. Business and staff calls need `acr=mfa` (passkey or\
        \ TOTP). Confidential clients: the BFFs; public clients: the mobile apps (with\
        \ DPoP)."
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:9000/oauth2/authorize
          refreshUrl: http://localhost:9000/oauth2/token
          scopes:
            merchant: "the Studio: businesses the user is a member of (acr=mfa required)"
            openid: OpenID Connect sign-in
            profile: "name, locale"
          tokenUrl: http://localhost:9000/oauth2/token
      type: oauth2
