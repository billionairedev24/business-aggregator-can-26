          maxLength: 500
          minLength: 0
      required:
      - action
    ApplicationDetail:
      type: object
      properties:
        application:
          $ref: "#/components/schemas/ApplicationRow"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/DecisionRow"
