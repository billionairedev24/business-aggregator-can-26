openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "Platform staff: role `STAFF` and a second factor (`acr=mfa`) on every\
    \ call (403 `mfa_required` otherwise)."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Console
  version: v1
servers:
- url: http://localhost:8080
security:
- bffSession: []
  csrf: []
- oauth2:
  - openid
paths:
  /api/v1/console/disputes:
    get:
      operationId: disputesQueue
      parameters:
      - in: query
        name: province
        required: false
        schema:
          type: string
      - in: query
        name: market
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Queue"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
      tags:
      - disputes-controller
