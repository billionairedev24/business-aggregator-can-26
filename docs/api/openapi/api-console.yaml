  securitySchemes:
    bffSession:
      description: "Browsers only (the Studio, the consumer web): the BFF's HttpOnly\
        \ session cookie (`__Host-` prefixed in the cloud). The BFF relays each call\
        \ to the api with the user's access token; the browser never sees a token.\
        \ Unsafe methods also need the `csrf` header."
      in: cookie
      name: NL_STUDIO
      type: apiKey
    csrf:
      description: "Copy of the `XSRF-TOKEN` cookie (`__Host-XSRF-TOKEN` in the cloud)\
        \ on POST, PUT, PATCH and DELETE."
      in: header
      name: X-XSRF-TOKEN
      type: apiKey
    oauth2:
      description: "OAuth 2.1 authorization code with PKCE (S256 only) at northline-auth;\
        \ ES256 JWT access tokens valid 10 minutes with claims `sub`, `scope`, `roles`,\
        \ `merchants`, `acr`. Business and staff calls need `acr=mfa` (passkey or\
        \ TOTP). Confidential clients: the BFFs; public clients: the mobile apps (with\
        \ DPoP)."
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:9000/oauth2/authorize
          refreshUrl: http://localhost:9000/oauth2/token
          scopes:
            merchant: "the Studio: businesses the user is a member of (acr=mfa required)"
            openid: OpenID Connect sign-in
            profile: "name, locale"
          tokenUrl: http://localhost:9000/oauth2/token
      type: oauth2
