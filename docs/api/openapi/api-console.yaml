          items:
            $ref: "#/components/schemas/OwnerReview"
        registryReviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewView"
    ApplicationRow:
      type: object
      properties:
        businessName:
          type: string
        categories:
          type: array
          items:
            type: string
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckRow"
        city:
          type: string
        decidedAt:
          type: string
          format: date-time
        decision:
          type: string
          enum:
          - approved
          - info_requested
        legalName:
          type: string
        merchantId:
          type: string
        province:
          type: string
        risk:
          type: string
          enum:
          - low
          - medium
          - high
        status:
          type: string
        structure:
          type: string
        submittedAt:
          type: string
          format: date-time
        type:
          type: string
