components:
  schemas:
    AcceptObligationsRequest:
      type: object
      properties:
        version:
          type: string
          minLength: 1
      required:
      - version
    Accepted:
      type: object
      properties:
        merchantId:
          type: string
        role:
          type: string
    Account:
      type: object
      properties:
        disconnectedAt:
          type: string
          format: date-time
        effectiveAt:
          type: string
          format: date-time
        holderName:
          type: string
        id:
          type: string
        institutionName:
          type: string
        label:
          type: string
        last4:
          type: string
        method:
          type: string
          enum:
          - instant
          - manual
        state:
          type: string
          enum:
          - draft
          - pending
          - active
          - replaced
          - discarded
    AccountRequest:
      type: object
      properties:
        businessTermsAccepted:
          type: boolean
        province:
          type: string
          enum:
          - AB
          - BC
          - MB
          - NB
          - NL
          - NS
          - NT
          - NU
          - "ON"
          - PE
          - QC
          - SK
          - YT
        type:
          type: string
          enum:
          - provider
          - seller
          - kitchen
          - both
        workEmail:
          type: string
          maxLength: 254
          minLength: 0
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$"
      required:
      - province
      - type
    ActionBody:
      type: object
      properties:
        arguments:
          type: object
          additionalProperties: {}
        tool:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - tool
    ActionResult:
      type: object
      properties:
        screen:
          type: string
        summary:
          type: string
        tool:
          type: string
    AddWebhookRequest:
      type: object
      properties:
        events:
          type: array
          items:
            type: string
          minItems: 1
        url:
          type: string
          minLength: 1
      required:
      - events
      - url
    AiStatus:
      type: object
      properties:
        available:
          type: boolean
        provider:
          type: string
    Answer:
      type: object
      properties:
        content:
          type: string
        model:
          type: string
        pending:
          $ref: "#/components/schemas/PendingAction"
        screen:
          type: string
        toolRuns:
          type: array
          items:
            $ref: "#/components/schemas/ToolRun"
        usage:
          $ref: "#/components/schemas/Usage"
    ApiKeyResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        lastUsedAt:
          type: string
          format: date-time
        name:
          type: string
        prefix:
          type: string
        rateLimit:
          type: integer
          format: int32
        scopes:
          type: array
          items:
            type: string
    Applied:
      type: object
      properties:
        groupsCreated:
          type: integer
          format: int32
        groupsUpdated:
          type: integer
          format: int32
        itemsCreated:
          type: integer
          format: int32
        itemsHidden:
          type: integer
          format: int32
        itemsUpdated:
          type: integer
          format: int32
        sectionsCreated:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
    ApprovalBody:
      type: object
      properties:
        amountCents:
          type: integer
          format: int64
          description: Cents of Canadian dollars (CAD).
          exclusiveMinimum: 0
        description:
          type: string
          maxLength: 160
          minLength: 0
      required:
      - amountCents
      - description
    ApprovalResponse:
      type: object
      properties:
        amountCents:
          type: integer
          format: int64
          description: Cents of Canadian dollars (CAD).
        decidedAt:
          type: string
          format: date-time
        description:
          type: string
        id:
          type: string
        requestedAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - pending
          - approved
          - declined
    Article:
      type: object
      properties:
        body:
          type: string
        readMin:
          type: integer
          format: int32
        section:
          type: string
        slug:
          type: string
        title:
          type: string
        topicKeys:
          type: array
          items:
            type: string
    ArticleSummary:
      type: object
      properties:
        readMin:
          type: integer
          format: int32
        section:
          type: string
        slug:
          type: string
        title:
          type: string
    Attachment:
      type: object
      properties:
        byteSize:
          type: integer
          format: int64
        contentType:
          type: string
        fileName:
          type: string
        id:
          type: string
    AttachmentResponse:
      type: object
      properties:
        contentType:
          type: string
        fileName:
          type: string
        id:
          type: string
        sizeBytes:
          type: integer
          format: int64
    AuditEntryResponse:
      type: object
      properties:
        action:
          type: string
        actorId:
          type: string
        actorName:
          type: string
        at:
          type: string
          format: date-time
        id:
          type: string
        role:
          type: string
        targetId:
          type: string
        targetType:
          type: string
    AutoPause:
      type: object
      properties:
        active:
          type: boolean
        lateOrders:
          type: integer
          format: int32
        threshold:
          type: integer
          format: int32
    BankAccount:
      type: object
      properties:
        accountNumber:
          type: string
          pattern: "^\\d{7,12}$"
        financialConnectionsAccount:
          type: string
          maxLength: 255
          minLength: 0
        holderName:
          type: string
          maxLength: 120
          minLength: 0
        institution:
          type: string
          pattern: "^\\d{3}$"
        linkedAccount:
          type: string
          maxLength: 255
          minLength: 0
        method:
          type: string
          enum:
          - instant
          - manual
        transit:
          type: string
          pattern: "^\\d{5}$"
      required:
      - method
    BoardResponse:
      type: object
      properties:
        counts:
          $ref: "#/components/schemas/CountsResponse"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderResponse"
    Body:
      type: object
      properties:
        notes:
          type: string
          maxLength: 1000
          minLength: 0
    BookableBody:
      type: object
      properties:
        bookable:
          type: boolean
      required:
      - bookable
    BundleItemRequest:
      type: object
      properties:
        offerId:
          type: string
          minLength: 1
        qty:
          type: integer
          format: int32
          maximum: 99
          minimum: 1
        variantId:
          type: string
      required:
      - offerId
      - qty
    BundleItemResponse:
      type: object
      properties:
