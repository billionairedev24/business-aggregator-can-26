    get:
      operationId: aiStatusStatus
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AiStatus"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
