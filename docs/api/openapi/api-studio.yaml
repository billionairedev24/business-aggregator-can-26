openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "The business Studio, through the studio-bff. Every `{merchantId}`\
    \ endpoint checks that the caller is a member of that business with a role that\
    \ grants the permission, on every request, and that the sign-in used a second\
    \ factor (`acr=mfa`); otherwise 403 with `code` `not_a_member`, `insufficient_role`\
    \ or `mfa_required`. Money-moving POSTs take an `Idempotency-Key` header (kept\
    \ 24 h)."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Studio
  version: v1
servers:
- url: http://localhost:8080
security:
- bffSession: []
  csrf: []
- oauth2:
  - merchant
paths:
