      description: |-
        A refund was paid back to the customer's original payment method.

        Sent as `POST` to each endpoint subscribed to `refund.issued` in Studio › Settings › API. Verify `Northline-Signature` (HMAC-SHA256 of `<t>.<raw body>` with the endpoint's `whsec_…` secret; reject timestamps older than 5 minutes) and deduplicate on the event `id`. Any 2xx acknowledges; everything else is retried with back-off for about 3 days (docs/runbooks/webhooks.md).
