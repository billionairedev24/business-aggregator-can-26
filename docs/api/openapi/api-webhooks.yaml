  webhook.test:
    post:
      description: |-
        Sent from Studio › Settings › API & integrations (Send test event). Not a business event: acknowledge it with 2xx.

        Sent as `POST` to each endpoint subscribed to `webhook.test` in Studio › Settings › API. Verify `Northline-Signature` (HMAC-SHA256 of `<t>.<raw body>` with the endpoint's `whsec_…` secret; reject timestamps older than 5 minutes) and deduplicate on the event `id`. Any 2xx acknowledges; everything else is retried with back-off for about 3 days (docs/runbooks/webhooks.md).
      operationId: webhook_webhook_test_v1
      parameters:
