openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "For partner integrations (S-30): a token from northline-auth with\
    \ client credentials and `private_key_jwt`, carrying `api.read` / `api.write`.\
    \ It opens only the businesses bound to the partner (otherwise 403 `not_bound`)\
    \ and only these endpoints (otherwise 403 `partner_not_allowed`). Events arrive\
    \ as signed webhooks (the `webhooks` document)."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Partners
  version: v1
servers:
- url: http://localhost:8080
security:
- partnerClientCredentials:
  - api.read
paths:
  /api/v1/merchants/{merchantId}/listings:
    get:
      operationId: listingList
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
      - in: query
        name: kind
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 500
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ListResponseListingItem"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      security:
      - partnerClientCredentials:
        - api.read
      tags:
      - listing-controller
  /api/v1/merchants/{merchantId}/listings/{listingId}:
    get:
      operationId: listingGet
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
      - in: path
        name: listingId
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ProductResponse"
                - $ref: "#/components/schemas/ServiceResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      security:
      - partnerClientCredentials:
        - api.read
      tags:
      - listing-controller
  /api/v1/merchants/{merchantId}/listings/{listingId}/price-stock:
    patch:
      operationId: listingUpdatePriceAndStock
      parameters:
      - in: path
        name: merchantId
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
      - in: path
        name: listingId
        required: true
        schema:
          $ref: "#/components/schemas/Ulid"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceStockRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ProductResponse"
                - $ref: "#/components/schemas/ServiceResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      security:
      - partnerClientCredentials:
        - api.write
      tags:
      - listing-controller
components:
  schemas:
    CompletenessResponse:
      type: object
      properties:
        done:
          type: integer
          format: int32
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingField"
        percent:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    ListResponseListingItem:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListingItem"
    ListingDetail: {}
    ListingItem:
      type: object
      properties:
        categoryId:
          type: string
        id:
          type: string
        kind:
          type: string
          enum:
          - service
          - product
        meta:
          type: string
        name:
          type: string
        priceCents:
          type: integer
          format: int64
          description: Cents of Canadian dollars (CAD).
        pricingMode:
          type: string
          enum:
          - fixed
          - quote
          - hourly
        revetReasons:
          type: array
          items:
            type: string
            enum:
            - price
            - category
            - images
        sales30d:
          type: integer
          format: int32
        sku:
          type: string
        status:
          type: string
          enum:
          - live
          - hidden
        stock:
          type: integer
          format: int32
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        vetting:
          type: string
          enum:
          - draft
          - pending
          - approved
          - rejected
        vettingFlags:
          type: array
          items:
            type: string
            enum:
            - banned_category
            - price_outlier
            - missing_licence
            - duplicate_image
            - main_not_on_white
    MediaResponse:
      type: object
      properties:
        height:
          type: integer
          format: int32
        id:
          type: string
        onWhite:
          type: boolean
        url:
          type: string
        width:
          type: integer
          format: int32
    MissingField:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    PriceStockRequest:
      type: object
      properties:
        priceCents:
          type: integer
          format: int64
          description: "New price in cents (CAD), tax excluded. Leave out to keep\
            \ the current price."
          exclusiveMinimum: 0
          maximum: 1000000000
        stock:
          type: integer
          format: int32
          description: Units in stock (products only). Leave out to keep the current
            stock.
          minimum: 0
    Problem:
      type: object
      description: RFC 9457 problem details. 403 and 409 carry a machine-readable
        `code`.
      properties:
        code:
          type: string
          description: "Stable reason, e.g. `mfa_required`, `not_a_member`, `insufficient_role`,\
            \ `partner_not_allowed`, `not_bound`, `stale`, `duplicate`, `rate_limited`."
          example: mfa_required
        detail:
          type: string
          example: Your sign-in doesn't allow this.
        instance:
          type: string
          format: uri-reference
        status:
          type: integer
          format: int32
          example: 403
        title:
          type: string
          example: Forbidden
        type:
          type: string
          format: uri
          example: https://northline.ca/problems/forbidden
      required:
      - status
      - title
      - type
    ProductResponse:
      allOf:
      - $ref: "#/components/schemas/ListingDetail"
      - type: object
        properties:
          attributes:
            type: object
            additionalProperties:
              type: string
          bilingualOk:
            type: boolean
          brand:
            type: string
          bullets:
            type: array
            items:
              type: string
          catalogRef:
            type: string
          catalogTitle:
            type: string
          catalogueImages:
            type: array
            items:
              $ref: "#/components/schemas/MediaResponse"
          categoryId:
            type: string
          compareAtCents:
            type: integer
            format: int64
          completeness:
            $ref: "#/components/schemas/CompletenessResponse"
          condition:
            type: string
            enum:
            - new
            - open_box
            - refurbished
            - used_good
          contentLocked:
            type: boolean
          contentShared:
            type: boolean
          costCents:
            type: integer
            format: int64
          countryOfOrigin:
            type: string
          description:
            type: string
          fulfilment:
            type: array
            items:
              type: string
              enum:
              - pooled
              - install
              - pickup
              - ship
          gtin:
            type: string
          handlingTime:
            type: string
            enum:
            - same_day
            - next_day
            - two_days
          id:
            type: string
          identifierType:
            type: string
            enum:
            - gtin
            - ean
            - isbn
            - none
          imageSource:
            type: string
            enum:
            - shared
            - own
          images:
            type: array
            items:
              $ref: "#/components/schemas/MediaResponse"
          kind:
            type: string
          lowStockAt:
            type: integer
            format: int32
          mpn:
            type: string
          priceCents:
            type: integer
            format: int64
          restrictedOk:
            type: boolean
          returnsPolicy:
            type: string
            enum:
            - standard_14
            - final_sale
          revetReasons:
            type: array
            items:
              type: string
              enum:
              - price
              - category
              - images
          searchKeywords:
            type: string
          sellerCount:
            type: integer
            format: int32
          sharedRecord:
            type: boolean
          sku:
            type: string
          status:
            type: string
            enum:
            - live
            - hidden
          stock:
            type: integer
            format: int32
          submittedAt:
            type: string
            format: date-time
          title:
            type: string
          updatedAt:
            type: string
            format: date-time
          variantTheme:
            type: string
            enum:
            - none
            - size
            - colour
            - size_colour
            - length
            - length_position
          variants:
            type: array
            items:
              $ref: "#/components/schemas/VariantResponse"
          vetting:
            type: string
            enum:
            - draft
            - pending
            - approved
            - rejected
          vettingFlags:
            type: array
            items:
              type: string
              enum:
              - banned_category
              - price_outlier
              - missing_licence
              - duplicate_image
              - main_not_on_white
          warranty:
            type: boolean
    ServiceResponse:
      allOf:
      - $ref: "#/components/schemas/ListingDetail"
      - type: object
        properties:
          bufferMin:
            type: integer
            format: int32
          categoryId:
            type: string
          completeness:
            $ref: "#/components/schemas/CompletenessResponse"
          durationMin:
            type: integer
            format: int32
          id:
            type: string
          included:
            type: string
          instantBook:
            type: boolean
          kind:
            type: string
          name:
            type: string
          priceCents:
            type: integer
            format: int64
          pricingMode:
            type: string
            enum:
            - fixed
            - quote
            - hourly
          revetReasons:
            type: array
            items:
              type: string
              enum:
              - price
              - category
              - images
          sku:
            type: string
          status:
            type: string
            enum:
            - live
            - hidden
          submittedAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          vetting:
            type: string
            enum:
            - draft
            - pending
            - approved
            - rejected
          vettingFlags:
            type: array
            items:
              type: string
              enum:
              - banned_category
              - price_outlier
              - missing_licence
              - duplicate_image
              - main_not_on_white
    Ulid:
      type: string
      description: "A ULID: 26 characters, Crockford base 32, sortable by creation\
        \ time."
      example: 01J9ZD3V00000000000000PWM1
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: "JSON property path of the request, e.g. `displayName` or `lines[2].amount`."
          example: displayName
        message:
          type: string
          description: "The exact message of docs/spec/validation-rules.md, in the\
            \ caller's locale."
          example: At least 2 characters.
        rule:
          type: string
          description: "The failed rule: `required`, `format`, `length`, `range`,\
            \ or a named rule (snake_case), e.g. `gst_number`."
          example: length
      required:
      - field
      - message
      - rule
    ValidationErrors:
      type: object
      description: "422: one error per field, the most basic failing rule first."
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required:
      - errors
    VariantResponse:
      type: object
      properties:
        gtin:
          type: string
        id:
          type: string
        priceCents:
          type: integer
          format: int64
          description: Cents of Canadian dollars (CAD).
        sku:
          type: string
        stock:
          type: integer
          format: int32
        value:
          type: string
  securitySchemes:
    partnerClientCredentials:
      description: "Partner integrations (S-30): client `partner:<name>` gets a token\
        \ with `grant_type=client_credentials`, authenticating with `private_key_jwt`\
        \ — `client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer`\
        \ and a `client_assertion` JWT signed by a key registered for the partner\
        \ (ES256, RS256 or PS256; `iss` = `sub` = client id, `aud` = issuer or token\
        \ endpoint, ≤ 5 min, single-use `jti`). Tokens last 15 minutes and open only\
        \ the businesses bound to the partner. 60 tokens per hour per partner (429\
        \ with Retry-After)."
      flows:
        clientCredentials:
          scopes:
            api.read: read the bound businesses' data
            api.write: change it
          tokenUrl: http://localhost:9000/oauth2/token
      type: oauth2
      x-token-endpoint-auth-methods:
      - private_key_jwt
