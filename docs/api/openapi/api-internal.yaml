openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "Not for clients: callbacks from providers (Stripe, Google and Microsoft\
    \ calendars, Shopify / Square / Lightspeed), each authenticated by the provider's\
    \ signature or a single-use state instead of a token; signed email links; the\
    \ on-call rota for paging tools (its own shared token, S-113); and the `local`-only\
    \ dev tools. Never published outside local, dev and staging."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Internal
  version: v1
servers:
- url: http://localhost:8080
security: []
paths:
  /api/v1/calendar/oauth/{provider}/callback:
    get:
      operationId: calendarOAuthCallback
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      tags:
      - calendar-o-auth-controller
  /api/v1/commerce/oauth/{platform}/callback:
    get:
      operationId: oAuthCallbackCallback
      parameters:
      - in: path
        name: platform
        required: true
        schema:
          type: string
      - in: query
        name: params
        required: true
        schema:
          type: object
          additionalProperties:
            type: string
      responses:
        "200":
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      tags:
      - o-auth-callback-controller
  /api/v1/dev/proof-photos/{token}:
    get:
      operationId: devProofPhotoPhoto
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: byte
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      tags:
      - dev-proof-photo-controller
  /api/v1/email/unsubscribe:
    get:
      operationId: emailUnsubscribeConfirm
      parameters:
      - in: query
        name: t
        required: false
        schema:
          type: string
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
      tags:
      - email-unsubscribe-controller
    post:
      operationId: emailUnsubscribeUnsubscribe
      parameters:
      - in: query
        name: t
        required: false
        schema:
          type: string
      - in: query
        name: List-Unsubscribe
        required: false
        schema:
          type: string
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
      tags:
      - email-unsubscribe-controller
  /api/v1/ops/oncall:
    get:
      description: "The rota from 12 h ago to 8 days ahead and who is on call now,\
        \ with each person's email. Authorization: Bearer <ONCALL_EXPORT_TOKEN>. 404\
        \ when the export is not configured."
      operationId: oncallExportJson
      parameters:
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      - in: query
        name: token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK
      summary: Who is on call (for paging tools)
      tags:
      - oncall-export-controller
  /api/v1/ops/oncall.ics:
    get:
      description: "One event per shift; SUMMARY is the person's email. Authorization:\
        \ Bearer <ONCALL_EXPORT_TOKEN>, or ?token= for calendar clients. 404 when\
        \ the export is not configured."
      operationId: oncallExportCalendar
      parameters:
      - in: header
        name: Authorization
        required: false
        schema:
          type: string
      - in: query
        name: token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      summary: The on-call rota as an iCalendar feed
      tags:
      - oncall-export-controller
  /api/v1/webhooks/calendar/google:
    post:
      operationId: calendarWebhookGoogle
      parameters:
      - in: header
        name: X-Goog-Channel-ID
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Channel-Token
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Resource-ID
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Resource-State
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Message-Number
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - calendar-webhook-controller
  /api/v1/webhooks/calendar/microsoft:
    post:
      operationId: calendarWebhookMicrosoft
      parameters:
      - in: query
        name: validationToken
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - calendar-webhook-controller
  /api/v1/webhooks/calendar/microsoft/lifecycle:
    post:
      operationId: calendarWebhookMicrosoft_1
      parameters:
      - in: query
        name: validationToken
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - calendar-webhook-controller
  /api/v1/webhooks/commerce/{provider}:
    post:
      operationId: commerceWebhookReceive
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              format: byte
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - commerce-webhook-controller
  /api/v1/webhooks/stripe:
    post:
      operationId: stripeWebhookPlatform
      parameters:
      - in: header
        name: Stripe-Signature
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - stripe-webhook-controller
  /api/v1/webhooks/stripe/connect:
    post:
      operationId: stripeWebhookConnect
      parameters:
      - in: header
        name: Stripe-Signature
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - stripe-webhook-controller
components:
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. 403 and 409 carry a machine-readable
        `code`.
      properties:
        code:
          type: string
          description: "Stable reason, e.g. `mfa_required`, `not_a_member`, `insufficient_role`,\
            \ `partner_not_allowed`, `not_bound`, `stale`, `duplicate`, `rate_limited`."
          example: mfa_required
        detail:
          type: string
          example: Your sign-in doesn't allow this.
        instance:
          type: string
          format: uri-reference
        status:
          type: integer
          format: int32
          example: 403
        title:
          type: string
          example: Forbidden
        type:
          type: string
          format: uri
          example: https://northline.ca/problems/forbidden
      required:
      - status
      - title
      - type
    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: "JSON property path of the request, e.g. `displayName` or `lines[2].amount`."
          example: displayName
        message:
          type: string
          description: "The exact message of docs/spec/validation-rules.md, in the\
            \ caller's locale."
          example: At least 2 characters.
        rule:
          type: string
          description: "The failed rule: `required`, `format`, `length`, `range`,\
            \ or a named rule (snake_case), e.g. `gst_number`."
          example: length
      required:
      - field
      - message
      - rule
    ValidationErrors:
      type: object
      description: "422: one error per field, the most basic failing rule first."
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required:
      - errors
  securitySchemes: {}
