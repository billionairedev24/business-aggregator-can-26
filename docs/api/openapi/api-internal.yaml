openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "Not for clients: callbacks from providers (Stripe, Google and Microsoft\
    \ calendars, Shopify / Square / Lightspeed), each authenticated by the provider's\
    \ signature or a single-use state instead of a token; signed email links; and\
    \ the `local`-only dev tools. Never published outside local, dev and staging."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Internal
  version: v1
servers:
- url: http://localhost:8080
security: []
paths:
  /api/v1/calendar/oauth/{provider}/callback:
    get:
      operationId: calendarOAuthCallback
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      - in: query
        name: code
        required: false
        schema:
          type: string
      - in: query
        name: state
        required: false
        schema:
          type: string
      - in: query
        name: error
        required: false
        schema:
          type: string
      - in: query
        name: user
        required: true
        schema:
          $ref: "#/components/schemas/CurrentUser"
      responses:
        "200":
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      tags:
      - calendar-o-auth-controller
  /api/v1/commerce/oauth/{platform}/callback:
    get:
      operationId: oAuthCallbackCallback
      parameters:
      - in: path
        name: platform
        required: true
        schema:
          type: string
      - in: query
        name: params
        required: true
        schema:
          type: object
          additionalProperties:
            type: string
      responses:
        "200":
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
      tags:
      - o-auth-callback-controller
  /api/v1/email/unsubscribe:
    get:
      operationId: emailUnsubscribeConfirm
      parameters:
      - in: query
        name: t
        required: false
        schema:
          type: string
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
      tags:
      - email-unsubscribe-controller
    post:
      operationId: emailUnsubscribeUnsubscribe
      parameters:
      - in: query
        name: t
        required: false
        schema:
          type: string
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
      tags:
      - email-unsubscribe-controller
  /api/v1/webhooks/calendar/google:
    post:
      operationId: calendarWebhookGoogle
      parameters:
      - in: header
        name: X-Goog-Channel-ID
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Channel-Token
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Resource-ID
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Resource-State
        required: false
        schema:
          type: string
      - in: header
        name: X-Goog-Message-Number
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
      tags:
      - calendar-webhook-controller
  /api/v1/webhooks/calendar/microsoft:
    post:
      operationId: calendarWebhookMicrosoft
      parameters:
      - in: query
        name: validationToken
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - calendar-webhook-controller
  /api/v1/webhooks/calendar/microsoft/lifecycle:
    post:
      operationId: calendarWebhookMicrosoft_1
      parameters:
      - in: query
        name: validationToken
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - calendar-webhook-controller
  /api/v1/webhooks/commerce/{provider}:
    post:
      operationId: commerceWebhookReceive
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
              format: byte
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "404":
          content:
            application/problem+json:
              examples:
                not_found:
                  value:
                    code: not_found
                    detail: Not found.
                    status: 404
                    title: Not found.
                    type: https://northline.ca/problems/not-found
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not found.
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - commerce-webhook-controller
  /api/v1/webhooks/stripe:
    post:
      operationId: stripeWebhookPlatform
      parameters:
      - in: header
        name: Stripe-Signature
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - stripe-webhook-controller
  /api/v1/webhooks/stripe/connect:
    post:
      operationId: stripeWebhookConnect
      parameters:
      - in: header
        name: Stripe-Signature
        required: false
        schema:
          type: string
      requestBody:
        content:
          '*/*':
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: object
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      tags:
      - stripe-webhook-controller
components:
  schemas:
    CurrentUser:
      type: object
      properties:
        mfa:
          type: boolean
        roles:
          type: array
          items:
            type: string
          uniqueItems: true
        scopes:
          type: array
          items:
            type: string
          uniqueItems: true
        userId:
          type: string
    MoneyCents:
      type: integer
      format: int64
      description: An amount in cents of Canadian dollars (CAD); 12345 = $123.45.
        Never a decimal.
      example: 12345
    Problem:
      type: object
      description: RFC 9457 problem details. 403 and 409 carry a machine-readable
        `code`.
      properties:
        code:
          type: string
          description: "Stable reason, e.g. `mfa_required`, `not_a_member`, `insufficient_role`,\
            \ `partner_not_allowed`, `not_bound`, `stale`, `duplicate`, `rate_limited`."
          example: mfa_required
        detail:
          type: string
          example: Your sign-in doesn't allow this.
        instance:
          type: string
          format: uri-reference
        status:
          type: integer
          format: int32
          example: 403
        title:
          type: string
          example: Forbidden
        type:
          type: string
          format: uri
          example: https://northline.ca/problems/forbidden
      required:
      - status
      - title
      - type
    Ulid:
      type: string
      description: "A ULID: 26 characters, Crockford base 32, sortable by creation\
        \ time."
      example: 01J9ZD3V00000000000000PWM1
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: "JSON property path of the request, e.g. `displayName` or `lines[2].amount`."
          example: displayName
        message:
          type: string
          description: "The exact message of docs/spec/validation-rules.md, in the\
            \ caller's locale."
          example: At least 2 characters.
        rule:
          type: string
          description: "The failed rule: `required`, `format`, `length`, `range`,\
            \ or a named rule (snake_case), e.g. `gst_number`."
          example: length
      required:
      - field
      - message
      - rule
    ValidationErrors:
      type: object
      description: "422: one error per field, the most basic failing rule first."
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required:
      - errors
  securitySchemes:
    bffSession:
      description: "Browsers only (the Studio, the consumer web): the BFF's HttpOnly\
        \ session cookie (`__Host-` prefixed in the cloud). The BFF relays each call\
        \ to the api with the user's access token; the browser never sees a token.\
        \ Unsafe methods also need the `csrf` header."
      in: cookie
      name: NL_STUDIO
      type: apiKey
    csrf:
      description: "Copy of the `XSRF-TOKEN` cookie (`__Host-XSRF-TOKEN` in the cloud)\
        \ on POST, PUT, PATCH and DELETE."
      in: header
      name: X-XSRF-TOKEN
      type: apiKey
    dpop:
      bearerFormat: JWT
      description: "The mobile and courier apps (S-29): `Authorization: DPoP <access\
        \ token>` together with the `DPoP` proof header. A DPoP-bound token (`cnf.jkt`)\
        \ sent as a Bearer token is refused."
      scheme: DPoP
      type: http
    dpopProof:
      description: "DPoP proof JWT (`typ: dpop+jwt`, `htm`, `htu`, `iat`, `jti`, `ath`);\
        \ a server nonce may be demanded with `DPoP-Nonce`."
      in: header
      name: DPoP
      type: apiKey
    oauth2:
      description: "OAuth 2.1 authorization code with PKCE (S256 only) at northline-auth;\
        \ ES256 JWT access tokens valid 10 minutes with claims `sub`, `scope`, `roles`,\
        \ `merchants`, `acr`. Business and staff calls need `acr=mfa` (passkey or\
        \ TOTP). Confidential clients: the BFFs; public clients: the mobile apps (with\
        \ DPoP)."
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:9000/oauth2/authorize
          refreshUrl: http://localhost:9000/oauth2/token
          scopes:
            merchant: "the Studio: businesses the user is a member of (acr=mfa required)"
            openid: OpenID Connect sign-in
            profile: "name, locale"
          tokenUrl: http://localhost:9000/oauth2/token
      type: oauth2
    partnerClientCredentials:
      description: "Partner integrations (S-30): client `partner:<name>` gets a token\
        \ with `grant_type=client_credentials`, authenticating with `private_key_jwt`\
        \ — `client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer`\
        \ and a `client_assertion` JWT signed by a key registered for the partner\
        \ (ES256, RS256 or PS256; `iss` = `sub` = client id, `aud` = issuer or token\
        \ endpoint, ≤ 5 min, single-use `jti`). Tokens last 15 minutes and open only\
        \ the businesses bound to the partner. 60 tokens per hour per partner (429\
        \ with Retry-After)."
      flows:
        clientCredentials:
          scopes:
            api.read: read the bound businesses' data
            api.write: change it
          tokenUrl: http://localhost:9000/oauth2/token
      type: oauth2
      x-token-endpoint-auth-methods:
      - private_key_jwt
