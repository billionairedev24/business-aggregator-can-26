            schema:
              $ref: "#/components/schemas/Register"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStep"
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      security: []
      tags:
      - registration-controller
