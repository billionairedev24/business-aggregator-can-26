components:
  schemas:
    BackupCode:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - code
    BackupCodes:
      type: object
      properties:
        codes:
          type: array
          items:
            type: string
    Code:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: "^\\d{6}$"
      required:
      - code
    CodeSent:
      type: object
      properties:
        channel:
          type: string
        resendAfterSeconds:
          type: integer
          format: int64
    CurrentSession:
      type: object
      properties:
        current:
          type: string
    Identifier:
      type: object
      properties:
        identifier:
          type: string
          maxLength: 320
          minLength: 0
      required:
      - identifier
    JsonNode:
      type: object
      properties:
        array:
          type: boolean
        bigDecimal:
          type: boolean
        bigInteger:
          type: boolean
        binary:
          type: boolean
        boolean:
          type: boolean
        container:
          type: boolean
        double:
          type: boolean
        embeddedValue:
          type: boolean
        empty:
          type: boolean
        float:
          type: boolean
        floatingPointNumber:
          type: boolean
        int:
          type: boolean
        integralNumber:
          type: boolean
        long:
          type: boolean
        missingNode:
          type: boolean
        nodeType:
          type: string
          enum:
          - ARRAY
          - BINARY
          - BOOLEAN
          - MISSING
          - "NULL"
          - NUMBER
          - OBJECT
          - POJO
          - STRING
        "null":
          type: boolean
        number:
          type: boolean
        object:
          type: boolean
        pojo:
          type: boolean
        short:
          type: boolean
        string:
          type: boolean
        textual:
          type: boolean
          deprecated: true
        valueNode:
          type: boolean
    Overview:
      type: object
      properties:
        authenticator:
          type: boolean
        authenticatorSince:
          type: string
          format: date-time
        backupCodesIssuedAt:
          type: string
          format: date-time
        backupCodesRemaining:
          type: integer
          format: int32
        email:
          type: string
        mfaPrimary:
          type: string
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyView"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"
        signIns:
          type: array
          items:
            $ref: "#/components/schemas/SignInView"
    Passkey:
      type: object
      properties:
        credential:
          $ref: "#/components/schemas/JsonNode"
        label:
          type: string
      required:
      - credential
    PasskeyView:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        label:
          type: string
        lastUsedAt:
          type: string
          format: date-time
    Passkeys:
      type: object
      properties:
        passkeys:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyView"
    Problem:
      type: object
      description: RFC 9457 problem details. 403 and 409 carry a machine-readable
        `code`.
      properties:
        code:
          type: string
          description: "Stable reason, e.g. `mfa_required`, `not_a_member`, `insufficient_role`,\
            \ `partner_not_allowed`, `not_bound`, `stale`, `duplicate`, `rate_limited`."
          example: mfa_required
        detail:
          type: string
          example: Your sign-in doesn't allow this.
        instance:
          type: string
          format: uri-reference
        status:
          type: integer
          format: int32
          example: 403
        title:
          type: string
          example: Forbidden
        type:
          type: string
          format: uri
          example: https://northline.ca/problems/forbidden
      required:
      - status
      - title
      - type
    Register:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$"
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
          pattern: "^\\+?1?[\\s.-]?\\(?\\d{3}\\)?[\\s.-]?\\d{3}[\\s.-]?\\d{4}$"
        terms:
          type: boolean
        termsEnglishRequested:
          type: boolean
        termsLanguage:
          type: string
          pattern: ^(en|fr)$
      required:
      - email
      - firstName
      - lastName
      - phone
      - terms
    RegistrationStep:
      type: object
      properties:
        channel:
          type: string
        phone:
          type: string
        resendAfterSeconds:
          type: integer
          format: int64
        step:
          type: string
    Resend:
      type: object
      properties:
        channel:
          type: string
    Revoked:
      type: object
      properties:
        revoked:
          type: integer
          format: int32
    Session:
      type: object
      properties:
        acr:
          type: string
        continueTo:
          type: string
        user:
          $ref: "#/components/schemas/User"
    SessionView:
      type: object
      properties:
        apps:
          type: array
          items:
            type: string
        city:
          type: string
        current:
          type: boolean
        device:
          type: string
        id:
          type: string
        ipApprox:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        method:
          type: string
        signedInAt:
          type: string
          format: date-time
    Sessions:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionView"
    SignInStarted:
      type: object
      properties:
        factors:
          type: array
          items:
            type: string
        identifier:
          type: string
    SignInView:
      type: object
      properties:
        at:
          type: string
          format: date-time
        city:
          type: string
        device:
          type: string
        id:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        method:
          type: string
    StepUpProof:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        proof:
          type: string
    TotpSetup:
      type: object
      properties:
        otpauthUri:
          type: string
        qrCode:
          type: string
        secret:
          type: string
    User:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        id:
          type: string
        initials:
          type: string
        lastName:
          type: string
        locale:
          type: string
        memberSince:
          type: string
        phone:
          type: string
    ValidationError:
      type: object
      properties:
        field:
          type: string
          description: "JSON property path of the request, e.g. `displayName` or `lines[2].amount`."
          example: displayName
        message:
          type: string
          description: "The exact message of docs/spec/validation-rules.md, in the\
            \ caller's locale."
          example: At least 2 characters.
        rule:
          type: string
          description: "The failed rule: `required`, `format`, `length`, `range`,\
            \ or a named rule (snake_case), e.g. `gst_number`."
          example: length
      required:
      - field
      - message
      - rule
    ValidationErrors:
      type: object
      description: "422: one error per field, the most basic failing rule first."
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
      required:
      - errors
  securitySchemes:
    authSession:
      description: "northline-auth's own HttpOnly session cookie (`__Host-NL_AUTH`\
        \ in the cloud), set when a sign-in or registration completes; 12 h idle timeout.\
        \ Sign-in and registration endpoints work without it."
      in: cookie
      name: NL_AUTH
      type: apiKey
