openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "The JSON API behind the Studio's and the consumer web's sign-in, registration,\
    \ step-up and Settings › Security pages. Not for third parties: they use the OAuth\
    \ endpoints. Called cross-origin with credentials; POST and DELETE need an allow-listed\
    \ `Origin` (403 otherwise), bodies are JSON only. Guessable secrets (codes, second\
    \ factors) are rate limited per account, IP and session (429 with `retryAfterSeconds`);\
    \ validation errors are 422 in the shared format."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: northline-auth · Sign-in JSON API
  version: v1
servers:
- url: http://localhost:9000
security:
- authSession: []
paths:
  /api/auth/backup-codes:
    post:
      operationId: sessionRegenerate
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCodes"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
      tags:
      - session-controller
  /api/auth/register:
