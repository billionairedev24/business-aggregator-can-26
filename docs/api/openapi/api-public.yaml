openapi: 3.1.0
info:
  contact:
    name: Northline
    url: https://northline.ca
  description: "What the consumer web and the mobile apps call. Public reads (storefronts,\
    \ catalogue, search) need no sign-in; the customer's own endpoints go through\
    \ the consumer-bff (session cookie + CSRF header) or, from the mobile apps, with\
    \ a DPoP-bound token."
  license:
    identifier: LicenseRef-Northline
    name: Proprietary
  title: Northline api · Public & consumer
  version: v1
servers:
- url: http://localhost:8080
security:
- bffSession: []
  csrf: []
- oauth2:
  - openid
- dpop: []
  dpopProof: []
tags:
- description: "Listings, dishes and businesses of one market, in English or French"
  name: Search
paths:
  /api/v1/cart:
    get:
      operationId: cartCart
      parameters:
      - in: header
        name: X-Northline-Guest
        required: false
        schema:
          type: string
      - in: query
        name: lang
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartView"
          description: OK
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
      tags:
      - cart-controller
