components:
  schemas:
    AddItemRequest:
      type: object
      properties:
        offerId:
          type: string
          maxLength: 40
          minLength: 0
        qty:
          type: integer
          format: int32
          maximum: 99
          minimum: 1
        variantId:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - offerId
      - qty
    Address:
      type: object
      properties:
        city:
          type: string
        label:
          type: string
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        neighbourhood:
          type: string
        placeId:
          type: string
        postalCode:
          type: string
        province:
          type: string
        resolution:
          $ref: "#/components/schemas/Resolution"
        street:
          type: string
    AddressInput:
      type: object
      properties:
        addressId:
          type: string
        city:
          type: string
        note:
          type: string
        postal:
          type: string
        province:
          type: string
        street:
          type: string
        unit:
          type: string
    AddressView:
      type: object
      properties:
        city:
          type: string
        id:
          type: string
        isDefault:
          type: boolean
        note:
          type: string
        postal:
          type: string
        province:
          type: string
        street:
          type: string
        unit:
          type: string
    BookingRequest:
      type: object
      properties:
        accessNote:
          type: string
        addressLine:
          type: string
        agreePolicies:
          type: boolean
        agreeTerms:
          type: boolean
        area:
          type: string
        consult:
          $ref: "#/components/schemas/Consult"
        contactPhone:
          type: string
        contactPreference:
          type: string
        description:
          type: string
        event:
          $ref: "#/components/schemas/Event"
        flexibility:
          type: string
        holdId:
          type: string
        home:
          $ref: "#/components/schemas/Home"
        hours:
          type: number
        present:
          type: string
        serviceId:
          type: string
        spot:
          type: string
        staff:
          type: string
        unit:
          type: string
        urgency:
          type: string
        vehicle:
          $ref: "#/components/schemas/Vehicle"
    BucketResponse:
      type: object
      properties:
        count:
          type: integer
          format: int64
        label:
          type: string
        value:
          type: string
    BusinessCard:
      type: object
      properties:
        about:
          type: string
        city:
          type: string
        cuisines:
          type: array
          items:
            type: string
        displayName:
          type: string
        fulfilment:
          type: array
          items:
