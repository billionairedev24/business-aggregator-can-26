  /api/v1/search:
    get:
      description: "Only live, approved listings of active businesses in the market.\
        \ Relevance weighs the text match, trust tier, rating and, with lat/lng, nearness.\
        \ Pages with `after` = the previous page's `next`; facets on the first page."
      operationId: searchSearch
      parameters:
      - description: What was typed; blank = browse by the filters
        in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
      - description: "Province or territory code of the person's location (default:\
          \ the configured SEARCH_DEFAULT_MARKET)"
        in: query
        name: market
        required: false
        schema:
          type:
          - string
          - "null"
      - description: "en | fr — picks listings_en or listings_fr (default: Accept-Language)"
        in: query
        name: lang
        required: false
        schema:
          type:
          - string
          - "null"
      - description: "service, product, food, merchant (several allowed)"
        in: query
        name: kind
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
      - description: A category id at any level (group or leaf)
        in: query
        name: category
        required: false
        schema:
          type:
          - string
          - "null"
      - description: "Lowest price, cents"
        in: query
        name: minPrice
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
      - description: "Highest price, cents"
        in: query
        name: maxPrice
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
      - description: "Lowest average rating, 1–5"
        in: query
        name: minRating
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
      - description: "registered, trusted, master (several allowed)"
        in: query
        name: tier
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
      - description: Services that can be booked at once
        in: query
        name: instantBook
        required: false
        schema:
          type:
          - boolean
          - "null"
      - description: "Open at this minute (the market's local time), not paused, not\
          \ sold out today"
        in: query
        name: openNow
        required: false
        schema:
          type:
          - boolean
          - "null"
      - description: "tonight = on tonight's pooled run (before the seller's cut-off,\
          \ in stock)"
        in: query
        name: delivery
        required: false
        schema:
          type:
          - string
          - "null"
      - description: "Dietary tags every result has: halal, vegan, gluten_free …"
        in: query
        name: dietary
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
      - description: "Allergens no result contains (Health Canada codes: peanuts,\
          \ tree_nuts …)"
        in: query
        name: allergenFree
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
      - description: "The person's latitude (with lng): distances, nearness boost,\
          \ distance sort/filter"
        in: query
        name: lat
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
      - description: The person's longitude (with lat)
        in: query
        name: lng
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
      - description: Only results within this many km of lat/lng (1–100)
        in: query
        name: radiusKm
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
      - description: "relevance (default), distance, price_asc, price_desc, rating"
        in: query
        name: sort
        required: false
        schema:
          type:
          - string
          - "null"
      - description: "Results per page, 1–50 (default 24; suggestions 1–10, default\
          \ 6)"
        in: query
        name: size
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
      - description: The `next` token of the previous page
        in: query
        name: after
        required: false
        schema:
          type:
          - string
          - "null"
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: A page of results
        "401":
          content:
            application/problem+json:
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    detail: "Not signed in, or the token expired."
                    status: 401
                    title: "Not signed in, or the token expired."
                    type: https://northline.ca/problems/unauthorized
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not signed in, or the token expired."
        "403":
          content:
            application/problem+json:
              examples:
                forbidden:
                  value:
                    code: forbidden
                    detail: Your sign-in doesn't allow this.
                    status: 403
                    title: Your sign-in doesn't allow this.
                    type: https://northline.ca/problems/forbidden
              schema:
                $ref: "#/components/schemas/Problem"
          description: Your sign-in doesn't allow this.
        "422":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: "A parameter breaks a rule: {errors: [{field, rule, message}]}"
        "429":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Too many requests from this address (Retry-After)
      summary: Search
      tags:
      - Search
  /api/v1/search/interpret:
    post:
      description: Turns what the person typed into GET /api/v1/search parameters
        (AI-assisted; the person sees and can remove each filter). 503 ai_unavailable
        when no model is configured.
      operationId: searchInterpretInterpret
      parameters:
      - in: header
        name: Accept-Language
        required: false
        schema:
          type: string
      - in: header
        name: X-Northline-Guest
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Body"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Interpretation"
          description: OK
        "422":
          content:
            application/json:
              examples:
                length:
                  value:
                    errors:
                    - field: displayName
                      message: At least 2 characters.
                      rule: length
              schema:
                $ref: "#/components/schemas/ValidationErrors"
          description: "Validation failed: one error per field with the exact message."
      security: []
      summary: Natural-language search → filters
      tags:
      - Search
