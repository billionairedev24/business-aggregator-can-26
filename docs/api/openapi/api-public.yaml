components:
  schemas:
    ActivityResponse:
      type: object
      properties:
        action:
          type: string
          enum:
          - track
          - details
          - view_quote
          - rebook
          - view_case
          - report
        active:
          type: boolean
        amountCents:
          type: integer
          format: int64
          description: Cents of Canadian dollars (CAD).
        caseRef:
          $ref: "#/components/schemas/CaseRef"
        delivery:
          type: string
        href:
          type: string
        id:
          type: string
        items:
          type: integer
          format: int32
        kind:
          type: string
          enum:
          - order
          - food
          - booking
          - quote
        ref:
          type: string
        shops:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - packing
          - ready
          - on_the_way
          - delivered
          - paid
          - cooking
          - requested
          - booked
          - escrow
          - deposit_held
          - on_site
          - completed
          - done
          - waiting
          - quote_ready
          - declined
          - expired
          - refunded
          - cancelled
          - case
        title:
          type: string
        tone:
          type: string
        when:
          type: string
          format: date-time
        whenEnd:
          type: string
          format: date-time
        with:
          type: array
          items:
            type: string
    AddItemRequest:
      type: object
      properties:
        offerId:
          type: string
          maxLength: 40
          minLength: 0
        qty:
          type: integer
          format: int32
          maximum: 99
          minimum: 1
        variantId:
          type: string
          maxLength: 40
          minLength: 0
      required:
      - offerId
      - qty
    Address:
      type: object
      properties:
        city:
          type: string
        id:
          type: string
        isDefault:
          type: boolean
        label:
          type: string
        note:
          type: string
        postal:
          type: string
        province:
          type: string
        street:
          type: string
        unit:
          type: string
    AddressChangeRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 40
          minLength: 0
        note:
          type: string
          maxLength: 200
          minLength: 0
        unit:
          type: string
          maxLength: 20
          minLength: 0
    AddressInput:
      type: object
      properties:
        addressId:
          type: string
        city:
          type: string
        note:
          type: string
        postal:
          type: string
        province:
          type: string
        street:
          type: string
        unit:
          type: string
    AddressRequest:
      type: object
      properties:
        city:
          type: string
          maxLength: 60
          minLength: 0
        label:
          type: string
          maxLength: 40
          minLength: 0
        note:
          type: string
          maxLength: 200
          minLength: 0
        postal:
          type: string
          minLength: 1
          pattern: "^[A-Za-z]\\d[A-Za-z][ -]?\\d[A-Za-z]\\d$"
        province:
          type: string
          minLength: 1
        street:
          type: string
          maxLength: 120
          minLength: 0
        unit:
          type: string
          maxLength: 20
          minLength: 0
      required:
      - city
      - postal
      - province
      - street
    Addresses:
      type: object
      properties:
        count:
          type: integer
          format: int32
        members:
          type: integer
          format: int32
    Attachment:
      type: object
      properties:
        byteSize:
          type: integer
          format: int64
        contentType:
          type: string
        fileName:
          type: string
        id:
          type: string
    Body:
      type: object
      properties:
        hasLocation:
          type: boolean
        lang:
          type: string
        text:
          type: string
    BookingRequest:
      type: object
      properties:
        accessNote:
          type: string
        addressLine:
          type: string
        agreePolicies:
          type: boolean
        agreeTerms:
          type: boolean
        area:
          type: string
        consult:
          $ref: "#/components/schemas/Consult"
        contactPhone:
          type: string
        contactPreference:
          type: string
        description:
          type: string
        event:
          $ref: "#/components/schemas/Event"
        flexibility:
          type: string
        holdId:
          type: string
        home:
