- main:
  - heading "Checkout" [level=1]
  - text: 4 items from 2 shops, delivered together
  - region "Delivery address":
    - heading "Delivery address" [level=2]
    - button "Change"
    - radiogroup "Delivery address":
      - radio /Amara Osei \d+ \d+ Ave SW, Apt \d+ Calgary AB T2T 0B8 Buzz \d+ · leave at door/ [checked]
  - region "Delivery window":
    - heading "Delivery window" [level=2]
    - radiogroup "Delivery window":
      - radio /Tonight, 6–9 p[\d,.]+[bkmBKM]+\. Pooled run with 5 neighbours \$\d+\.\d+/ [checked]
      - radio /Tomorrow, 8–\d+ a[\d,.]+[bkmBKM]+\. Pooled run · order by 7:\d+ a[\d,.]+[bkmBKM]+\. \$\d+\.\d+/
      - radio /Within \d+ minutes Direct courier \$\d+\.\d+/
    - paragraph: /Pack by 5:\d+ p[\d,.]+[bkmBKM]+\. · the courier picks up all 2 shops in one run/
  - region "If an item is out of stock":
    - heading "If an item is out of stock" [level=2]
    - radiogroup "If an item is out of stock":
      - radio "Replace with similar" [checked]
      - radio "Refund it"
      - radio "Text me first"
  - region "Courier tip":
    - heading "Courier tip" [level=2]
    - paragraph: /\d+% goes to your courier/
    - radiogroup "Courier tip":
      - radio "No tip" [checked]
      - radio "$2"
      - radio "$3"
      - radio "$5"
      - radio "Other"
  - region "Payment":
    - heading "Payment" [level=2]
    - radiogroup "Payment":
      - radio /Test card ending in \d+ Test payments · nothing is charged/ [checked]
    - paragraph: Your card is held, not charged, until your order is delivered. Anything missing is refunded automatically.
  - region "Review items":
    - heading "Review items" [level=2]
    - heading "Sold by Bridgeland Butcher" [level=3]
    - list:
      - listitem:
        - text: /Ribeye, AAA \d+ g/
        - combobox "Quantity of Ribeye, AAA":
          - option "1" [selected]
          - option "2"
          - option "3"
          - option "4"
          - option "5"
          - option "6"
          - option "7"
          - option "8"
          - option "9"
          - option /\d+/
        - text: /\$\d+\.\d+/
    - heading "Sold by Glenmore Bakery" [level=3]
    - list:
      - listitem:
        - text: /Country sourdough, Sliced \d+ g/
        - combobox "Quantity of Country sourdough":
          - option "1"
          - option "2" [selected]
          - option "3"
          - option "4"
          - option "5"
          - option "6"
          - option "7"
          - option "8"
          - option "9"
          - option /\d+/
        - text: /\$\d+\.\d+/
      - listitem:
        - text: Baguette
        - combobox "Quantity of Baguette":
          - option "1" [selected]
          - option "2"
          - option "3"
          - option "4"
          - option "5"
          - option "6"
          - option "7"
          - option "8"
          - option "9"
          - option /\d+/
        - text: /\$\d+\.\d+/
  - complementary "Order summary":
    - button "Place your order"
    - paragraph:
      - text: By placing your order you agree to Northline’s
      - link "Terms":
        - /url: /legal/terms.html
      - text: and
      - link "Privacy notice":
        - /url: /legal/privacy.html
      - text: .
    - term: Items (4)
    - definition: /\$\d+\.\d+/
    - term: Delivery
    - definition: /\$\d+\.\d+/
    - term: GST 5%
    - definition: /\$\d+\.\d+/
    - paragraph: "Tax is worked out item by item: basic groceries are zero-rated."
    - text: /Order total \$\d+\.\d+/
    - group: Promo code or points