- main:
  - heading "Secure checkout" [level=1]
  - text: 4 items
  - list "Checkout steps":
    - listitem:
      - region "Delivery address and time":
        - heading "Delivery address and time" [level=2]
        - region "Deliver to":
          - heading "Deliver to" [level=3]
          - radiogroup "Deliver to":
            - radio /\d+ \d+ Ave SW, Apt \d+ Calgary AB T2T 0B8 · Buzz \d+ · leave at door/ [checked]:
              - strong: /\d+ \d+ Ave SW, Apt \d+/
          - button "Add a new address"
        - region "Delivery window":
          - heading "Delivery window" [level=3]
          - radiogroup "Delivery window":
            - radio /Today \d+–3 a[\d,.]+[bkmBKM]+\. Pooled with 5 neighbours \$\d+\.\d+/ [checked]:
              - strong: /Today \d+–3 a[\d,.]+[bkmBKM]+\./
            - radio /Tomorrow 2–5 p[\d,.]+[bkmBKM]+\. Pooled run · order by 1:\d+ p[\d,.]+[bkmBKM]+\. \$\d+\.\d+/:
              - strong: /Tomorrow 2–5 p[\d,.]+[bkmBKM]+\./
            - radio /Now · \d+ min Direct courier \$\d+\.\d+/:
              - strong: /Now · \d+ min/
        - region "If something’s out of stock":
          - heading "If something’s out of stock" [level=3]
          - radiogroup "If something’s out of stock":
            - radio "Similar item" [checked]
            - radio "Refund it"
            - radio "Text me"
        - region /Tip the courier · \d+% goes to them/:
          - heading /Tip the courier · \d+% goes to them/ [level=3]
          - radiogroup /Tip the courier · \d+% goes to them/:
            - radio "No tip" [checked]
            - radio /\$\d+\.\d+/
            - radio /\$\d+\.\d+/
            - radio /\d+ %/
            - radio /\$\d+\.\d+/
        - button "Continue"
    - listitem:
      - region "Payment":
        - heading "Payment" [level=2]
    - listitem:
      - region "Review items and delivery":
        - heading "Review items and delivery" [level=2]
  - complementary "Total":
    - term: Items
    - definition: /\$\d+\.\d+/
    - term: Delivery
    - definition: /\$\d+\.\d+/
    - term: GST 5%
    - definition: /\$\d+\.\d+/
    - text: /Total \$\d+\.\d+/
    - button "Place your order" [disabled]
    - paragraph: Choose the address, the time and the payment to place your order.
    - paragraph:
      - text: By placing your order you agree to Northline’s Terms and Privacy notice.
      - link "Terms":
        - /url: /legal/terms.html
      - text: ·
      - link "Privacy notice":
        - /url: /legal/privacy.html
    - paragraph: Shops are paid after you confirm delivery; anything missing is refunded automatically. Secured by Stripe.