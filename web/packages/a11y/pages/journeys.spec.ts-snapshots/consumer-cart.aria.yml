- main:
  - heading "Shopping cart" [level=1]
  - text: 4 items · 2 shops · one delivery
  - note:
    - strong: "/Pooled run: Tonight, 6–9 p[\\d,.]+[bkmBKM]+\\./"
    - text: /All 2 shops deliver together for one \$\d+\.\d+ fee\. Order by 5:\d+ p[\d,.]+[bkmBKM]+\./
  - region "Bridgeland Butcher":
    - heading "Bridgeland Butcher 1 item" [level=2]
    - list:
      - listitem:
        - link "Ribeye, AAA":
          - /url: /products/p-I1
        - text: /\d+ g In stock/
        - group "Quantity of Ribeye, AAA":
          - button "Remove Ribeye, AAA"
          - button "One more Ribeye, AAA"
        - button "Delete Ribeye, AAA"
        - button "Save Ribeye, AAA for later"
        - text: /\$\d+\.\d+/
  - region "Glenmore Bakery":
    - heading "Glenmore Bakery 3 items" [level=2]
    - list:
      - listitem:
        - link "Country sourdough":
          - /url: /products/p-I2
        - text: /Sliced · \d+ g In stock/
        - group "Quantity of Country sourdough":
          - button "One less Country sourdough"
          - button "One more Country sourdough"
        - button "Delete Country sourdough"
        - button "Save Country sourdough for later"
        - text: /\$\d+\.\d+/
      - listitem:
        - link "Baguette":
          - /url: /products/p-I3
        - text: Only 2 left
        - group "Quantity of Baguette":
          - button "Remove Baguette"
          - button "One more Baguette"
        - button "Delete Baguette"
        - button "Save Baguette for later"
        - text: /\$\d+\.\d+/
  - paragraph:
    - text: "Subtotal (4 items):"
    - strong: /\$\d+\.\d+/
  - complementary "Order summary":
    - paragraph:
      - text: "Subtotal (4 items):"
      - strong: /\$\d+\.\d+/
    - paragraph: Delivery and tax are added at checkout.
    - link "Proceed to checkout":
      - /url: /checkout
    - paragraph: Shops are paid after you confirm delivery; anything missing is refunded automatically. Secured by Stripe.