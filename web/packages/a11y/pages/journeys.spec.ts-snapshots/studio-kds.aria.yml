- main:
  - status
  - paragraph: Live orders · Pho Dau Bo
  - heading "Friday dinner · 2 open" [level=1]
  - paragraph:
    - text: "Prep time shown to customers:"
    - strong: /\d+ min/
  - button "Busy · +5 min"
  - button "Reset" [disabled]
  - button "Pause new orders"
  - region "New 1":
    - heading "New 1" [level=2]
    - list:
      - listitem /FD-\d+/:
        - strong: /FD-\d+/
        - list:
          - listitem: 1× Pho dac biet · Large, extra beef
          - listitem: 2× Spring rolls
        - text: /A\. Osei · placed 3:\d+ Deliver · courier assigned/
        - button "Accept · start cooking"
  - region "Cooking 0":
    - heading "Cooking 0" [level=2]
    - paragraph: Nothing on the stove.
  - region "Ready 1":
    - heading "Ready 1" [level=2]
    - list:
      - listitem /FD-\d+/:
        - strong: /FD-\d+/
        - list:
          - listitem: 1× Pho dac biet · Large, extra beef
          - listitem: 2× Spring rolls
        - text: /A\. Osei · placed 3:\d+ Deliver · Sam waiting/
        - button "Handed to courier"
  - paragraph: Orders print to the kitchen printer and appear here; the customer's ETA updates when you tap Accept (their app shows "cooking") and Ready (courier is dispatched to arrive as you finish). Late-ready orders beyond your prep time reduce your on-time score.