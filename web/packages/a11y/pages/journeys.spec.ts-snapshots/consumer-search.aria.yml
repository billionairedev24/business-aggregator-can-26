- main:
  - heading "1–4 of 4 results for “sourdough”" [level=1]:
    - strong: 1–4 of 4 results
    - strong: “sourdough”
  - text: Sort by
  - combobox "Sort by":
    - option "Featured" [selected]
    - 'option "Price: low to high"'
    - 'option "Price: high to low"'
    - option "Customer rating"
  - complementary "Filters":
    - region "Department":
      - heading "Department" [level=2]
      - checkbox "Shop 2"
      - checkbox "Services 1"
      - text: Services 1
      - checkbox "Food 1"
    - region "Delivery":
      - heading "Delivery" [level=2]
      - checkbox /Tonight, 6–9 p[\d,.]+[bkmBKM]+\./
      - text: /Tonight, 6–9 p[\d,.]+[bkmBKM]+\./
    - region "Customer rating":
      - heading "Customer rating" [level=2]
      - button "4 stars & up"
      - button "3 stars & up"
    - region "Distance":
      - heading "Distance" [level=2]
      - paragraph:
        - text: Set your location to sort and filter by distance.
        - button "Set location"
  - list "Results":
