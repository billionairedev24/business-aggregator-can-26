# Northline alerts (S-111; S-113 docs/runbooks/alerting.md). Prometheus rule syntax, so they load unchanged into
# Grafana Cloud / Mimir, Amazon Managed Service for Prometheus, Google Managed Prometheus (Rules / ClusterRules) and
# Azure Monitor managed Prometheus (rule groups), or a Prometheus + Alertmanager of your own; the Helm chart deploys
# them with alerting.enabled. Unit tests: prometheus/tests (make obs-rules-check → promtool test rules).
# Threshold alerts here; the SLO burn-rate alerts are generated from deploy/observability/slo into rules/slo/.
# severity: page = someone acts now (the on-call person's pager); ticket = next working day.
# runbook_url: docs/runbooks/alerts/<alert>.md — every alert has one (scripts/validate-alerts.py checks it); the chart
# swaps the GitHub base for alerting.runbookBaseUrl.
groups:
  - name: northline-http
    rules:
      - alert: NorthlineHighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application=~"northline-.*",status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count{application=~"northline-.*"}[5m])) > 0.05
          and sum by (application) (rate(http_server_requests_seconds_count{application=~"northline-.*"}[5m])) > 0.2
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.application }}: {{ $value | humanizePercentage }} of requests fail (5xx)"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/high-error-rate.md
      - alert: NorthlineSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le, application) (rate(http_server_requests_seconds_bucket{application=~"northline-.*"}[5m]))) > 2
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.application }}: p95 latency {{ $value | humanizeDuration }}"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/slow-requests.md
  - name: northline-events
    rules:
      - alert: NorthlineEventDeadLettered
        expr: sum by (consumer, topic) (increase(northline_events_dead_lettered_total[10m])) > 0
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.consumer }} dead-lettered an event from {{ $labels.topic }}"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/event-dead-lettered.md
      - alert: NorthlineConsumerLag
        expr: max by (application, client_id) (kafka_consumer_fetch_manager_records_lag_max{application="northline-worker"}) > 1000
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.client_id }} is {{ $value }} records behind"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/consumer-lag.md
      - alert: NorthlineConsumerLagCritical
        expr: max by (application, client_id) (kafka_consumer_fetch_manager_records_lag_max{application="northline-worker"}) > 10000
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.client_id }} is {{ $value }} records behind and not catching up — notifications, search and webhooks are late"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/consumer-lag.md
      # S-113: the transactional outbox (Modulith event publication registry) of the api and northline-auth. An event
      # stays incomplete until every listener, the Kafka externalizer included, handled it.
      - alert: NorthlineOutboxBacklog
        expr: max by (application) (northline_events_outbox_oldest_age_seconds) > 300
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $labels.application }}: an event has waited {{ $value | humanizeDuration }} in the outbox"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/outbox-backlog.md
      - alert: NorthlineOutboxStuck
        expr: max by (application) (northline_events_outbox_oldest_age_seconds) > 1800
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.application }}: events have not left the outbox for {{ $value | humanizeDuration }} — kitchens, couriers and partners don't hear about orders"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/outbox-backlog.md
  - name: northline-business
    rules:
      - alert: NorthlineSignInFailures
        expr: |
          sum(rate(northline_auth_sign_ins_total{outcome="failed"}[10m]))
            / sum(rate(northline_auth_sign_ins_total[10m])) > 0.5
          and sum(rate(northline_auth_sign_ins_total[10m])) > 0.05
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "Half of the sign-ins fail ({{ $value | humanizePercentage }}) — an attack or a broken factor"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/sign-in-failures.md
      - alert: NorthlineLockoutSpike
        expr: sum by (action) (increase(northline_auth_lockouts_total[15m])) > 20
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value }} rate-limit lockouts on {{ $labels.action }} in 15 minutes"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/lockout-spike.md
      # S-113: the payments job (every minute, every api replica) last succeeded too long ago — payouts, escrow
      # releases and refunds wait. Failing runs burn the payout run SLO (rules/slo/payouts.yaml); these catch a job
      # that doesn't run at all.
      - alert: NorthlinePayoutRunStalled
        expr: time() - max(northline_jobs_last_success_seconds{task="payments.payouts"}) > 1800
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: "The payout run last succeeded {{ $value | humanizeDuration }} ago"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-run.md
      - alert: NorthlinePayoutRunStalled
        expr: time() - max(northline_jobs_last_success_seconds{task="payments.payouts"}) > 7200
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "The payout run last succeeded {{ $value | humanizeDuration }} ago — today's payouts are late"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-run.md
      - alert: NorthlinePayoutRunMissing
        expr: absent(northline_jobs_last_success_seconds{task="payments.payouts"})
        for: 30m
        labels: { severity: ticket }
        annotations:
          summary: "No api replica has reported a successful payout run for 30 minutes (none running, or the run always fails)"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-run.md
      # S-107: a retention category hasn't succeeded for two days (the nightly job fails, or nothing runs it) — expired
      # personal data stays past the Privacy Policy's period. The gauge is read from privacy.retention_runs, so every
      # replica reports the same time; before a category's first success it reports the first run of any category.
      - alert: NorthlineRetentionNotRun
        expr: time() - max by (category) (northline_retention_last_success_seconds) > 172800
        for: 1h
        labels: { severity: ticket }
        annotations:
          summary: "Retention of {{ $labels.category }} last succeeded {{ $value | humanizeDuration }} ago — expired data outlives the Privacy Policy's period"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/retention-not-run.md
      - alert: NorthlineRetentionMissing
        expr: absent(northline_retention_last_success_seconds)
        for: 6h
        labels: { severity: ticket }
        annotations:
          summary: "No api replica has reported the retention jobs for 6 hours"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/retention-not-run.md
      - alert: NorthlinePayoutFailed
        expr: sum by (outcome) (increase(northline_payouts_total{outcome!="sent"}[1h])) > 0
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value }} payouts {{ $labels.outcome }} in the last hour"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-failed.md
      - alert: NorthlineKitchensLate
        expr: |
          sum(rate(northline_kds_prep_seconds_count{late="true"}[30m]))
            / sum(rate(northline_kds_prep_seconds_count[30m])) > 0.3
          and sum(rate(northline_kds_prep_seconds_count[30m])) > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: "{{ $value | humanizePercentage }} of kitchen orders are ready after the promised time"
          runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/kitchens-late.md
