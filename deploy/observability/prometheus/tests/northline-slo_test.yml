# S-113: promtool test rules for the SLO burn-rate alerts generated by Sloth from deploy/observability/slo
# (scripts/observability.sh test-rules; make obs-rules-check). Multi-window multi-burn-rate: page = 2 % of the 30-day
# budget in 1 h (14.4x, with the 5 m window confirming) or 5 % in 6 h (6x, 30 m); ticket = 10 % in 1 d (3x, 2 h) or
# 10 % in 3 d (1x, 6 h). Both severities share the alert name; `severity` routes them (alertmanager.yml).
rule_files:
- ../rules/slo/*.yaml
evaluation_interval: 1m
tests:
- name: 'sign-in: 2 % of sign-ins fail for an hour — page (and ticket)'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/totp",status="200"}
    values: 0+98x80
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/totp",status="503"}
    values: 0+2x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlineSignInAvailabilityBurn
    exp_alerts:
    - exp_labels:
        category: availability
        severity: page
        sloth_severity: page
        journey: sign-in
        owner: platform
        sloth_id: northline-sign-in-availability
        sloth_service: northline-sign-in
        sloth_slo: availability
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/sign-in-availability.md
        summary: Sign-in errors are burning the 30-day error budget (99.9 %)
        title: (page) northline-sign-in availability SLO error budget burn rate is too fast.
    - exp_labels:
        category: availability
        severity: ticket
        sloth_severity: ticket
        journey: sign-in
        owner: platform
        sloth_id: northline-sign-in-availability
        sloth_service: northline-sign-in
        sloth_slo: availability
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/sign-in-availability.md
        summary: Sign-in errors are burning the 30-day error budget (99.9 %)
        title: (ticket) northline-sign-in availability SLO error budget burn rate is too fast.
- name: 'sign-in: 0.5 % failing for 3 hours — a ticket, no page'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/totp",status="200"}
    values: 0+199x200
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/totp",status="500"}
    values: 0+1x200
  alert_rule_test:
  - eval_time: 190m
    alertname: NorthlineSignInAvailabilityBurn
    exp_alerts:
    - exp_labels:
        category: availability
        severity: ticket
        sloth_severity: ticket
        journey: sign-in
        owner: platform
        sloth_id: northline-sign-in-availability
        sloth_service: northline-sign-in
        sloth_slo: availability
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/sign-in-availability.md
        summary: Sign-in errors are burning the 30-day error budget (99.9 %)
        title: (ticket) northline-sign-in availability SLO error budget burn rate is too fast.
- name: 'sign-in: healthy (0.05 % errors, all within 1 s) — nothing'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200"}
    values: 0+1999x200
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200",le="1.0"}
    values: 0+1999x200
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200",le="+Inf"}
    values: 0+1999x200
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="500"}
    values: 0+1x200
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="500",le="1.0"}
    values: 0+1x200
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="500",le="+Inf"}
    values: 0+1x200
  alert_rule_test:
  - eval_time: 190m
    alertname: NorthlineSignInAvailabilityBurn
    exp_alerts: []
  - eval_time: 190m
    alertname: NorthlineSignInLatencyBurn
    exp_alerts: []
- name: 'sign-in: no traffic at all — nothing (0/0 is not an error)'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200"}
    values: 7x200
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200",le="1.0"}
    values: 7x200
  alert_rule_test:
  - eval_time: 190m
    alertname: NorthlineSignInAvailabilityBurn
    exp_alerts: []
  - eval_time: 190m
    alertname: NorthlineSignInLatencyBurn
    exp_alerts: []
- name: 'sign-in latency: 30 % slower than 1 s (Prometheus 3 writes le="1.0") — page'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200"}
    values: 0+10x80
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200",le="1.0"}
    values: 0+7x80
  - series: http_server_requests_seconds_bucket{application="northline-auth",method="POST",uri="/api/auth/sign-in/passkey",status="200",le="+Inf"}
    values: 0+10x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlineSignInLatencyBurn
    exp_alerts:
    - exp_labels:
        category: latency
        severity: page
        sloth_severity: page
        journey: sign-in
        owner: platform
        sloth_id: northline-sign-in-latency
        sloth_service: northline-sign-in
        sloth_slo: latency
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/sign-in-latency.md
        summary: Slow sign-ins (over 1 s) are burning the 30-day error budget (99 %)
        title: (page) northline-sign-in latency SLO error budget burn rate is too fast.
    - exp_labels:
        category: latency
        severity: ticket
        sloth_severity: ticket
        journey: sign-in
        owner: platform
        sloth_id: northline-sign-in-latency
        sloth_service: northline-sign-in
        sloth_slo: latency
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/sign-in-latency.md
        summary: Slow sign-ins (over 1 s) are burning the 30-day error budget (99 %)
        title: (ticket) northline-sign-in latency SLO error budget burn rate is too fast.
- name: 'checkout latency: 20 % over 2.5 s for an hour — page; checkout availability untouched'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-api",method="POST",uri="/api/v1/me/checkouts/{checkoutId}/place",status="201"}
    values: 0+50x80
  - series: http_server_requests_seconds_bucket{application="northline-api",method="POST",uri="/api/v1/me/checkouts/{checkoutId}/place",status="201",le="2.5"}
    values: 0+40x80
  - series: http_server_requests_seconds_bucket{application="northline-api",method="POST",uri="/api/v1/me/checkouts/{checkoutId}/place",status="201",le="+Inf"}
    values: 0+50x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlineCheckoutLatencyBurn
    exp_alerts:
    - exp_labels:
        category: latency
        severity: page
        sloth_severity: page
        journey: checkout
        owner: platform
        sloth_id: northline-checkout-latency
        sloth_service: northline-checkout
        sloth_slo: latency
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/checkout-latency.md
        summary: Slow checkouts (over 2.5 s) are burning the 30-day error budget (99 %)
        title: (page) northline-checkout latency SLO error budget burn rate is too fast.
    - exp_labels:
        category: latency
        severity: ticket
        sloth_severity: ticket
        journey: checkout
        owner: platform
        sloth_id: northline-checkout-latency
        sloth_service: northline-checkout
        sloth_slo: latency
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/checkout-latency.md
        summary: Slow checkouts (over 2.5 s) are burning the 30-day error budget (99 %)
        title: (ticket) northline-checkout latency SLO error budget burn rate is too fast.
  - eval_time: 70m
    alertname: NorthlineCheckoutAvailabilityBurn
    exp_alerts: []
- name: 'checkout: Stripe down, every place call answers 502 — page within minutes'
  interval: 1m
  input_series:
  - series: http_server_requests_seconds_count{application="northline-api",method="POST",uri="/api/v1/me/checkouts",status="502"}
    values: 0+20x20
  - series: http_server_requests_seconds_count{application="northline-api",method="POST",uri="/api/v1/me/bookings/checkout",status="201"}
    values: 0+20x20
  alert_rule_test:
  - eval_time: 10m
    alertname: NorthlineCheckoutAvailabilityBurn
    exp_alerts:
    - exp_labels:
        category: availability
        severity: page
        sloth_severity: page
        journey: checkout
        owner: platform
        sloth_id: northline-checkout-availability
        sloth_service: northline-checkout
        sloth_slo: availability
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/checkout-availability.md
        summary: Checkout errors are burning the 30-day error budget (99.9 %)
        title: (page) northline-checkout availability SLO error budget burn rate is too fast.
    - exp_labels:
        category: availability
        severity: ticket
        sloth_severity: ticket
        journey: checkout
        owner: platform
        sloth_id: northline-checkout-availability
        sloth_service: northline-checkout
        sloth_slo: availability
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/checkout-availability.md
        summary: Checkout errors are burning the 30-day error budget (99.9 %)
        title: (ticket) northline-checkout availability SLO error budget burn rate is too fast.
- name: 'payouts: every payout run fails for 20 minutes — page'
  interval: 1m
  input_series:
  - series: northline_jobs_runs_total{application="northline-api",task="payments.payouts",outcome="succeeded"}
    values: 0+1x10 10x20
  - series: northline_jobs_runs_total{application="northline-api",task="payments.payouts",outcome="failed"}
    values: 0x10 0+1x20
  alert_rule_test:
  - eval_time: 8m
    alertname: NorthlinePayoutRunFailureBurn
    exp_alerts: []
  - eval_time: 30m
    alertname: NorthlinePayoutRunFailureBurn
    exp_alerts:
    - exp_labels:
        category: availability
        severity: page
        sloth_severity: page
        journey: payouts
        owner: platform
        sloth_id: northline-payouts-run-success
        sloth_service: northline-payouts
        sloth_slo: run-success
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-run.md
        summary: Failing payout runs are burning the 30-day error budget (99 %)
        title: (page) northline-payouts run-success SLO error budget burn rate is too fast.
    - exp_labels:
        category: availability
        severity: ticket
        sloth_severity: ticket
        journey: payouts
        owner: platform
        sloth_id: northline-payouts-run-success
        sloth_service: northline-payouts
        sloth_slo: run-success
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-run.md
        summary: Failing payout runs are burning the 30-day error budget (99 %)
        title: (ticket) northline-payouts run-success SLO error budget burn rate is too fast.
- name: 'payouts: half the scheduled payouts go out over 1 h late (le="3600.0") — page'
  interval: 1m
  input_series:
  - series: northline_payouts_delay_seconds_count{application="northline-api",kind="scheduled"}
    values: 0+2x80
  - series: northline_payouts_delay_seconds_bucket{application="northline-api",kind="scheduled",le="3600.0"}
    values: 0+1x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlinePayoutTimelinessBurn
    exp_alerts:
    - exp_labels:
        category: freshness
        severity: page
        sloth_severity: page
        journey: payouts
        owner: platform
        sloth_id: northline-payouts-timeliness
        sloth_service: northline-payouts
        sloth_slo: timeliness
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-timeliness.md
        summary: Late scheduled payouts are burning the 30-day error budget (99 %)
        title: (page) northline-payouts timeliness SLO error budget burn rate is too fast.
    - exp_labels:
        category: freshness
        severity: ticket
        sloth_severity: ticket
        journey: payouts
        owner: platform
        sloth_id: northline-payouts-timeliness
        sloth_service: northline-payouts
        sloth_slo: timeliness
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/payout-timeliness.md
        summary: Late scheduled payouts are burning the 30-day error budget (99 %)
        title: (ticket) northline-payouts timeliness SLO error budget burn rate is too fast.
- name: 'payouts: no scheduled payout today — no data, no alert'
  interval: 1m
  input_series:
  - series: northline_payouts_delay_seconds_count{application="northline-api",kind="scheduled"}
    values: 5x80
  - series: northline_payouts_delay_seconds_bucket{application="northline-api",kind="scheduled",le="3600"}
    values: 5x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlinePayoutTimelinessBurn
    exp_alerts: []
- name: 'KDS: food orders reach the kitchen bus late (outbox stuck) — page'
  interval: 1m
  input_series:
  - series: northline_kds_ticket_delivery_seconds_count{application="northline-api"}
    values: 0+10x80
  - series: northline_kds_ticket_delivery_seconds_bucket{application="northline-api",le="5.0"}
    values: 0+8x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlineKdsTicketDeliveryBurn
    exp_alerts:
    - exp_labels:
        category: latency
        severity: page
        sloth_severity: page
        journey: kds
        owner: platform
        sloth_id: northline-kds-ticket-delivery
        sloth_service: northline-kds
        sloth_slo: ticket-delivery
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/kds-ticket-delivery.md
        summary: Food orders reach kitchens late (over 5 s), burning the 30-day error budget (99.5 %)
        title: (page) northline-kds ticket-delivery SLO error budget burn rate is too fast.
    - exp_labels:
        category: latency
        severity: ticket
        sloth_severity: ticket
        journey: kds
        owner: platform
        sloth_id: northline-kds-ticket-delivery
        sloth_service: northline-kds
        sloth_slo: ticket-delivery
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/kds-ticket-delivery.md
        summary: Food orders reach kitchens late (over 5 s), burning the 30-day error budget (99.5 %)
        title: (ticket) northline-kds ticket-delivery SLO error budget burn rate is too fast.
- name: 'KDS: the live bus drops every probe of one replica out of two — page'
  interval: 1m
  input_series:
  - series: northline_studio_live_probe_seconds_count{application="northline-api",outcome="delivered"}
    values: 0+2x80
  - series: northline_studio_live_probe_seconds_bucket{application="northline-api",outcome="delivered",le="2"}
    values: 0+2x80
  - series: northline_studio_live_probe_seconds_count{application="northline-api",outcome="lost"}
    values: 0+2x80
  - series: northline_studio_live_probe_seconds_bucket{application="northline-api",outcome="lost",le="+Inf"}
    values: 0+2x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlineKdsFreshnessBurn
    exp_alerts:
    - exp_labels:
        category: freshness
        severity: page
        sloth_severity: page
        journey: kds
        owner: platform
        sloth_id: northline-kds-freshness
        sloth_service: northline-kds
        sloth_slo: freshness
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/kds-freshness.md
        summary: The kitchen displays' live bus is slow or dropping signals, burning the 30-day error budget (99.5 %)
        title: (page) northline-kds freshness SLO error budget burn rate is too fast.
    - exp_labels:
        category: freshness
        severity: ticket
        sloth_severity: ticket
        journey: kds
        owner: platform
        sloth_id: northline-kds-freshness
        sloth_service: northline-kds
        sloth_slo: freshness
      exp_annotations:
        runbook_url: https://github.com/billionairedev24/business-aggregator-can-26/blob/main/docs/runbooks/alerts/kds-freshness.md
        summary: The kitchen displays' live bus is slow or dropping signals, burning the 30-day error budget (99.5 %)
        title: (ticket) northline-kds freshness SLO error budget burn rate is too fast.
- name: 'KDS: every probe back within 2 s — nothing'
  interval: 1m
  input_series:
  - series: northline_studio_live_probe_seconds_count{application="northline-api",outcome="delivered"}
    values: 0+4x80
  - series: northline_studio_live_probe_seconds_bucket{application="northline-api",outcome="delivered",le="2.0"}
    values: 0+4x80
  alert_rule_test:
  - eval_time: 70m
    alertname: NorthlineKdsFreshnessBurn
    exp_alerts: []
