# Local Tempo (docker compose --profile observability): traces arrive over OTLP gRPC from the Collector
# (tempo:4317). Query API and TraceQL on :3200 inside the network, host port TEMPO_PORT (default 3210: 3200 is the
# console's). Single binary, local blocks in the container's tmpfs (no data is kept), no usage reporting.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 48h
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
usage_report:
  reporting_enabled: false
