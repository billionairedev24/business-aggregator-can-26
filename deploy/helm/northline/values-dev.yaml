# dev — shared cloud development environment (docs/runbooks/dev.md). Smallest footprint: one replica each, no HPA.
# Layer a cloud overlay (values-aws.yaml | values-gcp.yaml | values-azure.yaml) and the Terraform-generated values
# (config_env, workload identities) on top — docs/runbooks/deploy.md.
global:
  environment: dev

urls:
  auth: https://auth.dev.northline.ca
  api: https://api.dev.northline.ca
  studio: https://studio.dev.northline.ca
  consumer: https://dev.northline.ca
  console: https://console.dev.northline.ca
  pages: https://pages.dev.northline.ca
  docs: https://docs.dev.northline.ca                   # S-126: the public documentation site
  docsInternal: https://internal-docs.dev.northline.ca   # S-126: with apps.docs-internal + edge.docsInternal.allowedCIDRs
  webauthnRpId: dev.northline.ca

# S-17: Gateway API with the chart's Gateway (Envoy Gateway), Let's Encrypt certificates per host over HTTP-01,
# records published by external-dns in the dev.northline.ca zone (docs/runbooks/edge.md).
gateway:
  enabled: true
edge:
  enabled: true
  # S-31: the api verifies merchants' domains and reconciles them onto the edge (docs/runbooks/custom-domains.md);
  # merchants' certificates from Let's Encrypt STAGING (untrusted by browsers, on purpose).
  domainReconciler:
    enabled: true

apps:
  api:
    docsRoutes: true            # S-125: Swagger UI, Scalar, Redoc and the specs on the api host
  auth:
    env:
      # One replica may keep the signing keys in a file (KMS_PROVIDER=local) — set KMS_PROVIDER from Terraform instead.
      OAUTH_CLIENTS_SYNC_ON_STARTUP: "true"

# S-111 (docs/runbooks/observability.md): every trace kept; the Collector's exporters come from the cloud overlay.
observability:
  tracesSampleRatio: "1.0"
  collector:
    enabled: true
