# AWS (EKS) overlay. Only values: the templates have no cloud logic.
#
# Workload identity: IRSA (what Terraform sets up) — the ServiceAccounts carry eks.amazonaws.com/role-arn from
#   terraform output -json kubernetes | jq '{workloadIdentities: .workload_identities}' > identities.json
# EKS Pod Identity instead: no annotation; create a pod identity association per ServiceAccount (northline-api, …).
#
# Images: <account>.dkr.ecr.<region>.amazonaws.com/northline (terraform output registry.registry_url + /northline);
# the node role may pull (registry readers), so no imagePullSecrets.
#
# Ingress (S-17 decides): AWS Load Balancer Controller → ingress.className: alb with
#   alb.ingress.kubernetes.io/scheme: internet-facing, alb.ingress.kubernetes.io/target-type: ip, one group.name;
# or ingress-nginx behind an NLB → className: nginx.

env:
  # The AWS SDKs (KMS, S3, End User Messaging) take the region from here when the identity webhook doesn't set it.
  AWS_REGION: ca-central-1

networkPolicy:
  # VPC CNI enforces NetworkPolicy when its network policy agent is enabled (enableNetworkPolicy=true).
  enabled: true

# S-6: secrets from AWS Secrets Manager (northline/<env>/<name>) through External Secrets, authenticated as the ESO
# controller's IRSA role (Terraform: workload identity "external-secrets", read on northline/<env>/*).
externalSecrets:
  enabled: true
  provider: aws
  aws:
    region: ca-central-1
  remoteKeyPrefix: "northline/{env}/"

apps:
  api:
    env:
      # S-13 (docs/runbooks/email.md): Amazon SES API v2 in the Canadian region, credentials from workload identity.
      EMAIL_PROVIDER: ses
      EMAIL_REGION: ca-central-1
  worker:
    env:
      # S-27: the notifications consumer emails payout.failed with the same provider as the api.
      EMAIL_PROVIDER: ses
      EMAIL_REGION: ca-central-1

# S-111 (docs/runbooks/observability.md § AWS): traces → AWS X-Ray, metrics → CloudWatch (embedded metric format,
# namespace Northline), logs → CloudWatch Logs, all in ca-central-1, as the Collector's IRSA role (Terraform:
# workload identity otel-collector with AWSXrayWriteOnlyAccess + CloudWatchAgentServerPolicy). Prefer Amazon Managed
# Grafana / Prometheus or Grafana Cloud instead? Replace the exporters with otlphttp (test-values/observability-otlp.yaml).
observability:
  collector:
    env:
      AWS_REGION: ca-central-1
    exporters:
      awsxray:
        region: ca-central-1
      awsemf:
        region: ca-central-1
        namespace: Northline
        log_group_name: "/northline/${env:NORTHLINE_ENVIRONMENT}/metrics"
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion: { enabled: true }
      awscloudwatchlogs:
        region: ca-central-1
        log_group_name: "/northline/${env:NORTHLINE_ENVIRONMENT}/apps"
        log_stream_name: otel
    pipelines:
      traces: [awsxray]
      metrics: [awsemf]
      logs: [awscloudwatchlogs]
