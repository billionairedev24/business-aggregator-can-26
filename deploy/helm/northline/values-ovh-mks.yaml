# ovh-mks — OVHcloud Managed Kubernetes (free control plane) in the Public Cloud region of Terraform's ovh_location
# (S-160: US-EAST-VA-1 by default, US-WEST-OR-1 or BHS5; global.hostingCountry from Terraform — outside Canada the chart
# refuses staging/prod), two nodes (docs/runbooks/ovh.md, DECISIONS 2026-10-19). Production-shaped: Postgres at OVHcloud Managed PostgreSQL (or in the
# cluster, Terraform variable postgres_mode), Valkey, Meilisearch and Kafka in the cluster (deploy/helm/northline-data),
# a public OVHcloud load balancer in front of Envoy Gateway. Still the `dev` profile of the dry run (values-dryrun.yaml):
# KMS_PROVIDER=local has no OVHcloud key service behind it, which staging/prod refuse. Layer after values-dryrun.yaml
# and before Terraform's values (scripts/ovh/deploy.sh does this):
#
#   helm upgrade --install northline deploy/helm/northline -n northline-dryrun \
#     -f deploy/helm/northline/values-dryrun.yaml -f deploy/helm/northline/values-ovh-mks.yaml \
#     -f ovh-mks-values.json \          # terraform output -json helm_values (infra/terraform/envs/ovh/mks)
#     --set global.image.registry=$REGISTRY --set global.image.tag=$IMAGE_TAG --wait --timeout 20m
#
# Secrets, keys, object storage: as values-ovh-vps.yaml (one plain Secret written by scripts/ovh/secrets.sh from
# .ovh/ovh-mks.env; signing keys on a Cinder volume; OVHcloud Object Storage over S3).
global:
  imagePullSecrets:
    - name: northline-registry    # written by scripts/ovh/secrets.sh when REGISTRY_* are set; else unused

externalSecrets:
  enabled: false
secrets:
  existingSecret: northline-secrets

networkPolicy:
  enabled: true                   # MKS enforces NetworkPolicy (its CNI)

# Two nodes: two replicas of everything stateless, so a node can be replaced without an outage. northline-auth stays at
# one (its signing key file lives on a ReadWriteOnce volume) and the worker at one (its jobs are singletons anyway).
apps:
  api:
    replicas: 2
    secretEnv:
      STORAGE_ACCESS_KEY: true      # OVHcloud Object Storage user (Terraform output s3_credentials, via secrets.sh)
      STORAGE_SECRET_KEY: true
      KMS_LOCAL_KEY: true           # seals stored secrets (calendar tokens) — base64 of 32 bytes, generated by secrets.sh
  auth:
    replicas: 1
    env:
      SIGNING_KEYS_DIR: /var/lib/northline/auth-keys   # KMS_PROVIDER=local: the JWK set file
    extraVolumes:
      - name: signing-keys
        persistentVolumeClaim:
          claimName: northline-auth-signing-keys       # deploy/helm/northline-data authSigningKeys
    extraVolumeMounts:
      - name: signing-keys
        mountPath: /var/lib/northline/auth-keys
    # A Cinder volume attaches to one node at a time: the old pod must go before the new one starts (≈ 30–60 s of
    # sign-in downtime per auth upgrade).
    strategy:
      type: Recreate
  bff:
    replicas: 2
  consumer-bff:
    replicas: 2
  console-bff:
    replicas: 2
  studio:
    replicas: 2
  consumer:
    replicas: 2
  console:
    replicas: 2

observability:
  collector:
    pipelines:
      traces: [debug]
      metrics: [debug]
      logs: [debug]
