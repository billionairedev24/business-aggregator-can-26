# Northline Helm chart — defaults (cloud-neutral). Layer the files, later wins:
#
#   helm upgrade --install northline deploy/helm/northline -n northline-<env> \
#     -f deploy/helm/northline/values-<env>.yaml -f deploy/helm/northline/values-<cloud>.yaml \
#     -f infra-values.json \                      # Terraform config_env + workload identities (docs/runbooks/deploy.md)
#     --set global.image.registry=$REGISTRY --set global.image.tag=$IMAGE_TAG --wait
#
# Every resource is named northline-<app> (fixed, not the release name): the ServiceAccount names are the ones
# Terraform binds to cloud identities (infra/terraform/README.md § Workload identities). One release per namespace.

global:
  # dev | staging | prod | local. Selects the Spring profile unless global.springProfiles is set.
  environment: dev
  # SPRING_PROFILES_ACTIVE for api, auth, bff, worker. Empty = global.environment.
  springProfiles: ""
  image:
    # <registry>/<repository>:<tag>. The registry includes any path: 123456789012.dkr.ecr.ca-central-1.amazonaws.com/northline,
    # northamerica-northeast1-docker.pkg.dev/<project>/northline, <acr>.azurecr.io/northline, ghcr.io/<org>/northline.
    registry: northline
    # The git sha the images were built from (IMAGE_TAG). Empty = Chart.appVersion.
    tag: ""
    pullPolicy: IfNotPresent
    # Refuse to render an enabled app without apps.<app>.image.digest (S-15: GitOps environments pin every image by
    # digest in deploy/argocd/envs/<env>/images.yaml; a tag alone can be moved).
    requireDigest: false
  imagePullSecrets: []           # [{ name: regcred }] — not needed when the nodes' identity may pull (ECR/AR/ACR)
  # Extra labels on every pod and annotations on every pod (e.g. a cost-centre label).
  podLabels: {}
  podAnnotations: {}

# Public URLs (hosts decided in S-17, docs/runbooks/edge.md). They become AUTH_ISSUER, STUDIO_ORIGIN, CONSUMER_ORIGIN, CONSOLE_ORIGIN,
# API_PUBLIC_URL, WEBAUTHN_RP_ID, the Studio's NL_AUTH_ORIGIN and the ingress hosts.
urls:
  auth: https://auth.dev.northline.ca
  # The api's public host serves the routes that must bypass the BFF: Stripe webhooks (S-12,
  # /api/v1/webhooks/stripe[/connect]), calendar change notifications (S-32, /api/v1/webhooks/calendar/…), the email unsubscribe page (S-13, /api/v1/email/unsubscribe) and — with
  # apps.api.tokenClients (S-29) — /api/v1 for the mobile apps (DPoP-bound tokens, no BFF).
  api: https://api.dev.northline.ca
  studio: https://studio.dev.northline.ca
  consumer: https://dev.northline.ca
  console: https://console.dev.northline.ca
  # Storefronts (the consumer app); merchants point their own domains here with a CNAME (edge.customDomains, S-31).
  pages: https://pages.dev.northline.ca
  # S-126: the documentation site — docs (public variant, every environment) and docs-internal (runbooks,
  # decisions, every spec; only behind edge.docsInternal.allowedCIDRs). Empty = no route.
  docs: https://docs.dev.northline.ca
  docsInternal: https://internal-docs.dev.northline.ca
  # Registrable domain shared by the Studio and consumer origins (passkeys). Changing it invalidates every passkey.
  webauthnRpId: dev.northline.ca

# S-97: the native apps that may open the consumer site's links (App Links / Universal Links) and use its passkeys —
# the consumer web serves /.well-known/apple-app-site-association and /.well-known/assetlinks.json from these
# (web/apps/consumer/server/app-links.mjs; docs/runbooks/mobile.md § App Links). Ids are the build variant this
# environment's apps use (development → dev, preview → staging, production → prod). Empty team id / no certificate
# fingerprint = that file answers 404 (the apps then fall back to their custom scheme).
mobileApps:
  appleTeamId: ""                  # Apple Developer team id (10 characters), not a secret
  iosBundleIds: [ ca.northline.app, ca.northline.courier ]
  androidPackages: [ ca.northline.app, ca.northline.courier ]
  androidCertSha256: []            # SHA-256 of the Play app-signing certificate(s), AA:BB:… (Play Console › App integrity)

# Non-secret values from Terraform (`terraform output -json config_env`, infra/terraform) → ConfigMap northline-infra,
# loaded by api, auth, bff and worker. Pass them as a values file:
#   terraform output -json config_env | jq '{configEnv: .}' > infra-values.json
# or leave empty and point existingInfraConfigMap at a ConfigMap you manage.
configEnv: {}
existingInfraConfigMap: ""

# Non-secret variables for every Spring app (api, auth, bff, worker); apps.<app>.env wins over these.
# S-111: OTEL_EXPORT_ENABLED, OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_RESOURCE_ATTRIBUTES and OTEL_TRACES_SAMPLER_ARG come
# from `observability` below; set them here only to send somewhere other than the chart's Collector.
env: {}

# S-111 (docs/runbooks/observability.md): traces, metrics and logs leave every Spring app over OTLP to one
# OpenTelemetry Collector per environment (templates/otel-collector.yaml), which scrubs them (S-112) and forwards them
# to whatever backend the environment uses — any OTLP backend (Grafana Cloud, Honeycomb, Elastic, a self-hosted
# LGTM), AWS X-Ray + CloudWatch, Google Cloud Operations or Azure Monitor. Only the exporters change per environment
# and cloud (values-<cloud>.yaml); the apps always speak OTLP to the Collector.
observability:
  # Share of traces kept, the same for every app (ConsistentSampling: one decision per trace id) → OTEL_TRACES_SAMPLER_ARG.
  tracesSampleRatio: "1.0"
  collector:
    enabled: false
    image:
      repository: otel/opentelemetry-collector-contrib   # contrib: the X-Ray, CloudWatch, Google Cloud and Azure Monitor
      tag: "0.161.0"                                     # exporters and the redaction/transform processors. ADOT
      # (public.ecr.aws/aws-observability/aws-otel-collector) works too. Multi-arch index, 2026-09-16.
      digest: "sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1"
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
    # memory_limiter: refuse data (the apps retry, then drop) before the pod is OOM-killed.
    memoryLimitMiB: 400
    # Exporters, in the Collector's own configuration syntax (https://opentelemetry.io/docs/collector/configuration/),
    # and which pipeline uses which. ${env:VAR} reads the Collector's environment (env / secretEnv below). The default
    # only prints a summary to the Collector's log — pick a backend per environment/cloud.
    exporters:
      debug: { verbosity: basic }
    pipelines:
      traces: [debug]
      metrics: [debug]
      logs: [debug]
    # Extra processors (Collector syntax) run after the chart's own (memory limit, resource, scrub) and before batch,
    # e.g. tail sampling. List their names in extraProcessorsIn.<signal>.
    extraProcessors: {}
    extraProcessorsIn: { traces: [], metrics: [], logs: [] }
    env: {}
    # Secret variables of the Collector (same rules as apps.<app>.secretEnv: true = required).
    secretEnv: {}
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# S-113 alerting and on-call (docs/runbooks/alerting.md): the alert rules — threshold alerts and the SLO burn-rate
# alerts generated from deploy/observability/slo (files/alerting, kept identical by make obs-rules-check) — and the
# severity routing (page → the on-call pager, ticket → the team's queue), for the Prometheus-compatible store that
# holds the metrics (the Collector's backend). Off by default: nothing in the cluster reads these kinds until a
# Prometheus Operator (kube-prometheus-stack), Google Managed Prometheus or another rule loader is there.
alerting:
  enabled: false
  # Where the alerts' runbook_url points: docs/runbooks/alerts/<alert>.md under this base. Empty = the GitHub
  # repository (main); the internal docs site (S-126) works too, e.g. https://docs-internal.<zone>/runbooks/alerts.
  runbookBaseUrl: ""
  rules:
    # prometheusRule = monitoring.coreos.com/v1 PrometheusRule (Prometheus Operator / kube-prometheus-stack on any
    # cluster; Grafana Alloy and the Mimir/Grafana Cloud operators read it too) · gmpRules = monitoring.googleapis.com/v1
    # Rules (Google Managed Prometheus) · configMap = the plain rule files in a ConfigMap, for a Prometheus, Mimir
    # (mimirtool rules load), Amazon Managed Prometheus (create-rule-groups-namespace) or Azure Monitor managed Prometheus
    # (az-prom-rules-converter) that loads files.
    format: prometheusRule
    interval: 1m                     # gmpRules: how often each group is evaluated (GMP requires it)
    # Labels on the rule objects, e.g. { release: kube-prometheus-stack } for the operator's ruleSelector.
    labels: {}
    # Labels added to every alert, next to namespace (the release's) and environment (global.environment).
    extraAlertLabels: {}
  routing:
    # alertmanagerConfig = monitoring.coreos.com/v1alpha1 AlertmanagerConfig (Prometheus Operator; keys from the
    # northline-alerting Secret) · configMap = an alertmanager.yml in a ConfigMap whose credentials are files under
    # credentialsDir (mount the Secret there) · none = route in the backend's own alerting (Grafana alerting, …).
    format: alertmanagerConfig
    labels: {}                       # e.g. { alertmanagerConfig: northline } for the Alertmanager's selector
    credentialsDir: /etc/alertmanager/secrets/northline-alerting
    groupBy: [alertname, severity, sloth_service, sloth_slo, application]
    # page: pages the person on call now; ticket: the next working day. provider: pagerduty | opsgenie | webhook | none.
    # Secrets (externalSecrets.secretNames / secrets.existingSecret): ALERTING_PAGERDUTY_ROUTING_KEY (PagerDuty Events
    # API v2 integration key), ALERTING_OPSGENIE_API_KEY (an Opsgenie API integration key), ALERTING_PAGE_WEBHOOK_URL /
    # ALERTING_TICKET_WEBHOOK_URL (any receiver of Alertmanager's webhook JSON: Grafana OnCall, a chat bridge, a
    # ticketing bridge). Only the selected providers' keys are required.
    page:
      provider: none
      repeatInterval: 1h
    ticket:
      provider: none
      repeatInterval: 24h
    pagerduty:
      url: https://events.pagerduty.com/v2/enqueue
    opsgenie:
      apiUrl: https://api.opsgenie.com/   # https://api.eu.opsgenie.com/ for an EU account

# Volumes added to every Spring app and its Jobs (e.g. a CA certificate to trust — values-gcp.yaml).
spring:
  extraVolumes: []
  extraVolumeMounts: []

# Secrets without External Secrets: one plain Kubernetes Secret referenced key by key (each app gets only the keys
# listed in its secretEnv). Create it before installing (kubectl create secret generic northline-secrets
# --from-env-file=…). With externalSecrets.enabled (S-6, the default of every cloud overlay) this is not used.
secrets:
  # Secret that holds every secret variable (keys = variable names).
  existingSecret: northline-secrets
  # Local clusters only (values-local-kind.yaml): render the Secret from `values`. Never in a real environment:
  # values files are not a place for secrets.
  create: false
  values: {}

# External Secrets Operator (S-6, docs/runbooks/secrets.md): the apps' secrets come from AWS Secrets Manager, Google
# Secret Manager or Azure Key Vault, written by ESO into one Secret per app (northline-<app>-secrets) holding only that
# app's variables. ESO itself is installed once per cluster (namespace external-secrets) with the workload identity
# Terraform created for it; the store below authenticates as the ESO controller — no static keys anywhere.
# The Terraform env roots output all of this: `terraform output -json helm_values`.
externalSecrets:
  enabled: false
  provider: ""                    # aws | gcp | azure | fake (fake: kind only)
  refreshInterval: 1h             # how often ESO re-reads the secrets manager (rotation: docs/runbooks/secrets.md)
  store:
    create: true
    kind: SecretStore             # or ClusterSecretStore (then create it once, outside the release)
    name: northline
  aws:
    region: ca-central-1
    auth: {}                      # empty = the ESO controller's identity (IRSA / EKS Pod Identity)
  gcp:
    projectID: ""
    auth: {}                      # empty = the controller's GKE Workload Identity
  azure:
    vaultUrl: ""                  # https://nl-<env>-sec-….vault.azure.net/
    tenantId: ""
    serviceAccountRef: {}         # empty = the controller's Azure Workload Identity
  fake:
    data: {}                      # remote key → value (kind only)
  # Remote key of each variable: remoteKeys.<VAR> (Terraform secret_env) or remoteKeyPrefix + secretNames.<VAR>.
  # Prefixes: AWS "northline/{env}/", Google Cloud "northline-{env}-", Azure "" (one vault per environment).
  remoteKeys: {}
  remoteKeyPrefix: ""
  secretNames:
    DB_PASSWORD: db-app-password
    REDIS_PASSWORD: redis-password
    KAFKA_SASL_JAAS_CONFIG: kafka-sasl-jaas-config
    ES_PASSWORD: es-password
    TOTP_KEY: totp-key
    WEBHOOK_SECRET_KEY: webhook-secret-key
    STUDIO_BFF_SECRET: studio-bff-secret
    STUDIO_BFF_SECRET_HASH: studio-bff-secret-hash
    CONSUMER_BFF_SECRET: consumer-bff-secret              # S-45: the consumer-bff's client secret (plain)
    CONSUMER_BFF_SECRET_HASH: consumer-bff-secret-hash
    CONSOLE_BFF_SECRET: console-bff-secret                # S-90: the console-bff's client secret (plain)
    CONSOLE_BFF_SECRET_HASH: console-bff-secret-hash
    STRIPE_SECRET_KEY: stripe-secret-key
    STRIPE_PUBLISHABLE_KEY: stripe-publishable-key
    STRIPE_WEBHOOK_SECRET: stripe-webhook-secret
    STRIPE_CONNECT_WEBHOOK_SECRET: stripe-connect-webhook-secret
    GOOGLE_CLIENT_SECRET: google-client-secret
    APPLE_PRIVATE_KEY: apple-private-key       # S-18: the Sign in with Apple .p8 key (PEM); auth makes the client secret
    SMS_AUTH_TOKEN: sms-auth-token
    EMAIL_UNSUBSCRIBE_KEY: email-unsubscribe-key
    EMAIL_API_KEY: email-api-key
    SMTP_PASSWORD: smtp-password
    GOOGLE_CALENDAR_CLIENT_SECRET: google-calendar-client-secret        # S-32 calendar sync (api)
    MICROSOFT_CALENDAR_CLIENT_SECRET: microsoft-calendar-client-secret  # S-32 calendar sync (api)
    SHOPIFY_CLIENT_SECRET: shopify-client-secret                      # S-35 catalogue sync (api); also signs webhooks
    SQUARE_CLIENT_SECRET: square-client-secret                        # S-35 catalogue sync (api)
    SQUARE_WEBHOOK_SIGNATURE_KEY: square-webhook-signature-key        # S-35 Square webhook subscription key (api)
    LIGHTSPEED_CLIENT_SECRET: lightspeed-client-secret                # S-35 catalogue sync (api); also signs webhooks
    CLOVER_CLIENT_SECRET: clover-client-secret                        # S-36 POS menu import (api)
    TOAST_CLIENT_SECRET: toast-client-secret                          # S-36 POS menu import (api), Toast partner credentials
    GOOGLE_MAPS_API_KEY: google-maps-api-key                          # S-47 address autocomplete / reverse geocoding (api)
    OTEL_BACKEND_AUTH: otel-backend-auth                              # S-111: the OTLP backend's credentials (Collector)
    APPLICATIONINSIGHTS_CONNECTION_STRING: applicationinsights-connection-string  # S-111: Azure Monitor (Collector)
    OPENROUTER_API_KEY: openrouter-api-key                            # S-129 AI platform (api)
    CONSOLE_HEALTH_PROMETHEUS_TOKEN: console-health-prometheus-token  # S-91 console overview health (api), optional
    PUSH_APNS_KEY: push-apns-key                                      # S-102 push (worker): the APNs .p8 key (PEM)
    PUSH_FCM_SERVICE_ACCOUNT: push-fcm-service-account                # S-102 push (worker): Firebase service account JSON
    ONCALL_EXPORT_TOKEN: oncall-export-token                          # S-113 on-call rota export (api), optional
    GO_LIVE_PROMETHEUS_TOKEN: go-live-prometheus-token                # S-118 go-live alert gates (api), optional
    ALERTING_PAGERDUTY_ROUTING_KEY: alerting-pagerduty-routing-key    # S-113 alert routing (Alertmanager)
    ALERTING_OPSGENIE_API_KEY: alerting-opsgenie-api-key              # S-113 alert routing (Alertmanager)
    ALERTING_PAGE_WEBHOOK_URL: alerting-page-webhook-url              # S-113 alert routing (Alertmanager)
    ALERTING_TICKET_WEBHOOK_URL: alerting-ticket-webhook-url          # S-113 alert routing (Alertmanager)
  # Optional variables (secretEnv: false) to map as well. List only those that hold a value in the secrets manager:
  # one empty or missing remote secret fails the app's whole ExternalSecret. Required variables are always mapped.
  optionalKeys: [REDIS_PASSWORD, KAFKA_SASL_JAAS_CONFIG, ES_PASSWORD]

# Workload identity per app, in the shape Terraform outputs it
# (`terraform output -json kubernetes | jq '{workloadIdentities: .workload_identities}'`):
#   workloadIdentities.api.service_account_annotations → the ServiceAccount (eks.amazonaws.com/role-arn,
#   iam.gke.io/gcp-service-account, azure.workload.identity/client-id); .pod_labels → the pods
#   (azure.workload.identity/use: "true"). Keys are the app names: api, auth, bff, worker.
workloadIdentities: {}

# Pod security for every app (the images run as non-root; each app sets its uid).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities: { drop: [ALL] }

# Spread replicas over zones and nodes when there are several (soft: never blocks scheduling).
topologySpread: true

# Routes, two ways. The default in dev/staging/prod is Gateway API with the chart's own Gateway (edge.gateway, S-17);
# the Ingress stays for clusters whose controller is Ingress-only (AWS Load Balancer Controller, GKE Ingress, AKS
# application routing). docs/runbooks/edge.md
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Empty with edge.enabled + edge.certManager.enabled = one entry per host with the Secret its Certificate writes.
  tls: []

# Gateway API: HTTPRoutes attached to the chart's Gateway (edge.gateway.create) or to an existing one (parentRefs).
gateway:
  enabled: false
  parentRefs: []                  # existing Gateway: [{ name: shared, namespace: gateway-system, sectionName: https }]

# S-17: TLS, DNS and the edge (templates/edge.yaml, docs/runbooks/edge.md). Cloud-neutral: a Gateway (Envoy Gateway by
# default) behind the cloud's layer-4 load balancer, certificates from Let's Encrypt through cert-manager, DNS records
# from external-dns — the last two are cluster add-ons (deploy/argocd/addons/), this chart only declares what it needs.
edge:
  enabled: false
  # S-126: who may open urls.docsInternal (apps.docs-internal). Client CIDRs (office, VPN egress), enforced by an Envoy
  # Gateway SecurityPolicy on its route; everyone else gets 403 at the edge. Required outside local when docs-internal
  # is enabled (behind a CDN set edge.trustedProxyHops, or the CDN's address is all the edge sees).
  docsInternal:
    allowedCIDRs: []
  # DNS zone of the public hosts; empty = urls.webauthnRpId (dev.northline.ca, staging.northline.ca, northline.ca).
  zone: ""
  gateway:
    create: true
    name: northline
    className: envoy              # Envoy Gateway (addons/envoy-gateway); gke-l7-global-external-managed etc. also work
    annotations: {}
    clientTimeout: ""             # e.g. 30s — Envoy Gateway request-received timeout
  # Envoy Gateway ClientTrafficPolicy: minimum TLS version for clients.
  tls:
    minVersion: "1.2"
  # Proxies in front that append X-Forwarded-For (Cloudflare, Azure Front Door, CloudFront): 1. 0 = clients connect
  # to the load balancer directly.
  trustedProxyHops: 0
  # Strict-Transport-Security on every route. preload only once every subdomain is HTTPS for good (hstspreload.org).
  hsts:
    enabled: true
    maxAge: 63072000              # two years
    includeSubDomains: true
    preload: false
  # Other response headers set on every route. Content-Security-Policy and frame options stay with each app (the
  # Studio's nginx sets its own).
  responseHeaders:
    X-Content-Type-Options: nosniff
    Referrer-Policy: strict-origin-when-cross-origin
  certManager:
    enabled: true
    # One wildcard certificate for the zone (DNS-01 only) instead of one per host (HTTP-01).
    wildcard: false
    renewBefore: 720h             # 30 days (Let's Encrypt issues 90-day certificates)
    issuer:
      create: true
      kind: Issuer                # namespaced; cert-manager runs with --issuer-ambient-credentials for DNS-01
      name: northline-acme
      type: acme                  # acme | ca | selfSigned (ca/selfSigned: kind only)
      server: https://acme-v02.api.letsencrypt.org/directory   # staging: https://acme-staging-v02.api.letsencrypt.org/directory
      email: platform@northline.ca
      solver: http01              # http01 | dns01 (dns01: wildcards; needs the dns01 block below)
      # The cloud's DNS-01 solver block — terraform output helm_values (edge.certManager.issuer.dns01):
      #   { route53: { region, hostedZoneID } } | { cloudDNS: { project, hostedZoneName } } | { azureDNS: { … } }
      dns01: {}
      caSecretName: ""            # type ca
  # Merchant domains pinned by hand (S-17; GitOps PR): each gets a listener on the environment's Gateway, a certificate
  # over HTTP-01 and a route to the consumer app. [{ host: book.example.ca }]. Merchants' own domains are normally
  # served by the reconciler below (S-31) instead; keep this list for exceptions (at most 64 listeners per Gateway).
  customDomains: []
  # S-31 (docs/runbooks/custom-domains.md): the api verifies merchants' domains (TXT + CNAME/A, DNS over HTTPS) and
  # reconciles them onto the edge itself — shard Gateways "<gatewayPrefix>-N" (one HTTPS listener per domain, at most
  # listenersPerGateway), one cert-manager Certificate and one HTTPRoute per domain — in this namespace only (Role
  # below, bound to the api's ServiceAccount). The shards share the environment's Envoy fleet and load balancer
  # (EnvoyProxy mergeGateways, deploy/argocd/addons/envoy-gateway), so pages.<zone> is the one target.
  domainReconciler:
    enabled: false
    gatewayPrefix: northline-custom
    listenersPerGateway: 64       # Gateway API maximum
    maxDomains: 1000              # custom domains served at most; the rest wait as "capacity"
    issuePerHour: 20              # certificate requests per hour (Let's Encrypt: 300 orders / 3 h per account)
    # Issuer of merchants' certificates (HTTP-01 on the Gateway's port 80). Empty server = Let's Encrypt production in
    # prod, Let's Encrypt STAGING everywhere else (untrusted certificates, on purpose: dev/staging tests must not use
    # up the production rate limits). type/caSecretName follow edge.certManager.issuer (ca on kind).
    issuer:
      create: true
      name: northline-acme-custom
      server: ""
    # DNS the api asks: doh (DNS over HTTPS) | jndi (UDP/TCP 53 to `servers`, or the pod's resolver).
    dns:
      provider: doh
      dohUrl: ""                  # empty = CIRA Canadian Shield (Private)
      servers: []
    # Fixed public addresses of the load balancer (a reserved IP) for merchants' apex A records; empty = apex domains
    # need ALIAS/ANAME/CNAME flattening at their DNS host.
    edgeAddresses: []
    # Zones no merchant may claim, besides northline.ca and this environment's zone.
    blockedSuffixes: []

networkPolicy:
  enabled: true
  # Where the ingress controller / gateway pods run; they may reach studio, consumer, bff and auth.
  ingressFrom:
    - namespaceSelector: {}       # default: any namespace (tighten per cluster, e.g. kubernetes.io/metadata.name: envoy-gateway-system)
  # Extra peers allowed to reach every app's port (e.g. Prometheus).
  extraFrom: []

# Database migrations as a deploy step (S-16, docs/runbooks/deploy.md § Migrations): a pre-install/pre-upgrade hook Job
# (Argo CD: PreSync) runs Flyway from the api image — db/migration only; the image has no db/seed-dev — then seeds the
# categories (idempotent upsert). A failed migration fails the Helm release before any Deployment changes, so the
# running pods keep serving. While enabled, the api does not migrate at start-up (SPRING_FLYWAY_ENABLED=false).
migrations:
  enabled: true
  seedCategories: true            # second step: db/seed/categories.json → catalogue.categories
  backoffLimit: 1                 # one retry (e.g. the database was briefly unreachable); a broken migration fails twice
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 604800 # keep the Job (and its logs) a week; the next deploy replaces it anyway
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { memory: 512Mi }

# Kafka topics as a deploy step (S-25, docs/runbooks/infrastructure.md § 5.3): a pre-install/pre-upgrade hook Job
# (Argo CD: PreSync) runs TopicsCommand from the worker image against deploy/kafka/topics.yaml (packaged in the image)
# through the Kafka admin API. Idempotent, never deletes; apply = create missing topics + correct retention/cleanup
# drift, plan = report only (Azure: Terraform creates the event hubs), verify = report and fail the release on drift.
kafkaTopics:
  enabled: true
  command: apply
  replicationFactor: ""           # blank = the broker's default.replication.factor (MSK 3 / 2 on two brokers, Managed Kafka 3)
  minInsyncReplicas: ""           # blank = broker default; prod: 2
  backoffLimit: 2                 # Kafka briefly unreachable
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

# S-42 (docs/runbooks/search.md): before every install/upgrade, the worker image makes Elasticsearch match deploy/search
# — synonym sets, the aliases listings_en / listings_fr and their versioned indices, new fields in place. Idempotent,
# never deletes; a change that needs a reindex is reported (REINDEX REQUIRED) and left to the reindex Job (S-71).
# apply = do it, plan = report only, verify = report and fail the release on anything missing or drifted.
searchIndices:
  enabled: true
  command: apply
  backoffLimit: 2                 # Elasticsearch briefly unreachable
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 384Mi }

# S-71 (docs/runbooks/search.md § 9): the full search reindex as a one-off Job with the worker's environment — new
# indices from Postgres, Kafka catch-up, atomic alias swap, old indices deleted. Rendered only while runId is set; a new
# runId (a DNS label, e.g. the date) runs it again. Safe while everything runs.
searchReindex:
  runId: ""
  keepOld: false                  # keep the previous indices (to swap back by hand)
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 604800
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 768Mi }

# Registers the OAuth clients (S-122) after every install/upgrade: the auth image running OAuthClientsCommand sync
# with the auth Deployment's environment. Idempotent; northline-auth also syncs at start unless
# apps.auth.env.OAUTH_CLIENTS_SYNC_ON_STARTUP is "false".
# S-30 partner API clients (docs/runbooks/partners.md): northline.oauth.partners.<name> → OAuth client partner:<name>
# (client_credentials + private_key_jwt). Rendered into the ConfigMap northline-auth-partners, read by auth and the
# oauth-clients Job. Example:
#   partners:
#     acme:
#       name: Acme Books
#       jwk-set-url: https://acme.example/.well-known/jwks.json   # or public-keys: ['{"kty":"EC","crv":"P-256",…,"kid":"k1"}']
#       scopes: [api.read]
#       merchants: [01J9ZD3V00000000000000PWM1]
#       revoked: false
partners: {}

oauthClientsJob:
  enabled: true
  command: sync                   # sync | list
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# ---- apps -----------------------------------------------------------------------------------------------------------
# type: spring (Java, actuator probes, infra ConfigMap + secrets), static (nginx), node (SSR).
# autoscaling: an HPA on CPU (targetCPUUtilizationPercentage of the request); `behavior` (S-119, optional) replaces the
# default (scale down after 5 minutes of low CPU) with the HPA's own `behavior` block, e.g. the api's in values-prod.yaml.
# profiles (spring): Spring profiles added after global.environment's (consumer-bff: the bff image with `consumer`).
apps:
  api:
    enabled: true
    type: spring
    image: { repository: api, tag: "", digest: "" }
    port: 8080
    service: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { memory: 1Gi }
    env: {}
    # Secret variables → required (true: the pod doesn't start without the key) or optional (false).
    secretEnv:
      DB_PASSWORD: true
      WEBHOOK_SECRET_KEY: true
      REDIS_PASSWORD: false
      KAFKA_SASL_JAAS_CONFIG: false
      ES_PASSWORD: false
      STRIPE_SECRET_KEY: false
      STRIPE_PUBLISHABLE_KEY: false
      STRIPE_WEBHOOK_SECRET: false          # S-12: required under staging/prod
      STRIPE_CONNECT_WEBHOOK_SECRET: false  # S-12: required under staging/prod
      EMAIL_UNSUBSCRIBE_KEY: false  # required under staging/prod (values-staging/prod.yaml)
      EMAIL_API_KEY: false          # sendgrid, or azure with an access key
      SMTP_PASSWORD: false          # EMAIL_PROVIDER=smtp
      SMS_AUTH_TOKEN: false         # S-27: team invitations by SMS (SMS_PROVIDER=twilio)
      REGISTRY_CORPORATIONS_CANADA_KEY: false  # S-23: with REGISTRY_CORPORATIONS_CANADA_PROVIDER=api
      REGISTRY_ALBERTA_KEY: false              # S-23: with REGISTRY_ALBERTA_PROVIDER=opencorporates
      REGISTRY_CALGARY_APP_TOKEN: false        # S-23: optional Socrata app token (higher rate limits)
      GOOGLE_CALENDAR_CLIENT_SECRET: false     # S-32: with GOOGLE_CALENDAR_CLIENT_ID (configEnv); empty = Google not offered
      MICROSOFT_CALENDAR_CLIENT_SECRET: false  # S-32: with MICROSOFT_CALENDAR_CLIENT_ID (configEnv)
      SHOPIFY_CLIENT_SECRET: false             # S-35: with SHOPIFY_CLIENT_ID (configEnv); empty = Shopify not offered
      SQUARE_CLIENT_SECRET: false              # S-35: with SQUARE_CLIENT_ID (configEnv)
      SQUARE_WEBHOOK_SIGNATURE_KEY: false      # S-35: the Square webhook subscription's signature key
      LIGHTSPEED_CLIENT_SECRET: false          # S-35: with LIGHTSPEED_CLIENT_ID (configEnv)
      CLOVER_CLIENT_SECRET: false              # S-36: with CLOVER_CLIENT_ID (configEnv); empty = Clover not offered
      TOAST_CLIENT_SECRET: false               # S-36: with TOAST_CLIENT_ID (configEnv), once Toast admits Northline as a partner
      GOOGLE_MAPS_API_KEY: false               # S-47: with PLACES_PROVIDER=google (required in staging/prod)
      OPENROUTER_API_KEY: false                # S-129: empty = every AI feature answers 503; add to optionalKeys once the key exists
      CONSOLE_HEALTH_PROMETHEUS_TOKEN: false   # S-91: only for a metrics store that needs a bearer token
      ONCALL_EXPORT_TOKEN: false               # S-113: the on-call rota export for paging tools; empty = off (404)
      GO_LIVE_PROMETHEUS_TOKEN: false          # S-118: only when the go-live alert gates read another store than the console's
    runAsUser: 65532
    probes:
      startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 60 }
      liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /actuator/health/readiness, periodSeconds: 5, failureThreshold: 3 }
    public: true                  # the ingress reaches it for the Stripe, calendar and commerce webhooks, the commerce OAuth callback and email unsubscribe (ingress.yaml)
    # S-29: route all of /api/v1 on the api host, for clients that hold their own tokens (the mobile apps, with DPoP;
    # partners). false = webhooks and unsubscribe only, as before. Every other endpoint still needs a token.
    tokenClients: true
    # S-125: also route the API documentation on the api host — /docs (landing, Redoc, Scalar), /swagger-ui(.html) and
    # /v3/api-docs — for dev and staging (values-dev/staging). Never in prod: the chart refuses it there, and the api's
    # prod profile turns springdoc and the viewers off anyway. auth serves the same paths on its host (all of auth is
    # routed); the BFFs serve theirs under /bff.
    docsRoutes: false
    # S-127: route /mcp (the MCP server for AI agents: Claude, IDEs; OAuth 2.1 tokens from auth with the mcp scope and
    # acr=mfa) and /.well-known/oauth-protected-resource on the api host. false = agents can't reach it (docs/runbooks/mcp.md).
    mcp: true
    allowFrom: [bff, consumer-bff, console-bff]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  auth:
    enabled: true
    type: spring
    image: { repository: auth, tag: "", digest: "" }
    port: 9000
    service: true
    public: true                  # browsers reach it (OIDC issuer, sign-in API)
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { memory: 768Mi }
    env: {}
    secretEnv:
      DB_PASSWORD: true
      TOTP_KEY: true
      STUDIO_BFF_SECRET_HASH: true
      CONSUMER_BFF_SECRET_HASH: true   # S-45: the consumer-bff exists (required since then)
      CONSOLE_BFF_SECRET_HASH: true    # S-90: the console-bff exists (required since then)
      REDIS_PASSWORD: false
      KAFKA_SASL_JAAS_CONFIG: false # S-28: user.registered is externalized to Kafka
      GOOGLE_CLIENT_SECRET: false   # S-18; required (true) in staging/prod
      APPLE_PRIVATE_KEY: false      # S-18; required (true) in staging/prod
      SMS_AUTH_TOKEN: false
    runAsUser: 65532
    probes:
      startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 60 }
      liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /actuator/health/readiness, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: [bff, consumer-bff, console-bff, api]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  bff:
    enabled: true
    type: spring
    image: { repository: bff, tag: "", digest: "" }
    port: 8082
    service: true
    public: true                  # /api, /bff, /oauth2, /login on the Studio host
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 512Mi }
    env: {}
    secretEnv:
      STUDIO_BFF_SECRET: true
      REDIS_PASSWORD: false
    runAsUser: 65532
    probes:
      startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 60 }
      liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /actuator/health/readiness, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # S-45: the consumer web app's BFF — the bff image under the `consumer` profile (server/bff application-consumer.yml):
  # client consumer-bff, cookie __Host-NL_CONSUMER, guests browse /api without a token. Routes: /api, /bff, /oauth2,
  # /login on the consumer host; /api and /bff on pages. (templates/ingress.yaml). The consumer app's server-side
  # rendering calls it in-cluster (NL_BFF_URL).
  consumer-bff:
    enabled: true
    type: spring
    image: { repository: bff, tag: "", digest: "" }
    profiles: [consumer]
    port: 8081
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 512Mi }
    env: {}
    secretEnv:
      CONSUMER_BFF_SECRET: true
      REDIS_PASSWORD: false
    runAsUser: 65532
    probes:
      startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 60 }
      liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /actuator/health/readiness, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: [consumer]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # S-90: the platform console's BFF — the bff image under the `console` profile (server/bff application-console.yml):
  # client console-bff, cookie __Host-NL_CONSOLE, staff with a second factor only. Routes: /api, /bff, /oauth2, /login
  # on the console host (templates/ingress.yaml).
  console-bff:
    enabled: true
    type: spring
    image: { repository: bff, tag: "", digest: "" }
    profiles: [console]
    port: 8083
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 3, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 50m, memory: 512Mi }
      limits: { memory: 512Mi }
    env: {}
    secretEnv:
      CONSOLE_BFF_SECRET: true
      REDIS_PASSWORD: false
    runAsUser: 65532
    probes:
      startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 60 }
      liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /actuator/health/readiness, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  worker:
    enabled: true
    type: spring
    image: { repository: worker, tag: "", digest: "" }
    port: 8084                    # health only
    service: false
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { memory: 512Mi }
    env: {}
    secretEnv:
      DB_PASSWORD: true
      REDIS_PASSWORD: false
      KAFKA_SASL_JAAS_CONFIG: false
      ES_PASSWORD: false
      # S-27 notifications consumer: the payout.failed email (same settings as the api) and SMS (same as auth).
      EMAIL_UNSUBSCRIBE_KEY: false  # required under staging/prod (values-staging/prod.yaml); the api's key
      EMAIL_API_KEY: false          # sendgrid, or azure with an access key
      SMTP_PASSWORD: false          # EMAIL_PROVIDER=smtp
      SMS_AUTH_TOKEN: false         # SMS_PROVIDER=twilio
      WEBHOOK_SECRET_KEY: true      # S-33: decrypts partner webhook signing secrets (the api's key; required in the cloud)
      PUSH_APNS_KEY: false          # S-102: PUSH_PROVIDER=native (required in prod, values-prod.yaml)
      PUSH_FCM_SERVICE_ACCOUNT: false  # S-102: PUSH_PROVIDER=native (required in prod)
    runAsUser: 65532
    probes:
      startup: { path: /actuator/health/liveness, periodSeconds: 5, failureThreshold: 60 }
      liveness: { path: /actuator/health/liveness, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /actuator/health/readiness, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  studio:
    enabled: true
    type: static
    image: { repository: studio, tag: "", digest: "" }
    port: 8080
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 64Mi }
    env: {}
    runAsUser: 101
    probes:
      liveness: { path: /healthz, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /healthz, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    # nginx renders its configuration at start into these writable directories (the root file system is read-only).
    writableDirs: [/tmp, /etc/nginx/conf.d]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  consumer:
    enabled: true
    type: node
    image: { repository: consumer, tag: "", digest: "" }
    port: 3000
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
    env:
      TRUST_PROXY: "true"
    runAsUser: 65532
    probes:
      liveness: { path: /healthz, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /healthz, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # S-126: the documentation site (web/apps/docs, docs/runbooks/docs-site.md), static on nginx like the Studio.
  # docs = the public variant (guides + the public, partner, webhook and OAuth references) on urls.docs;
  # docs-internal = everything (docs/ of the repository, every OpenAPI document) on urls.docsInternal, reachable only
  # from edge.docsInternal.allowedCIDRs (an Envoy Gateway SecurityPolicy; the chart refuses it without one outside
  # local). NL_DOCS_SWAGGER (links to the services' viewers) and NL_DOCS_CONNECT are derived (templates/_helpers.tpl).
  docs:
    enabled: true
    type: static
    image: { repository: docs, tag: "", digest: "" }
    port: 8080
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 64Mi }
    env: {}
    runAsUser: 101
    probes:
      liveness: { path: /healthz, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /healthz, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    writableDirs: [/tmp, /etc/nginx/conf.d]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  docs-internal:
    enabled: false
    type: static
    image: { repository: docs-internal, tag: "", digest: "" }
    port: 8080
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 4, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 64Mi }
    env: {}
    runAsUser: 101
    probes:
      liveness: { path: /healthz, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /healthz, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    writableDirs: [/tmp, /etc/nginx/conf.d]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # S-90: the platform console (web/apps/console, design 03) — a TanStack Router SPA like the Studio: static files on
  # nginx (web/Dockerfile --target console), NL_AUTH_ORIGIN read at start. The console-bff serves /api, /bff, /oauth2
  # and /login on the same host.
  console:
    enabled: true
    type: static
    image: { repository: console, tag: "", digest: "" }
    port: 8080
    service: true
    public: true
    replicas: 1
    autoscaling: { enabled: false, minReplicas: 2, maxReplicas: 3, targetCPUUtilizationPercentage: 70 }
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 64Mi }
    env: {}
    runAsUser: 101
    probes:
      liveness: { path: /healthz, periodSeconds: 10, failureThreshold: 3 }
      readiness: { path: /healthz, periodSeconds: 5, failureThreshold: 3 }
    allowFrom: []
    writableDirs: [/tmp, /etc/nginx/conf.d]
    extraVolumes: []
    extraVolumeMounts: []
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Seconds a pod keeps serving after it is removed from the endpoints (lets load balancers catch up). 0 = none.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 45
