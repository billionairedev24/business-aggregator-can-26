# prod — Calgary launch (docs/runbooks/prod.md): multi-zone replicas, HPAs, disruption budgets, larger heaps.
global:
  environment: prod

urls:
  auth: https://auth.northline.ca
  api: https://api.northline.ca
  studio: https://studio.northline.ca
  consumer: https://northline.ca
  console: https://console.northline.ca
  pages: https://pages.northline.ca
  docs: https://docs.northline.ca                   # S-126: the public documentation site
  docsInternal: https://internal-docs.northline.ca   # S-126: with apps.docs-internal + edge.docsInternal.allowedCIDRs
  webauthnRpId: northline.ca

# S-17: Gateway API with the chart's Gateway (Envoy Gateway), Let's Encrypt certificates per host over HTTP-01,
# records published by external-dns in the northline.ca zone (docs/runbooks/edge.md).
gateway:
  enabled: true
edge:
  enabled: true
  # S-31: the api verifies merchants' domains and reconciles them onto the edge (docs/runbooks/custom-domains.md);
  # Let's Encrypt production for merchants' certificates (dev/staging: the staging endpoint).
  domainReconciler:
    enabled: true

# S-20: only the Envoy Gateway proxies may reach the public apps. auth and the bff believe X-Forwarded-For (client IP
# for rate limits, sessions list) and the city header from private addresses; with any namespace allowed, any pod in
# the cluster could pick its own client IP. A CDN/WAF in front still enters through Envoy. Using another edge (e.g. GKE
# Gateway for Cloud Armor)? Put its source here instead (docs/runbooks/edge.md § Trusted proxies).
networkPolicy:
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system

# S-25: two in-sync replicas of three before a write is acknowledged (the api produces with acks=all).
kafkaTopics:
  minInsyncReplicas: "2"

apps:
  api:
    env:
      # S-13: EMAIL_PROVIDER comes from the cloud overlay (ses / sendgrid / azure); the sender is per environment.
      TAX_PROVIDER: stripe          # S-21: Stripe Tax (with STRIPE_SECRET_KEY); `local` is refused here
      IDENTITY_PROVIDER: stripe       # S-22: Stripe Identity for owners ≥ 25 % (uses STRIPE_SECRET_KEY)
      # S-23: business registries. Corporations Canada needs the API Store subscription (URL in configEnv, key as a
      # secret); without it use `manual`. Alberta has no public API: `manual` = registry-agent searches by agents.
      REGISTRY_CORPORATIONS_CANADA_PROVIDER: manual
      REGISTRY_ALBERTA_PROVIDER: manual
      REGISTRY_CALGARY_PROVIDER: socrata
      # S-32: Google Calendar and Microsoft 365 over OAuth; `local` is refused here. The client ids go in configEnv
      # (GOOGLE_CALENDAR_CLIENT_ID, MICROSOFT_CALENDAR_CLIENT_ID), the secrets in the secrets manager
      # (secretEnv below once set); KMS_ENCRYPTION_KEY_ID comes from Terraform's config_env.
      CALENDAR_PROVIDER: oauth
      # S-35 catalogue sync: the real platforms; the app ids (SHOPIFY_CLIENT_ID, SQUARE_CLIENT_ID, LIGHTSPEED_CLIENT_ID)
      # go here once registered, the secrets in the secrets manager (docs/runbooks/commerce-sync.md)
      COMMERCE_PROVIDER: oauth
      # S-36 POS menu import: Square (the S-35 app), Clover (CLOVER_CLIENT_ID) and Toast (TOAST_CLIENT_ID, partner)
      POS_PROVIDER: oauth
      # S-47 addresses: Google Places API (New) + Geocoding API; the key is the secret google-maps-api-key
      PLACES_PROVIDER: google
      EMAIL_FROM: "Northline <no-reply@northline.ca>"
    autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10 }
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { memory: 2Gi }
    secretEnv:
      STRIPE_SECRET_KEY: true
      STRIPE_PUBLISHABLE_KEY: true
      STRIPE_WEBHOOK_SECRET: true   # S-12
      STRIPE_CONNECT_WEBHOOK_SECRET: true
      EMAIL_UNSUBSCRIBE_KEY: true   # S-13: required under staging/prod
      GOOGLE_MAPS_API_KEY: true     # S-47: PLACES_PROVIDER=google
  auth:
    secretEnv:
      GOOGLE_CLIENT_SECRET: true    # S-18: Google and Apple sign-in are required here (GOOGLE_CLIENT_ID, APPLE_CLIENT_ID,
      APPLE_PRIVATE_KEY: true       # APPLE_TEAM_ID, APPLE_KEY_ID go in the operator's configEnv — docs/runbooks/federation.md)
    autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 6 }
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 1Gi }
  bff:
    autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 6 }
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 768Mi }
  consumer-bff:                     # S-45: consumer traffic (guests included) — scales with the consumer app
    autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10 }
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 768Mi }
  worker:
    env:
      EMAIL_FROM: "Northline <no-reply@northline.ca>"   # S-27 notifications (payout.failed email)
    secretEnv:
      EMAIL_UNSUBSCRIBE_KEY: true   # S-27: required under staging/prod (the same key as the api)
    replicas: 2
    resources:
      requests: { cpu: 250m, memory: 768Mi }
      limits: { memory: 768Mi }
  studio:
    autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4 }
  consumer:
    autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10 }
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { memory: 512Mi }
