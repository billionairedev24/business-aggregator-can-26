# ovh-vps — the dry run on ONE OVHcloud VPS in Beauharnois (BHS) running k3s (docs/runbooks/ovh.md, DECISIONS
# 2026-10-19): fake data only, everything on the box. The same dry-run shape as Google Cloud (values-dryrun.yaml: Spring
# profile `dev`, hosts, small JVMs, Stripe test mode); this file replaces values-gcp.yaml for OVHcloud. Layer it after
# values-dryrun.yaml and before Terraform's values (scripts/ovh/deploy.sh does this):
#
#   helm upgrade --install northline deploy/helm/northline -n northline-dryrun \
#     -f deploy/helm/northline/values-dryrun.yaml -f deploy/helm/northline/values-ovh-vps.yaml \
#     -f ovh-vps-values.json \          # terraform output -json helm_values (infra/terraform/envs/ovh/vps)
#     --set global.image.registry=$REGISTRY --set global.image.tag=$IMAGE_TAG --wait --timeout 20m
#
# What differs from Google Cloud, and why:
#   - Secrets: no secrets manager behind External Secrets on OVHcloud. One plain Secret, northline-secrets, written by
#     scripts/ovh/secrets.sh from the operator's git-ignored file .ovh/ovh-vps.env (secrets.existingSecret).
#   - Keys: no key service the apps support (KMS_PROVIDER=local from Terraform): northline-auth keeps its signing keys
#     in a file on a volume (the claim comes from deploy/helm/northline-data, authSigningKeys), the api seals stored
#     secrets with KMS_LOCAL_KEY. Allowed under `dev`; staging/prod refuse both (an OVHcloud KMS adapter would be needed).
#   - Object storage: OVHcloud Object Storage over the S3 API (STORAGE_PROVIDER=s3 + endpoint from Terraform), static
#     keys of a Terraform-made user limited to the uploads bucket (STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY).
#   - Edge: the same Envoy Gateway as Google Cloud; on k3s its LoadBalancer Service is served by k3s's ServiceLB on the
#     VPS's own ports 80/443 (no cloud load balancer). Records by hand (no external-dns): docs/runbooks/ovh.md § DNS.
#   - Observability off; logs with kubectl logs (no cloud logging).
global:
  imagePullSecrets:
    - name: northline-registry    # written by scripts/ovh/secrets.sh when REGISTRY_* are set (e.g. GHCR); else unused

externalSecrets:
  enabled: false
secrets:
  existingSecret: northline-secrets

# Only Envoy Gateway's proxies reach the public apps (as on Google Cloud).
networkPolicy:
  enabled: true                   # k3s enforces NetworkPolicy (its embedded network policy controller)

apps:
  api:
    secretEnv:
      STORAGE_ACCESS_KEY: true      # OVHcloud Object Storage user (Terraform output s3_credentials, via secrets.sh)
      STORAGE_SECRET_KEY: true
      KMS_LOCAL_KEY: true           # seals stored secrets (calendar tokens) — base64 of 32 bytes, generated by secrets.sh
  auth:
    env:
      SIGNING_KEYS_DIR: /var/lib/northline/auth-keys   # KMS_PROVIDER=local: the JWK set file
    extraVolumes:
      - name: signing-keys
        persistentVolumeClaim:
          claimName: northline-auth-signing-keys       # deploy/helm/northline-data authSigningKeys
    extraVolumeMounts:
      - name: signing-keys
        mountPath: /var/lib/northline/auth-keys
    # One pod at a time owns the key file (ReadWriteOnce volume): a rollout stops the old pod first (≈ 30–60 s of
    # sign-in downtime per auth upgrade — fine for a demo).
    strategy:
      type: Recreate

# Nothing to export to on OVHcloud: the Collector flag (observability.collector.enabled=true) only logs a summary.
observability:
  collector:
    pipelines:
      traces: [debug]
      metrics: [debug]
      logs: [debug]
