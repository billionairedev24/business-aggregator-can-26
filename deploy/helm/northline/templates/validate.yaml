{{- /* Refusals evaluated at render time. */ -}}
{{- if and .Values.secrets.create (ne .Values.global.environment "local") }}
{{- fail "secrets.create renders secrets from Helm values and is allowed only with global.environment=local (kind). Create the Secret outside the chart, or use External Secrets (S-6)." }}
{{- end }}
{{- if not (has .Values.global.environment (list "local" "dev" "staging" "prod" "dryrun")) }}
{{- fail (printf "global.environment must be local, dev, staging, prod or dryrun (got %q)" .Values.global.environment) }}
{{- end }}
{{- /* dryrun (the GCP demo, docs/runbooks/dryrun-gcp.md) has no Spring profile of its own: it names one. */ -}}
{{- if and (eq .Values.global.environment "dryrun") (not (has .Values.global.springProfiles (list "dev" "staging" "prod"))) }}
{{- fail "global.environment=dryrun needs global.springProfiles: dev, staging or prod (values-dryrun.yaml: dev)" }}
{{- end }}
{{- if and (has .Values.global.environment (list "staging" "prod" "dryrun")) (not (hasPrefix "https://" .Values.urls.auth)) }}
{{- fail "urls.* must be https:// in staging, prod and dryrun" }}
{{- end }}
{{- /* S-160: Canadian data residency. A cluster outside Canada (global.hostingCountry from Terraform: the OVHcloud US
locations) may only run the dev profile with fake demo data — never staging or prod, by environment or by profile. */ -}}
{{- $country := upper (default "" .Values.global.hostingCountry) }}
{{- if and $country (ne $country "CA") }}
{{- $profiles := splitList "," (include "northline.springProfiles" .) }}
{{- if or (has .Values.global.environment (list "staging" "prod")) (has "staging" $profiles) (has "prod" $profiles) }}
{{- fail (printf "Canadian data residency: this cluster is in %s (global.hostingCountry) — only the dev profile with fake demo data may run outside Canada. Staging and prod need a Canadian location (OVHcloud: OVH_LOCATION=ca-bhs; docs/runbooks/ovh.md § Data residency)." $country) }}
{{- end }}
{{- end }}
{{- if .Values.demoMail.enabled }}
{{- if has .Values.global.environment (list "staging" "prod") }}
{{- fail "demoMail (Mailpit, S-155b) captures every email and is not allowed in staging or prod" }}
{{- end }}
{{- if not (hasPrefix "https://" .Values.demoMail.url) }}
{{- fail "demoMail.enabled needs demoMail.url (https://mail.<zone>): the inbox is only reachable through the edge, behind basic auth" }}
{{- end }}
{{- end }}
{{- if and .Values.apps.api.docsRoutes (eq .Values.global.environment "prod") }}
{{- fail "apps.api.docsRoutes exposes the API documentation and is not allowed in prod (S-125: prod publishes no spec; the docs site carries the public ones)" }}
{{- end }}
{{- $dint := get .Values.apps "docs-internal" }}
{{- if and $dint $dint.enabled (ne .Values.global.environment "local") (not .Values.edge.docsInternal.allowedCIDRs) }}
{{- fail "apps.docs-internal publishes runbooks, decisions and the internal API specs: set edge.docsInternal.allowedCIDRs (S-126) — it is never public" }}
{{- end }}
{{- if and $dint $dint.enabled (ne .Values.global.environment "local") (not (and .Values.edge.enabled .Values.gateway.enabled (eq .Values.edge.gateway.className "envoy"))) }}
{{- fail "apps.docs-internal needs the Envoy Gateway edge (edge.enabled, gateway.enabled, className envoy) to enforce edge.docsInternal.allowedCIDRs" }}
{{- end }}
