{{- /*
Routes. The Studio host serves the Studio and, on the same origin, the studio-bff for /api, /bff, /oauth2 and /login;
auth, consumer, console and pages have their own hosts. The api host exposes only /api/v1/webhooks/stripe (+ /connect,
S-12), /api/v1/webhooks/calendar (S-32 Google / Microsoft change notifications) and /api/v1/email/unsubscribe (S-13);
the rest of the api is reached through the BFF. pages.<zone> and every
verified merchant domain (edge.customDomains, S-31) serve storefronts from the consumer app.
S-17 adds TLS (cert-manager), DNS (external-dns reads these hostnames) and the edge (templates/edge.yaml).
*/ -}}
{{- define "northline.routes" -}}
{{- $v := .Values -}}
{{- $routes := list -}}
{{- if and $v.apps.studio.enabled $v.apps.bff.enabled -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.studio) "paths" (list
      (dict "path" "/api" "app" "bff") (dict "path" "/bff" "app" "bff") (dict "path" "/oauth2" "app" "bff")
      (dict "path" "/login" "app" "bff") (dict "path" "/" "app" "studio"))) -}}
{{- end -}}
{{- if $v.apps.api.enabled -}}
{{- /* Public on the api host, without the BFF: Stripe webhooks (S-12, signed), calendar change notifications (S-32,
       verified per channel secret) and email unsubscribe (S-13); with
       apps.api.tokenClients (S-29) all of /api/v1 for the mobile apps' DPoP-bound tokens (and partners' tokens). */ -}}
{{- if $v.apps.api.tokenClients -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.api) "paths" (list (dict "path" "/api/v1" "app" "api"))) -}}
{{- else -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.api) "paths" (list
      (dict "path" "/api/v1/webhooks/stripe" "app" "api") (dict "path" "/api/v1/webhooks/calendar" "app" "api")
      (dict "path" "/api/v1/email/unsubscribe" "app" "api"))) -}}
{{- end -}}
{{- end -}}
{{- if $v.apps.auth.enabled -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.auth) "paths" (list (dict "path" "/" "app" "auth"))) -}}
{{- end -}}
{{- if $v.apps.consumer.enabled -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.consumer) "paths" (list (dict "path" "/" "app" "consumer"))) -}}
{{- if $v.urls.pages -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.pages) "paths" (list (dict "path" "/" "app" "consumer"))) -}}
{{- end -}}
{{- range $v.edge.customDomains -}}
{{- $routes = append $routes (dict "host" .host "paths" (list (dict "path" "/" "app" "consumer")) "custom" true) -}}
{{- end -}}
{{- end -}}
{{- if $v.apps.console.enabled -}}
{{- $routes = append $routes (dict "host" (include "northline.host" $v.urls.console) "paths" (list (dict "path" "/" "app" "console"))) -}}
{{- end -}}
{{- toYaml (dict "routes" $routes) -}}
{{- end }}
{{- $routes := (include "northline.routes" . | fromYaml).routes }}
{{- $edge := .Values.edge }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northline
  labels:
    {{- include "northline.labels" (dict "root" . "app" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- else if and $edge.enabled $edge.certManager.enabled }}
  # S-17: the Secrets the Certificates in templates/edge.yaml write.
  tls:
    {{- range $routes }}
    - hosts: [{{ .host | quote }}]
      secretName: {{ include "northline.tlsSecret" (dict "root" $ "host" .host "custom" .custom) }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $routes }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "northline.appName" .app }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.gateway.enabled }}
{{- $ownGateway := and $edge.enabled $edge.gateway.create }}
{{- if and (not $ownGateway) (not .Values.gateway.parentRefs) }}
{{- fail "gateway.enabled needs gateway.parentRefs (an existing Gateway) or edge.enabled with edge.gateway.create" }}
{{- end }}
{{- range $routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "northline-%s" (.host | replace "." "-") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "northline.labels" (dict "root" $ "app" "gateway") | nindent 4 }}
  {{- if .custom }}
  annotations:
    # A merchant's own domain (S-31): its DNS is theirs; external-dns leaves it alone.
    external-dns.alpha.kubernetes.io/controller: none
  {{- end }}
spec:
  parentRefs:
    {{- if $ownGateway }}
    # Only this host's HTTPS listener; plain HTTP gets the redirect route (templates/edge.yaml).
    - name: {{ $edge.gateway.name }}
      sectionName: {{ include "northline.listenerName" .host }}
    {{- else }}
    {{- toYaml $.Values.gateway.parentRefs | nindent 4 }}
    {{- end }}
  hostnames: [{{ .host | quote }}]
  rules:
    {{- range .paths }}
    - matches:
        - path: { type: PathPrefix, value: {{ .path }} }
      {{- with (include "northline.responseHeaders" $) }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              {{- . | nindent 14 }}
      {{- end }}
      backendRefs:
        - name: {{ include "northline.appName" .app }}
          port: {{ (get $.Values.apps .app).port }}
    {{- end }}
{{- end }}
{{- end }}
