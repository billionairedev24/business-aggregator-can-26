{{- /*
S-6: secrets from the cloud's secrets manager through External Secrets Operator (docs/runbooks/secrets.md).
One SecretStore (or ClusterSecretStore) for the provider picked by externalSecrets.provider, authenticated with the
ESO controller's workload identity (no static keys), and one ExternalSecret per app that writes Secret
northline-<app>-secrets with exactly the variables that app reads.
*/ -}}
{{- $es := .Values.externalSecrets }}
{{- if $es.enabled }}
{{- if not (has $es.provider (list "aws" "gcp" "azure" "fake")) }}
{{- fail (printf "externalSecrets.provider must be aws, gcp, azure or fake (got %q)" $es.provider) }}
{{- end }}
{{- if and (eq $es.provider "fake") (ne .Values.global.environment "local") }}
{{- fail "externalSecrets.provider=fake holds secret values in Helm values: only with global.environment=local (kind)" }}
{{- end }}
{{- if .Values.secrets.create }}
{{- fail "use either secrets.create (plain Secret) or externalSecrets.enabled, not both" }}
{{- end }}
{{- if $es.store.create }}
---
apiVersion: external-secrets.io/v1
kind: {{ $es.store.kind }}
metadata:
  name: {{ $es.store.name }}
  labels:
    {{- include "northline.labels" (dict "root" . "app" "secrets") | nindent 4 }}
  annotations:
    # Argo CD (S-15): the store, then the ExternalSecrets, then (wave 0) the Deployments that read their Secrets.
    argocd.argoproj.io/sync-wave: "-6"
spec:
  provider:
    {{- if eq $es.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.aws.region" $es.aws.region }}
      {{- with $es.aws.auth }}
      auth: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else if eq $es.provider "gcp" }}
    gcpsm:
      projectID: {{ required "externalSecrets.gcp.projectID" $es.gcp.projectID }}
      {{- with $es.gcp.auth }}
      auth: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else if eq $es.provider "azure" }}
    azurekv:
      vaultUrl: {{ required "externalSecrets.azure.vaultUrl" $es.azure.vaultUrl }}
      authType: WorkloadIdentity
      {{- with $es.azure.tenantId }}
      tenantId: {{ . }}
      {{- end }}
      {{- with $es.azure.serviceAccountRef }}
      serviceAccountRef: {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- else }}
    fake:
      data:
        {{- range $key, $value := $es.fake.data }}
        - key: {{ $key | quote }}
          value: {{ $value | toString | quote }}
        {{- end }}
    {{- end }}
{{- end }}
{{- range $name, $app := .Values.apps }}
{{- if and $app.enabled $app.secretEnv }}
{{- $keys := include "northline.externalKeys" (dict "root" $ "app" $app) | fromYamlArray }}
{{- if $keys }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "northline.appName" $name }}
  labels:
    {{- include "northline.labels" (dict "root" $ "app" $name) | nindent 4 }}
  annotations:
    # Argo CD waits for it to be Healthy (SecretSynced) before wave 0 creates the Deployments.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.store.kind }}
    name: {{ $es.store.name }}
  target:
    name: {{ include "northline.secretName" (dict "root" $ "name" $name) }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $keys }}
    {{- $remote := include "northline.remoteKey" (dict "root" $ "key" .) }}
    {{- if not $remote }}
    {{- fail (printf "externalSecrets: no remote key for %s (app %s) — set externalSecrets.remoteKeys.%s or secretNames.%s" . $name . .) }}
    {{- end }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $remote | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
