{{- /*
S-17: the edge of one environment (docs/runbooks/edge.md) — cloud-neutral, all in the app namespace:
  Gateway northline        (Gateway API; class from edge.gateway.className, Envoy Gateway by default): an HTTP
                           listener (ACME HTTP-01 + redirect to HTTPS) and one HTTPS listener per public host
  HTTPRoute …-http-redirect  301 to https:// for every host on port 80
  ClientTrafficPolicy      (Envoy Gateway only) TLS 1.2+, trusted proxy hops in front (Cloudflare, Front Door)
  Issuer northline-acme    cert-manager: Let's Encrypt with HTTP-01 on the Gateway (or the Ingress), DNS-01 through
                           the cloud's DNS when edge.certManager.issuer.solver = dns01 (wildcards); or a CA (kind)
  Certificate per host     (or one wildcard for the zone) + one per merchant domain (edge.customDomains)
external-dns (an Argo CD add-on) publishes the HTTPRoute hostnames at the Gateway's address; HSTS and the other
response headers are filters on the routes (templates/ingress.yaml).
*/ -}}
{{- $e := .Values.edge }}
{{- if $e.enabled }}
{{- $routes := (include "northline.routes" . | fromYaml).routes }}
{{- $zone := include "northline.edgeZone" . }}
{{- $cm := $e.certManager }}
{{- $iss := $cm.issuer }}
{{- $useGateway := and .Values.gateway.enabled $e.gateway.create }}
{{- if and (not $useGateway) (not .Values.ingress.enabled) }}
{{- fail "edge.enabled needs gateway.enabled with edge.gateway.create, or ingress.enabled" }}
{{- end }}
{{- if and $cm.wildcard (eq $iss.type "acme") (ne $iss.solver "dns01") }}
{{- fail "edge.certManager.wildcard needs edge.certManager.issuer.solver=dns01 (Let's Encrypt issues wildcards over DNS-01 only)" }}
{{- end }}
{{- if and (eq $iss.solver "dns01") (eq $iss.type "acme") (not $iss.dns01) }}
{{- fail "edge.certManager.issuer.solver=dns01 needs edge.certManager.issuer.dns01 (terraform output helm_values: edge.certManager.issuer.dns01)" }}
{{- end }}
{{- if and (has .Values.global.environment (list "staging" "prod")) (ne $iss.type "acme") }}
{{- fail "edge.certManager.issuer.type must be acme in staging and prod" }}
{{- end }}
{{- $issuerKind := default "Issuer" $iss.kind }}
{{- if $useGateway }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $e.gateway.name }}
  labels:
    {{- include "northline.labels" (dict "root" . "app" "edge") | nindent 4 }}
  {{- with $e.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $e.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: Same }
    {{- range $routes }}
    - name: {{ include "northline.listenerName" .host }}
      hostname: {{ .host | quote }}
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "northline.tlsSecret" (dict "root" $ "host" .host "custom" .custom) }}
      allowedRoutes:
        namespaces: { from: Same }
    {{- end }}
---
# Everything on port 80 answers 301 to https://; cert-manager's HTTP-01 challenge routes (exact paths under
# /.well-known/acme-challenge/) take precedence while a certificate is being issued.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: northline-http-redirect
  labels:
    {{- include "northline.labels" (dict "root" . "app" "edge") | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: {{ $e.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect: { scheme: https, port: 443, statusCode: 301 }
{{- if eq $e.gateway.className "envoy" }}
---
# Envoy Gateway: TLS 1.2 or newer (Envoy's default ciphers: ECDHE + AES-GCM/ChaCha20), HTTP/2, the real client
# address behind a CDN/WAF in front (edge.trustedProxyHops: Cloudflare, Azure Front Door, CloudFront = 1).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $e.gateway.name }}
  labels:
    {{- include "northline.labels" (dict "root" . "app" "edge") | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $e.gateway.name }}
  tls:
    minVersion: {{ $e.tls.minVersion | quote }}
    alpnProtocols: [h2, http/1.1]
  {{- if gt (int $e.trustedProxyHops) 0 }}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: {{ int $e.trustedProxyHops }}
  {{- end }}
  {{- with $e.gateway.clientTimeout }}
  timeout:
    http:
      requestReceivedTimeout: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
{{- if $cm.enabled }}
{{- if $iss.create }}
---
apiVersion: cert-manager.io/v1
kind: {{ $issuerKind }}
metadata:
  name: {{ $iss.name }}
  labels:
    {{- include "northline.labels" (dict "root" . "app" "edge") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  {{- if eq $iss.type "acme" }}
  acme:
    server: {{ $iss.server }}
    email: {{ required "edge.certManager.issuer.email (Let's Encrypt expiry notices)" $iss.email }}
    privateKeySecretRef:
      name: {{ $iss.name }}-account-key
    solvers:
      {{- if eq $iss.solver "dns01" }}
      # Names in the zone (incl. the wildcard): DNS-01 through the cloud's DNS, as cert-manager's workload identity.
      - selector:
          dnsZones: [{{ $zone | quote }}]
        dns01:
          {{- toYaml $iss.dns01 | nindent 10 }}
      {{- end }}
      # Everything else (and everything, with solver=http01): HTTP-01 on port 80.
      - http01:
          {{- if $useGateway }}
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ $e.gateway.name }}
                namespace: {{ .Release.Namespace }}
                kind: Gateway
                sectionName: http
          {{- else }}
          ingress:
            ingressClassName: {{ required "ingress.className (HTTP-01 through the Ingress)" .Values.ingress.className }}
          {{- end }}
  {{- else if eq $iss.type "ca" }}
  # Local only: certificates signed by a CA whose key pair is in this Secret (kind rehearsal).
  ca:
    secretName: {{ required "edge.certManager.issuer.caSecretName" $iss.caSecretName }}
  {{- else if eq $iss.type "selfSigned" }}
  selfSigned: {}
  {{- else }}
  {{- fail (printf "edge.certManager.issuer.type must be acme, ca or selfSigned (got %q)" $iss.type) }}
  {{- end }}
{{- end }}
{{- $certs := list }}
{{- if $cm.wildcard }}
{{- $certs = append $certs (dict "name" "northline-tls-wildcard" "secret" "northline-tls-wildcard" "dnsNames" (list $zone (printf "*.%s" $zone))) }}
{{- end }}
{{- range $routes }}
{{- if or .custom (not $cm.wildcard) }}
{{- $secret := include "northline.tlsSecret" (dict "root" $ "host" .host "custom" .custom) }}
{{- $certs = append $certs (dict "name" $secret "secret" $secret "dnsNames" (list .host)) }}
{{- end }}
{{- end }}
{{- range $certs }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}
  labels:
    {{- include "northline.labels" (dict "root" $ "app" "edge") | nindent 4 }}
spec:
  secretName: {{ .secret }}
  dnsNames:
    {{- toYaml .dnsNames | nindent 4 }}
  issuerRef:
    name: {{ $iss.name }}
    kind: {{ $issuerKind }}
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  renewBefore: {{ $cm.renewBefore }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
S-31: merchants' own domains, reconciled by the api (docs/runbooks/custom-domains.md). The chart provides what the api
may not create itself: the Issuer of their certificates (Let's Encrypt staging outside prod), the TLS policy of the
shard Gateways, and a Role limited to Gateways, HTTPRoutes and Certificates in this namespace, bound to the api's
ServiceAccount (whose token is then mounted, templates/deployment.yaml).
*/ -}}
{{- $r := $e.domainReconciler }}
{{- if and $e.enabled $r.enabled }}
{{- $cm := $e.certManager }}
{{- $iss := $cm.issuer }}
{{- $useGateway := and .Values.gateway.enabled $e.gateway.create }}
{{- if not $useGateway }}
{{- fail "edge.domainReconciler needs the chart's Gateway (gateway.enabled with edge.gateway.create): merchants' domains get listeners on shard Gateways of the same class" }}
{{- end }}
{{- if not $cm.enabled }}
{{- fail "edge.domainReconciler needs edge.certManager.enabled (one Certificate per merchant domain)" }}
{{- end }}
{{- if not .Values.apps.consumer.enabled }}
{{- fail "edge.domainReconciler needs apps.consumer.enabled (merchant domains are served by the consumer app)" }}
{{- end }}
{{- if or (lt (int $r.listenersPerGateway) 1) (gt (int $r.listenersPerGateway) 64) }}
{{- fail "edge.domainReconciler.listenersPerGateway must be 1–64 (Gateway API allows 64 listeners per Gateway)" }}
{{- end }}
{{- $customServer := include "northline.customIssuerServer" . }}
{{- if and (ne .Values.global.environment "prod") (eq $iss.type "acme") (contains "acme-v02.api.letsencrypt.org" $customServer) }}
{{- fail "edge.domainReconciler.issuer.server: Let's Encrypt production is for prod only — dev and staging use the staging endpoint (rate limits are per account)" }}
{{- end }}
{{- if not (has $r.dns.provider (list "doh" "jndi")) }}
{{- fail (printf "edge.domainReconciler.dns.provider must be doh or jndi (got %q)" $r.dns.provider) }}
{{- end }}
{{- if $r.issuer.create }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $r.issuer.name }}
  labels:
    {{- include "northline.labels" (dict "root" . "app" "edge") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  {{- if eq $iss.type "acme" }}
  acme:
    server: {{ $customServer }}
    email: {{ required "edge.certManager.issuer.email (Let's Encrypt expiry notices)" $iss.email }}
    privateKeySecretRef:
      name: {{ $r.issuer.name }}-account-key
    solvers:
      # Merchants' domains are not in our DNS zone: HTTP-01 only, through the Gateway's port-80 listener (it has no
      # hostname, so it takes every merchant host; the redirect route yields to the challenge's exact path).
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ $e.gateway.name }}
                namespace: {{ .Release.Namespace }}
                kind: Gateway
                sectionName: http
  {{- else if eq $iss.type "ca" }}
  ca:
    secretName: {{ required "edge.certManager.issuer.caSecretName" $iss.caSecretName }}
  {{- else }}
  selfSigned: {}
  {{- end }}
{{- end }}
{{- if eq $e.gateway.className "envoy" }}
---
# The shard Gateways the api creates (label northline.ca/custom-domain=true) get the same client TLS policy as ours.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ $r.gatewayPrefix }}
  labels:
    {{- include "northline.labels" (dict "root" . "app" "edge") | nindent 4 }}
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
      matchLabels:
        northline.ca/custom-domain: "true"
  tls:
    minVersion: {{ $e.tls.minVersion | quote }}
    alpnProtocols: [h2, http/1.1]
  {{- if gt (int $e.trustedProxyHops) 0 }}
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: {{ int $e.trustedProxyHops }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: northline-domain-reconciler
  labels:
    {{- include "northline.labels" (dict "root" . "app" "api") | nindent 4 }}
rules:
  # Only what the reconciler writes, only in this namespace. No Secrets: cert-manager owns the TLS Secrets (and deletes
  # them with their Certificate: enableCertificateOwnerRef in the cert-manager add-on).
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: northline-domain-reconciler
  labels:
    {{- include "northline.labels" (dict "root" . "app" "api") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: northline-domain-reconciler
subjects:
  - kind: ServiceAccount
    name: {{ include "northline.appName" "api" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
