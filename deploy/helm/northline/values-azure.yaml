# Azure (AKS) overlay. Only values: the templates have no cloud logic.
#
# Workload identity: Azure Workload Identity — the ServiceAccounts carry azure.workload.identity/client-id and the pods
# the label azure.workload.identity/use: "true", both from
#   terraform output -json kubernetes | jq '{workloadIdentities: .workload_identities}' > identities.json
# The webhook then injects AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_FEDERATED_TOKEN_FILE, which the Azure SDK
# (Key Vault keys, Blob Storage) reads through DefaultAzureCredential.
#
# Images: <registry>.azurecr.io/northline (terraform output registry.registry_url + /northline); the kubelet identity
# has AcrPull, so no imagePullSecrets.
# Ingress (S-17 decides): AKS application routing → ingress.className: webapprouting.kubernetes.azure.com, or
# ingress-nginx / Application Gateway for Containers (gateway.enabled).
# Azure Managed Redis listens on 10000 (REDIS_PORT in config_env).

networkPolicy:
  enabled: true                   # Cilium (network_policy = cilium in the AKS module) enforces NetworkPolicy

# S-6: secrets from the environment's Key Vault (secret names without prefix) through External Secrets, authenticated
# as the ESO controller's Azure Workload Identity. vaultUrl comes from `terraform output -json helm_values`.
externalSecrets:
  enabled: true
  provider: azure
  remoteKeyPrefix: ""

# S-25: Terraform creates the event hubs from deploy/kafka/topics.yaml (modules/kafka/azure, var.topics); the Job only
# reports differences (the apps' Send+Listen key can't create or alter event hubs). Event Hubs manages replication
# itself, so no min.insync.replicas (overrides values-prod.yaml).
kafkaTopics:
  command: plan
  minInsyncReplicas: ""

apps:
  api:
    env:
      # S-13 (docs/runbooks/email.md): Azure Communication Services Email with Entra ID (workload identity). Also set
      # EMAIL_ENDPOINT=https://<resource>.canada.communication.azure.com — the api refuses to start without it.
      EMAIL_PROVIDER: azure
  worker:
    env:
      # S-27: the notifications consumer emails payout.failed with the same provider as the api.
      EMAIL_PROVIDER: azure
