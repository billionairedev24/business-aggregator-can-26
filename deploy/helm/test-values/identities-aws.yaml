# Shape of `terraform output -json kubernetes | jq '{workloadIdentities: .workload_identities}'` on AWS, with dummy
# values — used only by deploy/helm/validate.sh to render the annotations.
workloadIdentities:
  api: { service_account_annotations: { eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/northline-dev-api" }, pod_labels: {} }
  auth: { service_account_annotations: { eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/northline-dev-auth" }, pod_labels: {} }
  bff: { service_account_annotations: { eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/northline-dev-bff" }, pod_labels: {} }
  worker: { service_account_annotations: { eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/northline-dev-worker" }, pod_labels: {} }
configEnv:
  DB_URL: jdbc:postgresql://northline-dev.example.ca-central-1.rds.amazonaws.com:5432/northline?sslmode=require
  DB_USER: northline_app
  REDIS_HOST: master.northline-dev.example.cache.amazonaws.com
  KMS_PROVIDER: aws
  STORAGE_PROVIDER: s3
edge:
  certManager:
    issuer:
      dns01: { route53: { region: ca-central-1, hostedZoneID: Z0000000000000000000 } }
