# Shape of `terraform output -json helm_values` of infra/terraform/envs/ovh/mks (Managed PostgreSQL, the rest in the cluster; dummy
# values; deploy/helm/validate.sh only). The default location us-east-va (S-160).
global:
  hostingCountry: US
configEnv:
  STORAGE_PROVIDER: s3
  STORAGE_BUCKET: northline-ovh-mks-uploads
  STORAGE_REGION: us-east-va
  STORAGE_ENDPOINT: https://s3.us-east-va.io.cloud.ovh.us
  STORAGE_PATH_STYLE: "true"
  STORAGE_ENCRYPTION_KEY: ""
  KMS_PROVIDER: local
  DB_URL: jdbc:postgresql://postgresql-0a1b2c3d-o4e5f6.database.cloud.ovh.net:20184/northline?sslmode=require
  DB_USER: northline_app
  REDIS_HOST: northline-valkey.northline-dryrun.svc.cluster.local
  REDIS_PORT: "6379"
  REDIS_SSL: "false"
  REDIS_USERNAME: ""
  KAFKA_BOOTSTRAP: northline-kafka.northline-dryrun.svc.cluster.local:9092
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_SASL_MECHANISM: ""
  SEARCH_PROVIDER: meilisearch
  MEILISEARCH_URL: http://northline-meilisearch.northline-dryrun.svc.cluster.local:7700
