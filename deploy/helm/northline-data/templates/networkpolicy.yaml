{{- /* Ingress only from the northline chart's pods; Postgres also from its own instance and the CloudNativePG operator. */ -}}
{{- if .Values.networkPolicy.enabled }}
{{- range $svc, $port := dict "valkey" 6379 "meilisearch" 7700 "kafka" 9092 }}
{{- if (get $.Values $svc).enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: northline-{{ $svc }}
  labels:
    {{- include "data.labels" (dict "root" $ "name" $svc) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "data.selectorLabels" (dict "root" $ "name" $svc) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {{- toYaml $.Values.networkPolicy.clientSelector | nindent 12 }}
      ports:
        - { port: {{ $port }}, protocol: TCP }
{{- end }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    {{- include "data.labels" (dict "root" . "name" "pg") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {{- toYaml .Values.networkPolicy.clientSelector | nindent 12 }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.name }}
      ports:
        - { port: 5432, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { port: 8000, protocol: TCP }   # instance manager status
        - { port: 5432, protocol: TCP }
{{- end }}
{{- end }}
