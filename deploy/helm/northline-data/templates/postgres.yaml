{{- /*
PostgreSQL 17 + PostGIS through CloudNativePG: one instance on a zonal pd-balanced volume, TLS on (sslmode=require in
DB_URL), the database and its owner from initdb, the extensions created once as the superuser. Backups: base backup
daily + continuous WAL archiving to the bucket Terraform created — GCS as the backup identity (GKE Workload Identity on
the ServiceAccount CloudNativePG creates for the cluster), or an S3-compatible store (OVHcloud Object Storage) with
static keys from a Secret.
*/ -}}
{{- with .Values.postgres }}
{{- if .enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .name }}
  labels:
    {{- include "data.labels" (dict "root" $ "name" "pg") | nindent 4 }}
spec:
  instances: {{ .instances }}
  imageName: {{ .imageName }}
  enableSuperuserAccess: false
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: northline-data
  postgresql:
    parameters:
      {{- toYaml .parameters | nindent 6 }}
  bootstrap:
    initdb:
      database: {{ .database }}
      owner: {{ .owner }}
      secret:
        name: {{ .name }}-app
      postInitApplicationSQL:
        {{- range .extensions }}
        - CREATE EXTENSION IF NOT EXISTS {{ . }};
        {{- end }}
  storage:
    size: {{ .storage.size }}
    storageClass: {{ $.Values.storageClassName }}
  resources:
    {{- toYaml .resources | nindent 4 }}
  {{- if $.Values.pinToZone }}
  affinity:
    nodeSelector:
      topology.kubernetes.io/zone: {{ required "zone" $.Values.zone | quote }}
  {{- end }}
  {{- if .backup.enabled }}
  {{- if eq .backup.provider "gcs" }}
  serviceAccountTemplate:
    metadata:
      annotations:
        {{- toYaml .backup.serviceAccountAnnotations | nindent 8 }}
  {{- end }}
  backup:
    retentionPolicy: {{ .backup.retentionPolicy | quote }}
    barmanObjectStore:
      {{- if eq .backup.provider "gcs" }}
      destinationPath: gs://{{ .backup.bucket }}
      googleCredentials:
        gkeEnvironment: true
      {{- else }}
      destinationPath: s3://{{ .backup.bucket }}/
      endpointURL: {{ required "postgres.backup.s3.endpointURL (terraform output data_values)" .backup.s3.endpointURL }}
      s3Credentials:
        accessKeyId: { name: {{ .backup.s3.credentialsSecret }}, key: ACCESS_KEY_ID }
        secretAccessKey: { name: {{ .backup.s3.credentialsSecret }}, key: ACCESS_SECRET_KEY }
        region: { name: {{ .backup.s3.credentialsSecret }}, key: REGION }
      {{- end }}
      wal:
        compression: gzip
      data:
        compression: gzip
  {{- end }}
{{- if .backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .name }}-daily
  labels:
    {{- include "data.labels" (dict "root" $ "name" "pg") | nindent 4 }}
spec:
  schedule: {{ .backup.schedule | quote }}
  backupOwnerReference: self
  immediate: true
  cluster:
    name: {{ .name }}
{{- end }}
{{- end }}
{{- end }}
