{{- /*
Kafka 4 in KRaft mode: one node that is broker and controller, PLAINTEXT on 9092 inside the namespace, its log on a
zonal volume. Replication factor 1 everywhere (one broker); topics are created by the northline chart's kafkaTopics
Job (deploy/kafka/topics.yaml), never auto-created. The image writes its configuration at start, so its root file
system stays writable.
*/ -}}
{{- with .Values.kafka }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: northline-kafka
  labels:
    {{- include "data.labels" (dict "root" $ "name" "kafka") | nindent 4 }}
spec:
  selector:
    {{- include "data.selectorLabels" (dict "root" $ "name" "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: northline-kafka
  labels:
    {{- include "data.labels" (dict "root" $ "name" "kafka") | nindent 4 }}
spec:
  serviceName: northline-kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "data.selectorLabels" (dict "root" $ "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data.labels" (dict "root" $ "name" "kafka") | nindent 8 }}
    spec:
      {{- include "data.nodeSelector" $ | nindent 6 }}
      enableServiceLinks: false        # no KAFKA_*-looking variables from Services
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kafka
          image: "{{ .image.repository }}:{{ .image.tag }}"
          env:
            - { name: CLUSTER_ID, value: {{ .clusterId | quote }} }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://northline-kafka.{{ $.Release.Namespace }}.svc.cluster.local:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_MIN_INSYNC_REPLICAS, value: "1" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: {{ .retentionHours | quote }} }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms{{ .heap }} -Xmx{{ .heap }}" }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          startupProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: controller }
            periodSeconds: 20
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
            readOnlyRootFilesystem: false
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $.Values.storageClassName }}
        resources: { requests: { storage: {{ .storage.size }} } }
{{- end }}
{{- end }}
