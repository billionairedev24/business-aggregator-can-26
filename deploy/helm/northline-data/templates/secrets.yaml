{{- /*
The services' credentials: generated by Terraform into Secret Manager (northline-<env>-db-app-password,
-redis-password, -meilisearch-api-key) and written here by External Secrets — the same secrets the northline chart
maps into the apps, so both sides always agree. provider none (OVHcloud): nothing here, the Secrets are created by
scripts/ovh/secrets.sh.
*/ -}}
{{- $es := .Values.externalSecrets }}
{{- if eq $es.provider "gcp" }}
{{- if or .Values.postgres.enabled .Values.valkey.enabled .Values.meilisearch.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $es.store.name }}
  labels:
    {{- include "data.labels" (dict "root" . "name" "secrets") | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ required "externalSecrets.gcp.projectID (terraform output data_values)" $es.gcp.projectID }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
# CloudNativePG wants a basic-auth Secret for the database owner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.name }}-app
  labels:
    {{- include "data.labels" (dict "root" . "name" "pg") | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: SecretStore, name: {{ $es.store.name }} }
  target:
    name: {{ .Values.postgres.name }}-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.owner | quote }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "data.remoteKey" (dict "root" . "key" "DB_PASSWORD") | quote }}
{{- end }}
{{- range $svc, $key := dict "valkey" "REDIS_PASSWORD" "meilisearch" "MEILISEARCH_API_KEY" }}
{{- if (get $.Values $svc).enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: northline-{{ $svc }}
  labels:
    {{- include "data.labels" (dict "root" $ "name" $svc) | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: { kind: SecretStore, name: {{ $es.store.name }} }
  target:
    name: northline-{{ $svc }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ include "data.remoteKey" (dict "root" $ "key" $key) | quote }}
{{- end }}
{{- end }}
{{- end }}
