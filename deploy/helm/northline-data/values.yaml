# Northline in-cluster data services — defaults. Install into the environment's namespace before the northline
# chart (its migration and Kafka topics Jobs need Postgres and Kafka):
#
#   helm upgrade --install northline-data deploy/helm/northline-data -n northline-dryrun \
#     -f northline-data-values.json --wait      # terraform output -json data_values (infra/terraform/envs/gcp/dryrun)
#
# Terraform's config_env points the apps at the Services below (northline-pg-rw, northline-valkey,
# northline-meilisearch, northline-kafka); a service set to external there is disabled here (data_values).

# The one zone of the cluster: every pod with a volume is pinned to it (zonal persistent disks).
zone: ""
# StorageClass of the volumes. GKE: standard-rwo = pd-balanced, WaitForFirstConsumer.
storageClassName: standard-rwo

# Credentials from the secrets manager (Secret Manager on Google Cloud), generated by Terraform: remoteKeys.<VAR> =
# the remote secret (terraform output data_values.externalSecrets.remoteKeys). The store authenticates as the External
# Secrets controller's workload identity, like the northline chart's.
externalSecrets:
  provider: gcp                   # gcp only for now (the dry run); aws | azure would follow the northline chart
  refreshInterval: 1h
  store:
    name: northline-data
  gcp:
    projectID: ""
  remoteKeys: {}                  # DB_PASSWORD, REDIS_PASSWORD, MEILISEARCH_API_KEY

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities: { drop: [ALL] }

# Who may connect: the northline chart's pods (and its Jobs) in this namespace.
networkPolicy:
  enabled: true
  clientSelector:
    matchLabels:
      app.kubernetes.io/part-of: northline

# PostgreSQL 17 + PostGIS: a CloudNativePG Cluster (operator installed once per cluster, namespace cnpg-system).
postgres:
  enabled: true
  name: northline-pg              # Services northline-pg-rw / -ro / -r; ServiceAccount northline-pg (backup identity)
  # Needs barman-cloud inside for the backups below (CloudNativePG's PostGIS images; the "system" variants carry it).
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5
  instances: 1
  database: northline
  owner: northline_app            # DB_USER (Terraform config_env); its password is DB_PASSWORD
  # Created once in the database after initdb, as the superuser (V001 then finds them).
  extensions: [postgis, citext, pgcrypto]
  storage:
    size: 10Gi
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits: { memory: 1Gi }
  parameters:
    max_connections: "120"        # 6 Spring apps × pool 10 + Jobs, with room
    shared_buffers: 256MB
  backup:
    enabled: true
    bucket: ""                    # Terraform data_values.backup.bucket (gs://<bucket>)
    serviceAccountAnnotations: {} # iam.gke.io/gcp-service-account of the backup identity (Terraform)
    retentionPolicy: 7d
    schedule: "0 0 3 * * *"       # CloudNativePG cron has seconds: daily at 03:00 UTC

valkey:
  enabled: true
  image: { repository: valkey/valkey, tag: 8.1-alpine }
  storage:
    size: 1Gi                     # append-only file: sessions survive a pod restart
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  maxmemory: 192mb

meilisearch:
  enabled: true
  image: { repository: getmeili/meilisearch, tag: v1.15.2 }
  storage:
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# One KRaft node (broker + controller), PLAINTEXT inside the namespace. The northline chart's kafkaTopics Job
# creates the topics (replication factor 1); auto-creation stays off as everywhere else.
kafka:
  enabled: true
  image: { repository: apache/kafka, tag: 4.1.0 }
  clusterId: bm9ydGhsaW5lLWRyeXJ1bg   # any 22-character base64 id, fixed so a new pod keeps the volume's cluster
  heap: 512m
  storage:
    size: 10Gi
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 1Gi }
  retentionHours: 168
