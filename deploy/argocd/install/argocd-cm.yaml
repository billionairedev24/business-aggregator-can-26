apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # App of apps: the root Application waits for a child Application (sync wave by sync wave) only while that child
  # syncs by itself (dev). A child with manual sync (staging, prod) counts as healthy for the root, so the root never
  # waits for a human; its own status still shows OutOfSync until a deployer syncs it.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.spec ~= nil and (obj.spec.syncPolicy == nil or obj.spec.syncPolicy.automated == nil) then
      hs.status = "Healthy"
      hs.message = "manual sync"
      return hs
    end
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
  # Single sign-on (GitHub, GitLab, Entra ID, Google) goes here as oidc.config or dex.config, with the groups claim the
  # AppProject deployer roles use (docs/runbooks/gitops.md § Access). Then set admin.enabled: "false".
