# Northline prod — the app of apps (deploy/argocd/app-of-apps) for the Argo CD running in the prod cluster.
# prod: manual sync. Promotion = a reviewed PR copying staging's images.yaml, then a deployer syncs in a sync window.
# Changes to this file go through a PR like any other; the root Application picks them up by itself.
environment: prod
# The cloud this environment runs on (aws | gcp | azure): selects the chart's values-<cloud>.yaml and the add-ons'
# per-cloud values. Moving the environment to another cloud = a new Terraform env root + this line + infra.yaml.
cloud: aws
# GitHub (default) or GitLab: https://gitlab.com/<group>/<project>.git works the same (docs/runbooks/gitops.md).
repoURL: https://github.com/billionairedev24/business-aggregator-can-26.git
targetRevision: main

sync:
  automated: false

project:
  # SSO groups allowed to sync prod (Argo CD OIDC / Dex groups claim).
  deployerGroups: [northline:platform]
  # No prod syncs on weekends or outside business hours in Calgary (manual syncs included); emergencies: a platform
  # admin disables the window in Argo CD (logged).
  syncWindows:
    - kind: allow
      schedule: "0 8 * * 1-4"       # Mon–Thu 08:00 America/Edmonton, for 9 hours
      duration: 9h
      timeZone: America/Edmonton
      applications: ["*"]

addons:
  external-secrets:
    enabled: true
  # S-17 edge (docs/runbooks/edge.md): Gateway API, certificates, DNS records.
  envoy-gateway:
    enabled: true
  cert-manager:
    enabled: true
  external-dns:
    enabled: true
