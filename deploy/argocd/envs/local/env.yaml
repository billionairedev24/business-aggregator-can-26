# Local rehearsal on kind (docs/runbooks/gitops.md § Local rehearsal): the same app of apps against a kind cluster,
# with the chart's values-local-kind.yaml. repoURL is replaced by deploy/argocd/kind/rehearse.sh with the in-cluster
# Git server it starts (a copy of your working tree); nothing here reaches a cloud.
environment: local
cloud: kind
repoURL: http://git-server.argocd.svc.cluster.local/northline.git
targetRevision: main

sync:
  automated: true

northline:
  valueFiles: [values-local-kind.yaml]
