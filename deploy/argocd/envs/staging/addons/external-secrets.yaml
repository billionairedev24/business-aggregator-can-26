# External Secrets Operator identity in staging, from Terraform:
#   terraform -chdir=infra/terraform/envs/<cloud>/staging output -json kubernetes \
#     | jq '.workload_identities["external-secrets"] | {serviceAccount: {annotations: .service_account_annotations}}'
# AWS eks.amazonaws.com/role-arn · Google Cloud iam.gke.io/gcp-service-account · Azure azure.workload.identity/client-id
serviceAccount:
  annotations: {}
