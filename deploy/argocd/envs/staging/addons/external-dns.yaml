# external-dns in staging: provider settings, the zone filter and the identity, from Terraform:
#   terraform -chdir=infra/terraform/envs/<cloud>/staging output -json gitops_addon_values | jq '.["external-dns"]' | yq -P
# Until then it runs with no zone (domainFilters empty = it would manage every zone the identity can see, which is
# none: the identity only exists once Terraform is applied).
txtOwnerId: northline-staging
domainFilters: []
serviceAccount:
  annotations: {}
