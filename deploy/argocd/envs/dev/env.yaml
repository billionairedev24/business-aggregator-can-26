# Northline dev — the app of apps (deploy/argocd/app-of-apps) for the Argo CD running in the dev cluster.
# dev: Argo CD applies every commit to main by itself (prune + self-heal).
# Changes to this file go through a PR like any other; the root Application picks them up by itself.
environment: dev
# The cloud this environment runs on (aws | gcp | azure): selects the chart's values-<cloud>.yaml and the add-ons'
# per-cloud values. Moving the environment to another cloud = a new Terraform env root + this line + infra.yaml.
cloud: aws
# GitHub (default) or GitLab: https://gitlab.com/<group>/<project>.git works the same (docs/runbooks/gitops.md).
repoURL: https://github.com/billionairedev24/business-aggregator-can-26.git
targetRevision: main

sync:
  automated: true

project:
  # SSO groups allowed to sync dev (Argo CD OIDC / Dex groups claim).
  deployerGroups: [northline:platform, northline:developers]

addons:
  external-secrets:
    enabled: true
