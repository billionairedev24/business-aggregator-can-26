# Envoy proxies of the northline Gateway on Google Cloud (GKE): two replicas (one per zone when the cluster has several), a public
# layer-4 load balancer in front, client addresses kept (externalTrafficPolicy: Local).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: northline
  namespace: envoy-gateway-system
spec:
  # S-31: every Gateway of the class shares these proxies and their one load balancer — the environment's Gateway and
  # the api's shard Gateways for merchants' domains (northline-custom-N) — so pages.<zone> is the single target.
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyService:
        externalTrafficPolicy: Local
        # GKE's default for type LoadBalancer: an external passthrough Network Load Balancer (regional).
        annotations: {}
