# Envoy proxies of the northline Gateway on AWS (EKS): two replicas (one per zone when the cluster has several), a public
# layer-4 load balancer in front, client addresses kept (externalTrafficPolicy: Local).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: northline
  namespace: envoy-gateway-system
spec:
  # S-31: every Gateway of the class shares these proxies and their one load balancer — the environment's Gateway and
  # the api's shard Gateways for merchants' domains (northline-custom-N) — so pages.<zone> is the single target.
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
      envoyService:
        externalTrafficPolicy: Local
        # A Network Load Balancer from EKS's built-in service controller (public subnets are tagged
        # kubernetes.io/role/elb). With the AWS Load Balancer Controller installed, use
        # aws-load-balancer-type: external + aws-load-balancer-nlb-target-type: ip instead.
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
          service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
