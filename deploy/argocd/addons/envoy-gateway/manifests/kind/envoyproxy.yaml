# kind rehearsal: no cloud load balancer; the proxies are reached through a NodePort / port-forward.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: northline
  namespace: envoy-gateway-system
spec:
  # S-31: every Gateway of the class shares these proxies and their one load balancer — the environment's Gateway and
  # the api's shard Gateways for merchants' domains (northline-custom-N) — so pages.<zone> is the single target.
  mergeGateways: true
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
      envoyService:
        type: NodePort
