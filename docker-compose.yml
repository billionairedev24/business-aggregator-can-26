# Local stack. All data stays on your machine; prod runs in AWS ca-central-1.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment: { POSTGRES_DB: northline, POSTGRES_USER: northline, POSTGRES_PASSWORD: northline }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U northline"], interval: 5s, retries: 10 }
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    environment: { discovery.type: single-node, xpack.security.enabled: "false", ES_JAVA_OPTS: "-Xms1g -Xmx1g" }
    ports: ["9200:9200"]
    volumes: [es:/usr/share/elasticsearch/data]
  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.3
    environment: { ELASTICSEARCH_HOSTS: http://elasticsearch:9200 }
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment: { KAFKA_CLUSTERS_0_NAME: local, KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092 }
    ports: ["8090:8080"]
    depends_on: [kafka]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes: { pg: {}, es: {} }
